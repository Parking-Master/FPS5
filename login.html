<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | FPS5</title>
    <style>
      @font-face {
        font-family: "Aperture";
        src: url(/fonts/Aperture.ttf);
      }
      @keyframes active-animation {
        50% {
          box-shadow: inset 0 0 40px rgba(255, 255, 255, 0.4);
        }
      }
      html, body {
        margin: 0 !important;
        font-family: Arial, Helvetica, sans-serif;
      }
      .wrapper {
        position: absolute;
        width: 100%;
        height: 100%;
        margin: 0;
        background: #cdd3d8;
        border: 20px solid #d9d9d9;
        box-sizing: border-box;
        background-image: url(/images/menu/splatter.png);
        background-repeat: no-repeat;
        background-position: center;
        background-size: 70%;
        min-height: 500px;
      }
      .header {
        font-family: "Aperture", monospace, Arial;
        font-size: 40px;
        color: #5aace1;
        text-align: center;
        margin: 0;
        margin-top: 50px;
      }
      .input-wrapper {
        position: absolute;
        width: 300px;
        left: 50%;
        top: 200px;
        margin-left: -150px;
      }
      .input {
        width: 100%;
        border-radius: 0;
        border: 4px solid #cdd3d8;
        padding: 10px;
        background: #ddd;
        box-sizing: border-box;
        outline: none !important;
        font-family: "Aperture", monospace, Arial;
        color: #333;
        /* box-shadow: 10px 10px 0 #a7bbcc; */
      }
      .input.submit {
        background: #b9c1c9;
        color: #333;
      }
      .input.submit:hover {
        background: #959da6;
      }
      .input.submit:active {
        background: #73787e;
      }
      .input.submit:disabled {
        opacity: .7;
        background: #999;
        color: #444;
      }
      .password-toggle {
        position: absolute;
        margin-top: 8px;
        padding: 2px !important;
        right: 10px;
        background: transparent;
        border: none;
      }
      .password-toggle:hover {
        background: #bfbfc2;
      }
      .password-toggle:active {
        background: #9f9fa1;
      }
      .eye-icon {
        display: block;
        width: 20px;
        height: 20px;
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='%2364748b' stroke-width='1.5'%3e%3cpath stroke-linecap='round' stroke-linejoin='round' d='M15 12a3 3 0 11-6 0 3 3 0 016 0z'/%3e%3cpath stroke-linecap='round' stroke-linejoin='round' d='M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z'/%3e%3c/svg%3e");
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        transition: background-image 0.2s ease;
      }
      .eye-icon.show-password {
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='%2364748b' stroke-width='1.5'%3e%3cpath stroke-linecap='round' stroke-linejoin='round' d='M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 11-4.243-4.243m4.242 4.242L9.88 9.88'/%3e%3c/svg%3e");
      }
      a {
        color: #5aace1 !important;
      }
      .input-wrapper a {
        display: block;
        text-align: center;
        margin-top: 10px;
        font-size: 14px;
      }
      @media only screen and (max-width:800px) {
        .wrapper {
          background-size: 600px;
        }
      }
      @media only screen and (max-height:500px) {
        .input-wrapper {
          top: 150px;
        }
      }
      .swal-overlay {
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
      }
      .swal-overlay, .swal-overlay * {
        animation: none !important;
        transition: none !important;
      }
      .swal-modal {
        width: 300px;
        padding: 0 !important;
        overflow: hidden !important;
        border-radius: 4px;
      }
      .swal-title {
        font-size: 14px;
        margin: 0 !important;
        background: #e0e0e0;
        padding: 8px;
        border-bottom: 1px solid #999;
      }
      .swal-text {
        margin-top: 10px;
      }
      .swal-button {
        border-radius: 2px;
        background: #999;
        box-shadow: none !important;
        padding: 8px;
        color: #eee;
        font-family: "Aperture", monospace, Arial;
        font-size: 16px;
      }
      .swal-button:hover {
        background: #777 !important;
      }
      .swal-content__input {
        border: 1px solid #999;
        border-radius: 0;
        padding: 5px !important;
        outline: none !important;
        font-family: "Aperture", monospace, Arial;
      }
      .swal-content__input:focus {
        border: 1px solid #555;
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/sweetalert@2.1.2/dist/sweetalert.min.js"></script>
    <script src="/js/user.js"></script>
    <div class="wrapper">
      <h1 class="header">LOG IN</h1>
      <div class="input-wrapper">
        <input class="input username" type="text" placeholder="Username">
        <input class="input password" type="password" placeholder="Password">
        <button type="button" class="password-toggle" id="passwordToggle" onclick="togglePassword(this)"><span class="eye-icon"></span></button>
        <input class="input submit" type="button" value="Continue >">
        <a href="#" onclick="resetPassword()">Reset password</a>
      </div>
    </div>
    <script>
      if (user.loggedIn) location.replace("/");
      let params = new URLSearchParams(location.search);
      if (params.get("p")) {
        let email = params.get("e");
        let verificationKey = params.get("v");
        if (email && verificationKey) {
          function next() {
            swal({
              title: "Reset password",
              text: "Choose your new password (8-60 characters):",
              content: "input",
              buttons: ["Cancel", "Next"],
              closeOnEnterKey: false,
              closeOnSpaceKey: false,
              closeOnEsc: false,
              closeOnClickOutside: false
            }).then(function(password) {
              if (password && typeof password === "string" && password.trim() && password.trim().length >= 8 && password.trim().length <= 60) {
                user.resetPassword(email, verificationKey, password, function(success) {
                  if (success) {
                    location.replace("/login.html?s=3");
                  } else {
                    location.replace("/login.html?s=2");
                  }
                });
                swal({
                  text: "Please wait...",
                  button: false,
                  closeOnEnterKey: false,
                  closeOnSpaceKey: false,
                  closeOnEsc: false,
                  closeOnClickOutside: false
                });
              } else {
                swal({
                  title: "Error resetting password",
                  text: "Please enter a valid password.",
                  button: "Close",
                  closeOnEnterKey: false
                }).then(() => next());
              }
            });
          }
          next();
        }
      }
      if (params.get("s")) {
        if (params.get("s") == "3") {
          swal({
            title: "Success",
            text: "Your password has been reset!",
            button: "Close"
          });
        } else if (params.get("s") == "2") {
          swal({
            title: "Error resetting password",
            text: "Your password could not be reset. Make sure that link isn't expired.",
            button: "Close"
          });
        } else if (params.get("s") == "1") {
          swal({
            title: "Success",
            text: "Your account has been created! You can now log in.",
            button: "Close"
          });
        } else if (params.get("s") == "0") {
          swal({
            title: "Error signing up",
            text: "Your account could not be created. Make sure that link isn't expired.",
            button: "Close"
          });
        }
        window.history.replaceState({}, document.title, "/login.html");
      }
      let usernameInput = document.querySelector(".username");
    //   let emailInput = document.querySelector(".email");
      let passwordInput = document.querySelector(".password");
      let submitButton = document.querySelector(".submit");
      function togglePassword(button) {
        button.querySelector(".eye-icon").classList.toggle("show-password");
        if (passwordInput.type == "text") {
          passwordInput.type = "password";
        } else {
          passwordInput.type = "text";
        }
      }
      let submitted = false;
      function login() {
        if (submitted) return;
        submitted = true;
        function resetButton() {
          submitted = false;
          submitButton.disabled = "";
        }
        submitButton.disabled = "disabled";
        let username = usernameInput.value.trim();
        let password = passwordInput.value.trim();
        if (username && password) {
          user.login(username, password, function(success, reason) {
            if (success) {
              if (reason == 0) {
                swal({
                  text: "Logged in! Redirecting...",
                  button: false
                });
              } else {
                let redirect = new URLSearchParams(location.search).get("r");
                if (redirect) {
                  location.href = redirect;
                } else {
                  location.href = "/";
                }
              }
            } else {
              resetButton();
              if (reason == 0) {
                swal({
                  title: "Error logging in",
                  text: "That username or password is incorrect.",
                  button: "Close"
                });
              } else {
                swal({
                  title: "Error logging in",
                  text: "Our server is currently down. Please try again later.",
                  button: "Close"
                });
              }
            }
          });
        } else {
          resetButton();
        }
      }
      function resetPassword() {
        swal({
          title: "Reset password",
          text: "Enter your email address:",
          content: "input",
          buttons: ["Cancel", "Next"],
          closeOnEnterKey: false
        }).then(function(email) {
          if (email && typeof email === "string" && email.trim()) {
            email = email.trim();
            if (/^(([^<>()[\]\.,;:\s@\"]+(\.[^<>()[\]\.,;:\s@\"]+)*)|(\".+\"))@(([^<>()[\]\.,;:\s@\"]+\.)+[^<>()[\]\.,;:\s@\"]{2,})$/i.test(email)) {
              user.sendPasswordReset(email);
              swal({
                title: "Verify your email",
                text: "We've sent you an email. Click the link in it to change your password.",
                button: "Close"
              });
            } else {
              swal({
                title: "Error resetting password",
                text: "Please enter a valid email address.",
                button: "Close",
                closeOnEnterKey: false
              }).then(() => resetPassword());
            }
          }
        })
        document.querySelector(".swal-content__input").placeholder = "email@example.com";
      }
      submitButton.addEventListener("click", function(event) {
        event.preventDefault();
        login();
      });
      document.addEventListener("keydown", function(event) {
        if (!event.repeat && event.key == "Enter" && !swal.getState().isOpen) {
          login();
        }
      });
    </script>
  </body>
</html>
