<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Chat | FPS5</title>
    <style>
      @font-face {
        font-family: "Aperture";
        src: url(/fonts/Aperture.ttf);
      }
      html, body {
        margin: 0 !important;
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden !important;
      }
      .wrapper {
        position: absolute;
        width: 100%;
        height: 100%;
        margin: 0;
        background: #cdd3d8;
        box-sizing: border-box;
        background-image: url(/images/menu/splatter.png);
        background-repeat: no-repeat;
        background-position: center;
        background-size: 70%;
      }
      .chat-header {
        color: #2b78aa;
        font-family: "Aperture";
        font-size: 36px;
      }
      .chat-description {
        color: #999;
        font-family: "Aperture";
        font-size: 14px;
        border-left: 3px solid #aaa;
        padding-left: 10px;
        max-width: 400px;
      }
      .chat-wrapper {
        position: relative;
        margin-left: 100px;
        margin-top: 40px;
        box-sizing: border-box;
        max-width: 600px;
        height: 100%;
        overflow: hidden;
      }
      .chat-wrapper > * {
        flex: 1;
      }
      .sidebar-wrapper {
        position: absolute;
        right: 0;
        top: 0;
        width: 300px;
        background: #eee;
        height: 100%;
        box-sizing: border-box;
        padding: 40px 20px;
        overflow-y: scroll;
      }
      .message-list {
        position: relative;
        width: 100%;
        height: calc(100% - 120px);
        overflow-y: scroll;
        overflow-x: hidden;
        -ms-overflow-style: none;
        scrollbar-width: none;
        padding-bottom: 100px;
        border-left: 1px solid #aaa;
      }
      .message-list::-webkit-scrollbar { 
        display: none;
      }
      .message {
        position: relative;
        max-width: 100%;
        width: max-content;
        font-family: "Aperture" !important;
        color: #333 !important;
        margin-top: 10px;
        margin-left: 20px;
      }
      .message:last-child {
        margin-bottom: 100px;
      }
      .message.message-invite .message-text {
        box-shadow: 10px 0 0 #6aace1;
      }
      .message-header {
        position: relative;
        width: 100%;
        height: 30px;
        padding: 5px;
      }
      .message-header * {
        display: inline-block;
        line-height: 30px;
      }
      .message-header .message-profile-picture {
        position: relative;
        width: 30px;
        height: 30px;
        float: left;
        background-image: url(https://cdn.jsdelivr.net/gh/Parking-Master/Parking-Master@latest/img/profile-picture.png);
        background-size: 100%;
        background-repeat: no-repeat;
        background-color: #fff;
        border: 2px solid #2b78aa;
        border-radius: 100%;
        box-sizing: border-box;
      }
      .message-header .message-username {
        margin-left: 10px;
        cursor: pointer;
      }
      .message-header .message-username:hover {
        text-decoration: underline;
      }
      .message-text {
        width: 100%;
        background: #fff;
        padding: 10px;
        box-sizing: border-box;
        font-size: 16px;
        word-wrap: break-word;
      }
      .chat-controls {
        position: relative;
        width: 100%;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        top: 0;
        margin: 20px 0;
      }
      .chat-input-box {
        flex: 6;
        padding: 10px;
        border-left: none !important;
        outline: none !important;
        font-size: 16px;
      }
      .chat-controls > * {
        margin: 0;
        height: 100%;
        box-sizing: border-box;
        border: none;
        border-left: 1px solid #ddd;
        border-radius: 0 !important;
        background: #fff;
      }
      .chat-button {
        flex: 1;
        width: 40px;
        background-size: 18px;
        background-repeat: no-repeat;
        background-position: center;
      }
      .chat-button-send {
        background-image: url(/images/menu/chat-button-send.png);
      }
      .chat-button-reference {
        background-image: url(/images/menu/chat-button-reference.png);
      }
      .chat-button-invite {
        background-image: url(/images/menu/chat-button-invite.png);
      }
      .chat-button:hover {
        background-color: #eee;
      }
      .chat-button:active {
        background-color: #ddd;
      }
      .sidebar-header {
        font-size: 24px;
      }
      .sidebar-text {
        margin: 15px 0;
        border-bottom: 1px solid #ddd;
        padding-bottom: 15px;
      }
      .player-list {
        display: flex;
        flex-wrap: wrap;
      }
      .player {
        height: 100px !important;
        background-image: url(https://cdn.jsdelivr.net/gh/Parking-Master/Parking-Master@latest/img/profile-picture.png);
        background-size: 80%;
        background-position: center;
        background-repeat: no-repeat;
        flex: 1;
        flex-basis: 0%;
        flex-basis: calc(50% - 20px);
        margin: 10px;
        max-width: calc(50% - 20px);
        cursor: pointer;
      }
      .player:hover {
        background-color: #ddd;
      }
      .status {
        position: relative;
        float: left;
        width: 10px;
        height: 10px;
        border-radius: 100%;
        background: #5cb85c;
        margin: 3px;
      }
      a {
        color: #5aace1 !important;
      }
      @media only screen and (max-width:1060px) {
        .chat-wrapper {
          margin-left: 40px;
        }
      }
      @media only screen and (max-width:960px) {
        .chat-wrapper {
          max-width: 500px;
        }
      }
      @media only screen and (max-width:860px) {
        .chat-wrapper {
          max-width: 400px;
        }
      }
      @media only screen and (max-width:760px) {
        .player {
          flex-basis: calc(33.3% - 20px);
          max-width: calc(33.3% - 20px);
        }
        .sidebar-wrapper {
          width: 250px;
        }
      }
      @media only screen and (max-width:700px) {
        .sidebar-wrapper {
          display: none;
        }
        .chat-wrapper {
          max-width: 100%;
          margin: 30px;
        }
      }
      .loader-banner {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        background: #d9d9d9;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity .3s;
        pointer-events: none !important;
      }
      .loader {
        position: absolute;
        width: 40px;
        height: 60px;
      }
      .loader::before, .loader::after {
        content: "";
        position: absolute;
        inset: 0;
        background: #5aace1;
        clip-path: polygon(0 0,100% 0, 100% 67%,50% 67%,50% 34%,0 34%);
        animation: sp7 2s infinite;
      }
      .loader::after {
        --s: -1, -1;
      }
      @keyframes sp7 {
        0%, 10% { transform: scale(var(--s, 1)) translate(0,0) rotate(0deg) }
        33% { transform:scale(var(--s, 1)) translate(0,-20px) rotate(0deg) }
        66% { transform:scale(var(--s, 1)) translate(10px,-20px) rotate(-90deg) }
        90%, 100% { transform:scale(var(--s, 1)) translate(10px,-10px) rotate(-90deg) }
      }
      #NotiflixNotifyWrap a {
        color: #fff !important;
      }
      .notiflix-loading {
        background: rgba(0, 0, 0, .6) !important;
      }
      .notiflix-loading-icon {
        animation: flicker 1s step-end infinite;
      }
      .notiflix-report, notiflix-confirm {
        z-index: 10000 !important;
      }
      .notiflix-report-button, .notiflix-confirm-buttons a {
        color: #fff !important;
      }
      .notiflix-report-icon {
        width: 70px !important;
        height: 70px !important;
      }
      .window {
        position: absolute;
        max-width: 600px;
        max-height: 400px;
        width: 100%;
        height: 100%;
        background: #fff;
        border: 8px solid #5aace1;
        border-top: none;
        left: 50%;
        top: 50%;
        margin-left: -300px;
        margin-top: -200px;
        z-index: 9999;
        overflow-y: scroll;
        scrollbar-width: thin !important;
        padding: 20px;
        box-sizing: border-box;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        display: none;
      }
      .window-header {
        font-size: 30px;
        font-family: "Aperture";
      }
      .window-close {
        float: right;
        cursor: pointer !important;
      }
      @media only screen and (max-width:600px) {
        .window {
          left: 0;
          margin-left: 0;
        }
      }
      @media only screen and (max-height:400px) {
        .window {
          top: 0;
          margin-top: 0;
        }
      }
      .lobby-list {
        position: relative;
        width: 100%;
      }
      .lobby {
        width: 100%;
        height: 60px;
        margin-bottom: 10px;
        background: #eee;
        box-sizing: border-box;
        padding: 10px;
        cursor: pointer !important;
        overflow-x: scroll;
        overflow-y: hidden;
        white-space: nowrap;
        scrollbar-width: thin;
      }
      .lobby:hover {
        background: #ddd;
      }
      .lobby:active {
        background: #aaa;
      }
      .lobby * {
        pointer-events: none !important;
      }
      .lobby-map-preview {
        position: relative;
        width: 60px;
        height: 38px;
        background-color: #ccc;
        background-size: cover;
        float: left;
        margin-right: 20px;
      }
      .lobby-map-name {
        position: relative;
        width: 100%;
        top: 20px;
        color: #eee;
        text-align: center;
        font-family: "Aperture";
        font-size: 10px;
        text-shadow: 0 0 2px #000;
        white-space: nowrap;
        display: inline-block;
      }
      .lobby-name {
        font-size: 20px;
      }
      .lobby-info {
        font-size: 12px;
        color: #888;
      }
      .lobby-status {
        position: relative;
        width: 10px;
        height: 10px;
        float: right;
        margin: auto 0;
        border-radius: 100%;
        top: -24px;
      }
      .lobby-status.lobby-status-active {
        background: #00ff00;
      }
      .lobby-status.lobby-status-inactive {
        background: #ff0000;
      }
      .lobby-status.lobby-status-full {
        background: #ffd500;
      }
      .lobbies-description {
        color: #999;
        font-size: 14px;
        margin: 10px 0;
        border-left: 3px solid #ddd;
        padding-left: 10px;
      }
      .lobby-status-player-count {
        font-size: 10px;
        left: -20px;
        position: relative;
        color: #999;
        top: -5px;
      }
      .reference-user-list {
        border: 1px solid #ddd;
        max-height: 100px;
        overflow-y: scroll;
      }
      .reference-user-entry {
        display: block;
        margin: 10px 0;
      }
      .player-context-menu {
        position: fixed;
        background: #fff;
        border: 1px solid #ccc;
        color: #000;
      }
      .player-context-menu-header {
        margin: 10px;
        font-size: 20px;
      }
      .player-context-menu-option {
        min-width: 130px;
        margin: 0 10px;
        border-top: 1px solid #ddd;
        padding: 10px 0;
        font-size: 16px;
        cursor: pointer;
      }
      .player-context-menu-option:hover {
        text-decoration: underline;
      }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  </head>
  <body>
    <script src="https://parking-master.github.io/Gametime.js-4.0/gametime.min.js"></script>
    <script src="https://parking-master.github.io/Parking-Master-2.0/notiflix/notiflix-3.2.8.min.js"></script>
    <script src="/js/user.js"></script>
    <div class="window" data-gamepad-scrollable></div>
    <div class="loader-banner">
      <div class="loader"></div>
    </div>
    <div class="wrapper">
      <div class="chat-wrapper">
        <div class="chat-header">World Chat</div>
        <div class="chat-description">Chat with other FPS5 players from anywhere in the world. Remember to follow the <a href="">chatroom rules</a>.</div>
        <div class="chat-controls">
          <input class="chat-input-box" type="text" placeholder="Enter your message here...">
          <div class="chat-button chat-button-send"></div>
          <div class="chat-button chat-button-reference"></div>
          <div class="chat-button chat-button-invite"></div>
        </div>
        <div class="message-list"></div>
      </div>
      <div class="sidebar-wrapper">
        <div class="sidebar-header">Players</div>
        <div class="sidebar-text"><div class="status"></div> <span class="players-amount">0</span> online</div>
        <div class="player-list"></div>
      </div>
    </div>
    <script>
      Notiflix.Loading.init({ svgColor: "#fff" });
      Notiflix.Notify.init({
        messageMaxLength: 1000,
        plainText: false,
        timeout: 5000
      });
      let lastMessageTime = null;
      let users = [];
      let prohibited_words = [];
      let contextMenuOpen = false;
      fetch("/words.json").then(response => response.json()).then(data => (prohibited_words = data.words));

      gametime.set("username", user.data.username);
      gametime.set("player", {
        profilePicture: user.data.profilePicture
      });
      gametime.set("channel", "fps5-world-chat");
      gametime.on("postMessage", function(player, message, username, profilePicture, date) {
        appendMessage(message, username, profilePicture, date);
      });
      gametime.onconnect = function() {
        gametime.update();
      };
      let uuids = [];
      gametime.onupdate = function(player) {
        if (uuids.indexOf(player.uuid) < 0) {
          uuids.push(player.uuid);
          updatePlayersOnline();
        }
      };
      gametime.connect();

      function openWindow(title, content) {
        document.querySelector(".window").innerHTML = `
        <div class="window-header">${title} <span class="window-close">&times;</span></div>
        ${content}
        `;
        document.querySelector(".window").style.display = "block";
        // gamepadMenuControls.enableCursor();
      }
      function closeWindow(removeLoading = true) {
        document.querySelector(".window").style.display = "";
        if (removeLoading) Notiflix.Loading.remove();
        // gamepadMenuControls.disableCursor();
      }
      function updatePlayersOnline() {
        document.querySelector(".player-list").innerHTML = "";
        document.querySelector(".players-amount").textContent = Object.keys(gametime.players).length;
        for (player in gametime.players) {
          document.querySelector(".player-list").innerHTML += `
          <div class="player" style="background-image: url(${gametime.players[player].data.profilePicture})" data-player-username="${gametime.players[player].username}"></div>
          `;
        }
      }
      function formatMessageTime(date) {
        let currentTime = Date.now();
        let result = null;
        let difference = currentTime - date;
        if (difference < 60 * 1000) {
          result = Math.floor(difference / 1000) + "s";
        } else if (difference < 60 * 60 * 1000) {
          result = Math.floor(difference / 60 / 1000) + "m";
        } else if (difference < 24 * 60 * 60 * 1000) {
          result = Math.floor(difference / 60 / 60 / 1000) + "h";
        } else if (difference < 30 * 24 * 60 * 60 * 1000) {
          result = Math.floor(difference / 24 / 60 / 60 / 1000) + "d";
        } else if (difference < 365 * 24 * 60 * 60 * 1000) {
          result = Math.floor(difference / 30 / 24 / 60 / 60 / 1000) + "mo";
        } else {
          result = Math.floor(difference / 365 / 24 / 60 / 60 / 1000) + "y";
        }
        result += " ago";
        return result;
      }
      function formatMessage(message) {
        let result = "";
        let messageSplit = message.split(" ");
        messageSplit.forEach(fragment => {
          if (fragment.startsWith("@")) {
            let username = fragment.replace("@", "").replace(".", "").trim();
            let referencedUser = users.filter(user => user.username == username)[0];
            if (referencedUser) {
              result += `<a href="#" class="player-reference" data-player-username="${username}">${fragment}</a> `;
            } else {
              result += fragment + " ";
            }
          } else {
            result += fragment + " ";
          }
        });
        if (message.startsWith(":invite:")) {
          let inviteData = JSON.parse(message.split(":invite:")[1]);
          result = `
          <a href="#" class="player-reference" data-player-username="${inviteData.sender}" data-player-invite>${inviteData.sender}</a> invited <a href="#" class="player-reference" data-player-username="${inviteData.username}">${inviteData.username}</a> to a game:
          <br>
          <br>
          <a href="/src.html?lobby=${inviteData.lobby}">${inviteData.lobby}</a>
          `;
        }
        result = result.trim();
        return result;
      }
      function sendMessage(customMessage = null) {
        let input = null;
        let message = null;
        if (customMessage == null) {
          input = document.querySelector(".chat-input-box");
          message = input.value.trim().replace(/[<>]/g, "");
        } else {
          message = customMessage;
        }
        if (message.length <= 400 && message.length >= 1) {
          let messageContainsProhibitedWord = false;
          for (let i = 0; i < prohibited_words.length; i++) {
            if (message.toLowerCase().replace(/[0-9]/g, "").match(new RegExp(`\\b(${RegExp.escape(prohibited_words[i])})\\b`, "g"))) messageContainsProhibitedWord = true;
          }
          if (messageContainsProhibitedWord) {
            Notiflix.Notify.warning("You are not allowed to post this message. Please remove any innaproppriate words from your message. If you continue this behaviour, you are at risk of being banned. Learn more at our <a href='/terms.html'>Terms and Conditions</a>.");
          } else {
            let time = Date.now();
            if (time - lastMessageTime < 10000) {
              let timeToWait = Math.ceil((10000 - (time - lastMessageTime)) / 1000);
              Notiflix.Notify.warning(`Please wait ${timeToWait} more seconds to post your next message.`);
            } else {
              user.sendChatMessage(message);
              gametime.run("postMessage", [gametime.player.uuid, message, user.data.username, user.data.profilePicture, time]);
              if (input) input.value = "";
              lastMessageTime = time;
            }
          }
        }
        if (input) input.blur();
      }
      function appendMessage(message, username, profilePicture, date) {
        let messageList = document.querySelector(".message-list");
        let formattedTime = formatMessageTime(date);
        let formattedMessage = formatMessage(message);
        messageList.innerHTML += `
        <div class="message ${formattedMessage.includes("data-player-invite") ? "message-invite" : ""}" data-date="${date}">
          <div class="message-header">
            <div class="message-profile-picture" ${profilePicture ? `style="background-image: url(${profilePicture})"` : ""}></div>
            <div class="message-username" data-player-username="${username}">${username}</div>
            <div class="message-header-separator">&bullet;</div>
            <div class="message-date" title="${new Date(date).toLocaleString()}">${formattedTime}</div>
          </div>
          <div class="message-text">${formattedMessage}</div>
        </div>
        `;
        messageList.scrollTop = messageList.scrollHeight;
      }
      function referenceUser() {
        Notiflix.Confirm.show("Reference User", "Choose a user to reference in your message:", "", "Cancel", () => {}, () => {}, {
          borderRadius: 0,
          titleColor: "#5aace1",
          zindex: 10000
        });
        document.querySelector("#NXConfirmButtonOk").remove();
        document.querySelector("#NXConfirmButtonCancel").style.width = "100%";
        document.querySelector("#NXConfirmButtonCancel").style.margin = "0";
        let usersHtml = users.map(user => `<a class="reference-user-entry" href="#" onclick="event.preventDefault(), addUserReference('${user.username}')">@${user.username}</a>`).join("");
        document.querySelector(".notiflix-confirm-head").innerHTML += `
        <div class="reference-user-list">
          ${usersHtml}
        </div>
        `;
      }
      function addUserReference(username) {
        let input = document.querySelector(".chat-input-box");
        if (input.value.trim()) {
          input.value += " @" + username + " ";
        } else {
          input.value = "@" + username + " ";
        }
        input.focus();
        document.querySelector("#NXConfirmButtonCancel").click();
      }
      function openContextMenu(event) {
        let username = event.target.dataset.playerUsername;
        let menu = document.createElement("div");
        menu.className = "player-context-menu";
        menu.innerHTML = `<div class="player-context-menu-header">${username}</div>`;
        if (users.filter(user => user.username == username).length > 0) menu.innerHTML += `<div class="player-context-menu-option player-context-menu-option-view_profile">View Profile</div>`;
        if (username != user.data.username) {
          menu.innerHTML += `
          <div class="player-context-menu-option player-context-menu-option-invite_to_lobby" data-player-username="${username}">Invite to Lobby</div>
          <div class="player-context-menu-option player-context-menu-option-request_1v1" data-player-username="${username}">Request 1v1</div>
          `;
        }
        menu.innerHTML += `<div class="player-context-menu-option player-context-menu-option-reference_player" data-player-username="${username}">Reference Player</div>`;
        let left = event.pageX;
        let top = event.pageY;
        if (left + 130 > window.innerWidth) left -= 130;
        if (top + 200 > window.innerHeight) top -= 200;
        menu.style = `left: ${left}px; top: ${top}px`;
        document.body.appendChild(menu);
        contextMenuOpen = true;
      }
      function closeContextMenu() {
        document.querySelector(".player-context-menu").remove();
        contextMenuOpen = false;
      }
      let threeLetterMonthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      function openLobbies(username) {
        Notiflix.Loading.circle();
        Notiflix.Loading.change("Fetching latest server data...");
        user.getLobbies(function(lobbies) {
          currentLobbies = lobbies;
          lobbies = lobbies.reverse();
          openWindow("Lobbies", `
          <div class="lobbies-description">Choose the lobby you'd like to invite this user to.</div>
          <div class="lobby-list"></div>
          `);
          for (let i = 0; i < lobbies.length; i++) {
            let lobby = lobbies[i];
            if (lobby.code) continue;
            let lobbyCreationDate = new Date(lobby.creationDate);
            let lobbyCreatedAt = threeLetterMonthNames[lobbyCreationDate.toISOString().split("-")[1] - 1] + " " + lobbyCreationDate.toISOString().split("-")[2].split("T")[0] + " " + lobbyCreationDate.toISOString().split("-")[0] + " " + lobbyCreationDate.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
            let scoreLimit = lobby.timeLimit;
            let timeLimit = lobby.timeLimit;
            if (scoreLimit == null) scoreLimit = "∞";
            if (timeLimit == null) timeLimit = "∞";
            document.querySelector(".lobby-list").innerHTML += `
            <div class="lobby" data-lobby-name="${lobby.name}" data-player-username="${username}">
              <div class="lobby-map-preview" style="background-image: url(/images/map-previews/${lobby.map}.png)"><span class="lobby-map-name">${lobby.map.replace(/_/g, " ")}</span></div>
              <div class="lobby-name">${lobby.name.trim()}</div>
              <div class="lobby-info">${lobbyCreatedAt} &bullet; Mode: <b>${lobby.mode.toUpperCase()}</b> &bullet; Score limit: <b>${scoreLimit}</b> &bullet; Time: <b>${timeLimit}</b> minutes</div>
              <div class="lobby-status lobby-status-${lobby.playersActive < 1 ? "inactive" : lobby.playersActive >= lobby.playersNeeded ? "full" : "active"}"><span class="lobby-status-player-count">${Math.min(lobby.playersActive, lobby.playersNeeded)}/${lobby.playersNeeded}</span></div>
            </div>
            `;
          }
        });
      }
      function inviteToGame(username = null, lobby = null) {
        if (!username) {
          Notiflix.Confirm.show("Invite User", "Who do you want to invite?", "", "Cancel", () => {}, () => {}, {
            borderRadius: 0,
            titleColor: "#5aace1",
            zindex: 10000
          });
          document.querySelector("#NXConfirmButtonOk").remove();
          document.querySelector("#NXConfirmButtonCancel").style.width = "100%";
          document.querySelector("#NXConfirmButtonCancel").style.margin = "0";
          let usersHtml = users.map(user => `<a class="reference-user-entry" href="#" onclick="event.preventDefault(), inviteToGame('${user.username}')">@${user.username}</a>`).join("");
          document.querySelector(".notiflix-confirm-head").innerHTML += `
          <div class="reference-user-list">
            ${usersHtml}
          </div>
          `;
        } else {
          if (document.querySelector("#NXConfirmButtonCancel")) document.querySelector("#NXConfirmButtonCancel").click();
          if (!lobby) {
            openLobbies(username);
          } else {
            sendMessage(`:invite:${JSON.stringify({
              sender: user.data.username,
              username: username,
              lobby: lobby
            })}`);
            Notiflix.Notify.success("Invite sent!");
          }
        }
      }
      let startTime = Date.now();
      user.getAllUsers(function(_users) {
        users = _users;
        user.getChat(function(messages) {
          for (let i = 0; i < messages.length; i++) {
            let message = messages[i];
            appendMessage(message.message, message.username, message.profilePicture, message.createdAt);
          }
          function checkTime() {
            if (Date.now() - startTime > 2000) {
              let loader = document.querySelector(".loader-banner");
              loader.style.opacity = "0";
              setTimeout(() => loader.remove(), 500);
            } else {
              requestAnimationFrame(checkTime);
            }
          }
          checkTime();
        });
      });
      document.querySelector(".chat-input-box").addEventListener("keydown", function(event) {
        if (event.key == "Enter") sendMessage();
      });
      document.addEventListener("click", function(event) {
        if (contextMenuOpen) closeContextMenu();
        if (event.target.className.includes("window-close")) {
          closeWindow();
        } else if (event.target.classList.contains("chat-button-send")) {
          sendMessage();
        } else if (event.target.classList.contains("chat-button-reference")) {
          referenceUser();
        } else if (event.target.classList.contains("chat-button-invite")) {
          inviteToGame();
        } else if (event.target.classList.contains("player")) {
          openContextMenu(event);
        } else if (event.target.classList.contains("player-reference")) {
          event.preventDefault();
          openContextMenu(event);
        } else if (event.target.classList.contains("message-username")) {
          openContextMenu(event);
        } else if (event.target.classList.contains("player-context-menu-option-invite_to_lobby")) {
          inviteToGame(event.target.dataset.playerUsername);
        } else if (event.target.classList.contains("player-context-menu-option-reference_player")) {
          addUserReference(event.target.dataset.playerUsername);
        } else if (event.target.classList.contains("lobby")) {
          closeWindow();
          inviteToGame(event.target.dataset.playerUsername, event.target.dataset.lobbyName);
        }
      });
      setInterval(function() {
        document.querySelectorAll(".message").forEach(element => {
          let date = parseFloat(element.dataset.date);
          element.querySelector(".message-date").textContent = formatMessageTime(date);
        });
      }, 3000);
    </script>
  </body>
</html>
