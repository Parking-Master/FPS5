<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up | FPS5</title>
    <style>
      @font-face {
        font-family: "Aperture";
        src: url(/fonts/Aperture.ttf);
      }
      @keyframes active-animation {
        50% {
          box-shadow: inset 0 0 40px rgba(255, 255, 255, 0.4);
        }
      }
      html, body {
        margin: 0 !important;
        font-family: Arial, Helvetica, sans-serif;
      }
      .wrapper {
        position: absolute;
        width: 100%;
        height: 100%;
        margin: 0;
        background: #cdd3d8;
        border: 20px solid #d9d9d9;
        box-sizing: border-box;
        background-image: url(/images/menu/splatter.png);
        background-repeat: no-repeat;
        background-position: center;
        background-size: 70%;
        min-height: 500px;
      }
      .header {
        font-family: "Aperture", monospace, Arial;
        font-size: 40px;
        color: #5aace1;
        text-align: center;
        margin: 0;
        margin-top: 50px;
      }
      .input-wrapper {
        position: absolute;
        width: 300px;
        left: 50%;
        top: 200px;
        margin-left: -150px;
      }
      .input {
        width: 100%;
        border-radius: 0;
        border: 4px solid #cdd3d8;
        padding: 10px;
        background: #ddd;
        box-sizing: border-box;
        outline: none !important;
        font-family: "Aperture", monospace, Arial;
        color: #333;
        /* box-shadow: 10px 10px 0 #a7bbcc; */
      }
      .input.submit {
        background: #b9c1c9;
        color: #333;
      }
      .input.submit:hover {
        background: #959da6;
      }
      .input.submit:active {
        background: #73787e;
      }
      .input.submit:disabled {
        opacity: .7;
        background: #999;
        color: #444;
      }
      .password-toggle {
        position: absolute;
        margin-top: 8px;
        padding: 2px !important;
        right: 10px;
        background: transparent;
        border: none;
      }
      .password-toggle:hover {
        background: #bfbfc2;
      }
      .password-toggle:active {
        background: #9f9fa1;
      }
      .eye-icon {
        display: block;
        width: 20px;
        height: 20px;
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='%2364748b' stroke-width='1.5'%3e%3cpath stroke-linecap='round' stroke-linejoin='round' d='M15 12a3 3 0 11-6 0 3 3 0 016 0z'/%3e%3cpath stroke-linecap='round' stroke-linejoin='round' d='M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z'/%3e%3c/svg%3e");
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        transition: background-image 0.2s ease;
      }
      .eye-icon.show-password {
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='%2364748b' stroke-width='1.5'%3e%3cpath stroke-linecap='round' stroke-linejoin='round' d='M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 11-4.243-4.243m4.242 4.242L9.88 9.88'/%3e%3c/svg%3e");
      }
      a {
        color: #5aace1 !important;
      }
      .input-wrapper a {
        display: block;
        text-align: center;
        margin-top: 10px;
        font-size: 14px;
      }
      @media only screen and (max-width:800px) {
        .wrapper {
          background-size: 600px;
        }
      }
      @media only screen and (max-height:500px) {
        .input-wrapper {
          top: 150px;
        }
      }
      .swal-overlay {
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
      }
      .swal-overlay, .swal-overlay * {
        animation: none !important;
        transition: none !important;
      }
      .swal-modal {
        width: 300px;
        padding: 0 !important;
        overflow: hidden !important;
        border-radius: 4px;
      }
      .swal-title {
        font-size: 14px;
        margin: 0 !important;
        background: #e0e0e0;
        padding: 8px;
        border-bottom: 1px solid #999;
      }
      .swal-text {
        margin-top: 10px;
      }
      .swal-button {
        border-radius: 2px;
        background: #999;
        box-shadow: none !important;
        padding: 8px;
        color: #eee;
        font-family: "Aperture", monospace, Arial;
        font-size: 16px;
      }
      .swal-button:hover {
        background: #777 !important;
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/sweetalert@2.1.2/dist/sweetalert.min.js"></script>
    <script src="/js/user.js"></script>
    <div class="wrapper">
      <h1 class="header">SIGN UP</h1>
      <div class="input-wrapper">
        <input class="input username" type="text" placeholder="Username">
        <input class="input email" type="email" placeholder="Email Address">
        <input class="input password" type="password" placeholder="Password">
        <button type="button" class="password-toggle" id="passwordToggle" onclick="togglePassword(this)"><span class="eye-icon"></span></button>
        <input class="input submit" type="button" value="Continue >">
        <a href="login.html">Log in instead</a>
      </div>
    </div>
    <script>
      let usernameInput = document.querySelector(".username");
      let emailInput = document.querySelector(".email");
      let passwordInput = document.querySelector(".password");
      let submitButton = document.querySelector(".submit");
      function togglePassword(button) {
        button.querySelector(".eye-icon").classList.toggle("show-password");
        if (passwordInput.type == "text") {
          passwordInput.type = "password";
        } else {
          passwordInput.type = "text";
        }
      }
      let submitted = false;
      function signup() {
        if (submitted) return;
        submitted = true;
        function resetButton() {
          submitted = false;
          submitButton.disabled = "";
        }
        submitButton.disabled = "disabled";
        let username = usernameInput.value.trim();
        let email = emailInput.value.trim();
        let password = passwordInput.value.trim();
        let error = false;
        if (!email || !/^(([^<>()[\]\\.,;:\s@\"]+(\.[^<>()[\]\\.,;:\s@\"]+)*)|(\".+\"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/.test(email)) {
          swal({
            title: "Error signing up",
            text: "Please enter a valid Email Address.",
            button: "Close"
          });
          error = true;
        }
        if (!username) {
          swal({
            title: "Error signing up",
            text: "Please enter a username.",
            button: "Close"
          });
          error = true;
        } else if (username.length < 3 || username.length > 30) {
          swal({
            title: "Error signing up",
            text: "Username must be between 3-30 characters.",
            button: "Close"
          });
          error = true;
        } else if (/[^A-Za-z0-9\_\-]/g.test(username)) {
          swal({
            title: "Error signing up",
            text: "Username can only contain letters, numbers, underscores, and dashes.",
            button: "Close"
          });
          error = true;
        }
        if (!password) {
          swal({
            title: "Error signing up",
            text: "Please enter a Password.",
            button: "Close"
          });
          error = true;
        } else if (password.length < 8) {
          swal({
            title: "Error signing up",
            text: "Password must be at least 8 characters long.",
            button: "Close"
          });
          error = true;
        }
        if (error) return setTimeout(() => resetButton(), 500);
        user.signup(email, username, password, function(success) {
          if (success) {
            swal({
              title: "Verify your email",
              text: "Success! Check your email to finish signing up.",
              button: "Go to Login"
            }).then(function() {
              location.replace("/login.html");
            })
          } else {
            resetButton();
          }
        });
      }
      submitButton.addEventListener("click", function(event) {
        event.preventDefault();
        signup();
      });
      document.addEventListener("keydown", function(event) {
        if (!event.repeat && event.key == "Enter" && !swal.getState().isOpen) {
          signup();
        }
      });
    </script>
  </body>
</html>
