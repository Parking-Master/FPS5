<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS5 multiplayer shooter</title>
    <style>
      @keyframes health-flash {
        0% {
          box-shadow: inset 0 0 20px rgba(220, 30, 20, 0.7);
        }
        60% {
          box-shadow: inset 0 0 20px rgba(250, 50, 40, 0.2);
        }
        100% {
          box-shadow: inset 0 0 20px rgba(220, 30, 20, 0.7);
        }
      }
      html, body {
        margin: 0;
        overflow: hidden !important;
        user-select: none !important;
      }
      body {
        margin: 0;
        position: fixed;
        inset: 0;
        display: flex;
      }
      .vignette {
        position: relative;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        margin: 0;
        padding: 0;
        pointer-events: none !important;
        transition: opacity .15s;
      }
      .crosshair {
        position: absolute;
        width: 20px;
        height: 20px;
        left: 50%;
        top: 50%;
        margin-left: -10px;
        margin-top: -10px;
      }
      .ui {
        position: fixed;
        width: 100%;
        height: 100%;
        pointer-events: none !important;
        z-index: 2147483645;
      }
      canvas {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .ui-section.top-section {
        position: absolute;
        width: 300px;
        top: 20px;
        left: 50%;
        margin-left: -150px;
        transform: perspective(600px) rotateX(-15deg);
      }
      .ui-section.top-section .ui-health-bar {
        position: relative;
        width: 100%;
        height: 15px;
        margin: 0;
        border: 2px solid rgba(100, 200, 255, 0.4);
        filter: drop-shadow(1px 1px 0px #fff);
        box-shadow: inset 0 0 20px rgba(200, 200, 255, 0.3);
        border-radius: 4px;
        transition: box-shadow .2s;
      }
      .ui-section.top-section .ui-health-value {
        position: relative;
        width: 100%;
        height: 100%;
        background: rgba(100, 100, 150, 0.2);
      }
      .ui-section.top-section .ui-health-bar.value-low {
        box-shadow: inset 0 0 20px rgba(255, 183, 120, 0.7);
      }
      .ui-section.top-section .ui-health-bar.value-danger {
        animation: health-flash .5s infinite;
      }
      .ui-section.bottom-right-section {
        position: absolute;
        width: 150px;
        bottom: 40px;
        right: 60px;
        transform: perspective(600px) rotateY(-20deg) rotatez(2deg);
        font-family: Arial;
        filter: drop-shadow(1px 1px 0px #fff);
        text-shadow: 2px 2px 20px rgb(50, 50, 50);
      }
      .ui-section.bottom-right-section .ui-weapon {
        position: relative;
        padding: 6px;
        border-top: 2px solid rgba(100, 200, 255, 0.2);
        border-bottom: 2px solid rgba(100, 200, 255, 0.2);
        color: rgba(150, 160, 255, 0.7);
        letter-spacing: 2px;
      }
      .ui-section.bottom-right-section .ui-weapon .current-value {
        font-size: 24px;
      }
      .ui-section.bottom-right-section .ui-weapon .remaining-value {
        color: rgba(170, 170, 200, 0.7);
        font-size: 16px;
      }
      .ui-section.bottom-right-section .ui-weapon .remaining-value {
        color: rgba(170, 170, 200, 0.7);
        font-size: 16px;
      }
      .ui-section.bottom-right-section .ui-slot {
        position: relative;
        display: inline-block;
        color: rgba(180, 180, 255, 0.8);
        padding: 10px;
        line-height: 0.5;
        box-shadow: inset 15px 0px 10px 1px rgba(150, 170, 255, 0.25);
        border-right: 2px solid rgba(100, 200, 255, 0.2);
      }
      .ui-section.bottom-right-section .ui-slot .icon {
        width: 16px;
        vertical-align: middle;
        opacity: 0.8;
      }
      .ui-section.bottom-right-section .ui-slot.ui-slot-empty {
        opacity: 0.3;
      }
      .ui-radar {
        position: absolute;
        bottom: 40px;
        left: 60px;
        width: 150px;
        height: 150px;
        border-radius: 100%;
        background: rgba(100, 100, 150, 0.2);
        box-shadow: inset 0 0 50px rgba(210, 200, 200, 0.4);
        transform: perspective(500px) rotateY(10deg) rotateX(10deg);
        overflow: hidden;
      }
      .ui-section.bottom-right-section .ui-weapon .ui-ammo {
        display: inline-block;
      }
      .ui-section.bottom-right-section .ui-weapon .ui-primary-weapon-display {
        height: 24px;
        float: right;
        opacity: 0.4;
      }
      .ui-section.bottom-right-section .ui-secondary-weapon-display {
        height: 18px;
        opacity: 0.3;
        margin-left: 2px;
        filter: saturate(50%);
      }
    </style>
  </head>
  <body>
    <script src="/js/three.js"></script>
    <script src="/js/GLTFLoader.js"></script>
    <script src="/js/Capsule.js"></script>
    <script src="/js/Octree.js"></script>
    <script src="/js/DecalGeometry.js"></script>
    <script src="/js/graphics.js"></script>
    <script src="/js/particles.js"></script>
    <script src="/js/Tween.js"></script>
    <script src="/js/PointerLockControls.js"></script>
    <script src="https://parking-master.github.io/Gametime.js-4.0/gametime.min.js"></script>
    <div class="ui" id="game-ui">
      <img class="vignette" src="/images/vignette.png">
      <img class="crosshair" src="/images/crosshairs/0.png">
      <div class="ui-section top-section">
        <div class="ui-health-bar">
          <div class="ui-health-value"></div>
        </div>
      </div>
      <div class="ui-section bottom-left-section">
        <div class="ui-radar">
          <canvas style="width: 100%; height: 100%" width="150" height="150"></canvas>
        </div>
      </div>
      <div class="ui-section bottom-right-section">
        <div class="ui-weapon">
          <div class="ui-ammo"><span class="current-value">36</span> <span class="remaining-value">/ 108</span></div>
          <img src="/images/weapons/AK-74.png" class="ui-primary-weapon-display">
        </div>
        <div class="ui-slot ui-grenades ui-grenades-mk2"><img class="icon" src="/images/ui/grenade_mk2.png"> <span class="value">0</span></div>
        <div class="ui-slot ui-grenades ui-grenades-plasma"><img class="icon" src="/images/ui/grenade_plasma.png"> <span class="value">0</span></div>
        <img src="/images/weapons/FN-502.png" class="ui-secondary-weapon-display">
      </div>
    </div>
    <script>
      gametime.serverURL="wss://gametime-js-4.loca.lt";
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, 1440 / 900, 0.01, 1000);
      const clock = new THREE.Clock();
      const worldOctree = new THREE.Octree();

      const STEPS_PER_FRAME = 4;
      const GRAVITY = 10;

      let map = null;
      let playerOnFloor = false;
      const vectors = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];
      const playerDefaultPosition = [13.5, 0.35, -18.5];
      const keyStates = {};
      const grenades = [];
      const playerCollider = new THREE.Capsule(new THREE.Vector3(0, 0.35, 0), new THREE.Vector3(0, 1, 0), 0.35);
      const playerVelocity = vectors[0].clone();
      const playerDirection = vectors[0].clone();

      camera.rotation.order = "YXZ";
      scene.add(camera);
      playerCollider.start.set(playerDefaultPosition[0], playerDefaultPosition[1], playerDefaultPosition[2]);
      playerCollider.end.set(playerDefaultPosition[0], playerDefaultPosition[1] + .65, playerDefaultPosition[2]);
      document.body.appendChild(renderer.domElement);
      graphics.activate();

      let frameCount = 0;
      let lastTime = performance.now();
      let fps = 0;
      function animate(now) {
        const clockDelta = clock.getDelta();
        const deltaTime = Math.min(0.05, clockDelta) / STEPS_PER_FRAME;
        const time = Date.now();
        const weapon = utils.weapons.getCurrentEntry();

        teleportPlayerIfOob();

        for (let i = 0; i < STEPS_PER_FRAME; i++) {
          controls(deltaTime);
          updatePlayer(deltaTime);
          updateGrenades(deltaTime, time);
        }

        TWEEN.update();
        THREE.particles.update();
        utils.ui.update(weapon.currentAmmo, weapon.ammo, sandbox.grenades, weapon.reticle);
        utils.players.update();
        utils.weapons.position();

        for (let i = 0; i < sandbox.models.length; i++) {
          if (sandbox.models[i].loaded) {
            if (sandbox.models[i].model.animationMixer) {
              sandbox.models[i].model.animationMixer.update(clockDelta);
            }
          }
        }
        for (player in utils.players.objects) {
          const playerObject = utils.players.objects[player];
          if (playerObject) {
            if (frameCount % 4 == 0) utils.ui.radar.update(playerObject);
            if (playerObject.animationMixer) {
              playerObject.animationMixer.update(clockDelta);
              if (!playerObject.isRunning) {
                const offset = playerObject.weapon.type == "pistol" ? 1.3 : 0.9;
                const weaponRotation = Math.min(Math.max(-playerObject.weaponRotation + offset, 0.1), 1.7);
                const rightShoulder = playerObject.scene.getObjectByName("mixamorigRightShoulder");
                const leftShoulder = playerObject.scene.getObjectByName("mixamorigLeftShoulder");
                const head = playerObject.scene.getObjectByName("mixamorigHead");
                rightShoulder.rotation.x = weaponRotation;
                leftShoulder.rotation.x = weaponRotation;
                head.rotation.x = weaponRotation - offset;
                if (playerObject.isWalking && playerObject.weapon.type == "rifle") {
                  rightShoulder.rotation.x += 7;
                  leftShoulder.rotation.x += .2;
                  head.rotation.x -= offset - .4;
                }
              }
            }
          }
        }

        const tmpObjects = utils.options.get("tmpObjects");
        for (let i = 0; i < tmpObjects.length; i++) {
          const object = tmpObjects[i];
          if (time - object.timestamp > object.disposeTime) {
            if (object.objectType == "muzzleFlash") {
              object.opacity = 0;
            } else if (object.objectType == "bulletHole") {
              scene.remove(object);
              object.geometry.dispose();
            }
          }
        }

        frameCount++;
        const diff = now - lastTime;
        if (diff >= 1000) {
          fps = (frameCount * 1000) / diff;
          frameCount = 0;
          lastTime = now;
          console.log('FPS:', fps.toFixed(1));
        }

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      function update() {
        renderer.shadowMap.needsUpdate = true;
      }
      function getForwardVector() {
        camera.getWorldDirection(playerDirection);
        playerDirection.y = 0;
        playerDirection.normalize();
        return playerDirection;
      }
      function getSideVector() {
        camera.getWorldDirection(playerDirection);
        playerDirection.y = 0;
        playerDirection.normalize();
        playerDirection.cross(camera.up);
        return playerDirection;
      }
      function controls(deltaTime) {
        const speedDelta = deltaTime;
        const walkSpeed = deltaTime * (playerOnFloor ? 20 : 1.5) * (utils.options.get("Sprinting") ? 1.7 : utils.options.get("Crouching") ? 0.5 : 1);
        if (keyStates["KeyW"] || keyStates["ArrowUp"]) {
          playerVelocity.add(getForwardVector().multiplyScalar(walkSpeed));
        }
        if (keyStates["KeyS"] || keyStates["ArrowDown"]) {
          playerVelocity.add(getForwardVector().multiplyScalar(-walkSpeed));
        }
        if (keyStates["KeyA"] || keyStates["ArrowLeft"]) {
          playerVelocity.add(getSideVector().multiplyScalar(-walkSpeed));
        }
        if (keyStates["KeyD"] || keyStates["ArrowRight"]) {
          playerVelocity.add(getSideVector().multiplyScalar(walkSpeed));
        }
        if (playerOnFloor && keyStates["Space"]) {
          playerVelocity.y = 4;
          utils.weapons.stopCrouch();
          gametime.run("jump", [gametime.player.uuid]);
        }
      }
      function playerCollisions() {
        const result = worldOctree.capsuleIntersect(playerCollider);
        playerOnFloor = false;
        if (result) {
          playerOnFloor = result.normal.y > 0;
          if (!playerOnFloor) {
            playerVelocity.addScaledVector(result.normal, - result.normal.dot(playerVelocity));
          }
          playerCollider.translate(result.normal.multiplyScalar(result.depth));
        }
      }
      function updatePlayer(deltaTime) {
        let damping = (Math.exp(-4 * deltaTime) - 1) * 2;
        if (!playerOnFloor) {
          playerVelocity.y -= GRAVITY * (deltaTime);
          damping *= 0.1;
        }
        playerVelocity.addScaledVector(playerVelocity, damping);
        const deltaPosition = playerVelocity.clone().multiplyScalar(deltaTime);
        playerCollider.translate(deltaPosition);
        playerCollisions();
        camera.position.copy(playerCollider.end);
      }
      function updateGrenades(deltaTime, time) {
        for (let i = 0; i < grenades.length; i++) {
          const grenade = grenades[i];

          if (!grenade.available && grenade.hits > 0) {
            if (time - grenade.timestamp > grenade.explodeTime && grenade.explode) {
              utils.grenades.explode(grenade);
            }
          }

          if (grenade.stuck) continue;

          grenade.mesh.rotation.x += grenade.angularVelocity.x * deltaTime;
          grenade.mesh.rotation.y += grenade.angularVelocity.y * deltaTime;
          grenade.mesh.rotation.z += grenade.angularVelocity.z * deltaTime;
          grenade.collider.center.addScaledVector(grenade.velocity, deltaTime);

          const result = worldOctree.sphereIntersect(grenade.collider);
          if (result) {
            grenade.hits++;

            grenade.velocity.addScaledVector(result.normal, -result.normal.dot(grenade.velocity) * 1.8);

            if (grenade.timestamp == null) {
              grenade.timestamp = Date.now();
            }

            const rotationAxis = vectors[0].crossVectors(result.normal, grenade.velocity).normalize();
            const rotationSpeed = grenade.velocity.length() * 0.2;
            grenade.angularVelocity.addScaledVector(rotationAxis, rotationSpeed);
            grenade.collider.center.add(result.normal.multiplyScalar(result.depth));
          } else {
            grenade.velocity.y -= (GRAVITY * deltaTime + 0.01) * 1.8;
          }
          const damping = (Math.exp(deltaTime * -2.3) - 1.003) / 1.2;
          grenade.velocity.addScaledVector(grenade.velocity, damping);
          grenade.angularVelocity.addScaledVector(grenade.angularVelocity, damping);
          grenadeCollisions(grenades[i], grenades[i + 1]);
          grenade.mesh.position.copy(grenade.collider.center);
          if (grenade.type == "plasma") {
            for (player in utils.players.objects) {
              const playerObject = utils.players.objects[player];
              if (playerObject) {
                const playerPosition = playerObject.scene.position.clone();
                playerPosition.y += 1;
                if (!grenade.stuck) {
                  if (grenade.mesh.position.distanceTo(playerPosition) < 0.5) {
                    grenade.stuck = true;
                    grenade.hits = 1;
                    grenade.timestamp = Date.now();

                    playerObject.scene.add(grenade.mesh);
                    const worldPosition = grenade.mesh.position;
                    playerObject.scene.updateMatrixWorld(true);
                    const localPosition = playerObject.scene.worldToLocal(worldPosition.clone());
                    grenade.mesh.position.copy(localPosition);
                  }
                }
              }
            }
            if (!grenade.stuck && grenade.mesh.position.distanceTo(camera.position) < 0.5) {
              grenade.stuck = true;
              grenade.hits = 1;
              grenade.timestamp = Date.now();
              camera.add(grenade.mesh);
              grenade.mesh.position.set(0, -0.12, -0.2);
            }
          }
        }
      }
      function grenadeCollisions(grenade1, grenade2) {
        if (!grenade2) return;
        const d2 = grenade1.collider.center.distanceToSquared(grenade2.collider.center);
        const r = grenade1.collider.radius + grenade2.collider.radius;
        const r2 = r * r;
        if (d2 < r2) {
          const normal = vectors[1].subVectors(grenade1.collider.center, grenade2.collider.center).normalize();
          const v1 = vectors[2].copy(normal).multiplyScalar(normal.dot(grenade1.velocity));
          const v2 = vectors[3].copy(normal).multiplyScalar(normal.dot(grenade2.velocity));
          grenade1.velocity.add(v2).sub(v1);
          grenade2.velocity.add(v1).sub(v2);
          const d = (r - Math.sqrt(d2)) / 20;
          grenade1.collider.center.addScaledVector(normal, d);
          grenade2.collider.center.addScaledVector(normal, - d);
        }
      }
      function teleportPlayerIfOob() {
        if (camera.position.y <= -25) {
          playerCollider.start.set(13.5, 0.35, -18.5);
          playerCollider.end.set(13.5, 1, -18.5);
          playerCollider.radius = 0.35;
          camera.position.copy(playerCollider.end);
          camera.rotation.set(0, Math.PI, 0);
        }
      }

      sandbox = {
        loadout: ["AK-74", "FN-502"],
        grenades: {
          "mk2": 2,
          "plasma": 0
        },
        currentWeapon: null,
        primaryWeapon: null,
        secondaryWeapon: null,
        controls: {
          "fire": ["KeyF", "BracketRight"],
          "zoom": ["KeyI"],
          "reload": ["KeyR"],
          "switch": ["KeyY", "Tab"],
          "grenade": ["KeyG"],
          "melee": ["KeyB"],
          "sprint": ["ShiftLeft"],
          "crouch": ["KeyC"],
        },
        initialize: function() {
          gametime.set("player", {
            character: "SWAT",
            position: [0, 0, 0],
            rotation: [0, 0, 0],
            loadout: sandbox.loadout
          });
          gametime.connect();
          gametime.onconnect = function() {
            utils.ui.radar.init();
            animate();
            update();
            utils.weapons.switch("primary");
          };
        },
        loadingManager: new THREE.LoadingManager(),
        models: [
          {
            id: "map",
            path: "/models/maps/Cargo_Port.glb",
            model: null,
            loaded: false,
            removeAfterLoaded: false,
            callback: function(model) {
              map = model.scene;
              worldOctree.fromGraphNode(map);
              map.traverse(child => {
                child.frustumCulled = false;
                if (child.isMesh) {
                  child.castShadow = true;
                  child.receiveShadow = true;
                  if (child.material.map) {
                    child.material.map.anisotropy = 4;
                  }
                }
              });
              sky = new THREE.Mesh(new THREE.SphereGeometry(100, 25, 25), new THREE.MeshBasicMaterial({
                color: 0xf9c886,
                map: new THREE.TextureLoader().load("/images/assets/skies/0.png"),
                side: THREE.BackSide
              }));
              sky.position.y = 2;
              scene.add(sky);
            }
          },
          {
            id: "weapon.AK-74",
            path: "/models/weapons/AK-74.glb",
            model: null,
            loaded: false
          },
          {
            id: "weapon.FN-502",
            path: "/models/weapons/FN-502.glb",
            model: null,
            loaded: false
          },
          {
            id: "grenade.MK2",
            path: "/models/weapons/grenades/MK2.glb",
            model: null,
            loaded: false,
            callback: function(model) {
              const glow = new THREE.Sprite(new THREE.SpriteMaterial({ color: 0xff8888, opacity: 0.6, map: new THREE.TextureLoader().load("/images/assets/glow/0.png"), sizeAttenuation: true }));
              glow.scale.set(0.3, 0.3, 0.3);
              model.scene.add(glow);
              for (let i = 0; i < 6; i++) {
                const grenade = model.scene.clone();
                scene.add(grenade);
                utils.grenades.add(grenade, "mk2");
              }
            }
          },
          {
            id: "grenade.Plasma",
            path: "/models/weapons/grenades/Plasma.glb",
            model: null,
            loaded: false,
            callback: function(model) {
              const glow = new THREE.Sprite(new THREE.SpriteMaterial({ color: 0x1551ff, opacity: 1, map: new THREE.TextureLoader().load("/images/assets/glow/0.png"), sizeAttenuation: true }));
              glow.scale.set(0.6, 0.6, 0.6);
              model.scene.add(glow);
              for (let i = 0; i < 6; i++) {
                const grenade = model.scene.clone();
                scene.add(grenade);
                utils.grenades.add(grenade, "plasma");
              }
            }
          },
          {
            id: "propweapon.AK-74",
            path: "/models/characters/weapons/AK-74.glb",
            model: null,
            loaded: false
          },
          {
            id: "propweapon.FN-502",
            path: "/models/characters/weapons/FN-502.glb",
            model: null,
            loaded: false
          },
        ],
        weapons: {
          "AK-74": {
            name: "AK-74",
            displayName: "AK-74 Assault Rifle",
            ammo: 72,
            maxAmmo: 36,
            currentAmmo: 36,
            damage: 4,
            headshotDamage: 5,
            spread: 0.8,
            muzzleFlash: true,
            zoomPosition: [.0395, 0.0132, -.05, .045, -.025, 0.12],
            zoomFov: 35,
            zoomDuration: 250,
            fireMode: "auto",
            fireRate: 100,
            reticle: 0,
            type: "rifle",
            model: null,
            loaded: false,
            requiredMaps: ["Cargo_Port"],
            animationStructure: {
              idle: [1, 1, 1],
              reload: [2, 1, 1],
              reload_full: [3, 1, 1],
              run: [8, 2, 1],
              shoot: [6, 1, 1],
              throw: [7, 0.5, 1],
              walk: [8, 1.3, 1]
            }
          },
          "FN-502": {
            name: "FN-502",
            displayName: "FN-502 Pistol",
            ammo: 24,
            maxAmmo: 12,
            currentAmmo: 12,
            damage: 6,
            headshotDamage: 9,
            spread: 0.3,
            muzzleFlash: true,
            zoomPosition: [0.0325, 0.013, -0.016, 0.04991641660703782, -0.0778416846389471, 0.09494591130849153],
            zoomFov: 30,
            zoomDuration: 200,
            fireMode: "semi",
            fireRate: 200,
            reticle: 1,
            type: "pistol",
            model: null,
            loaded: false,
            requiredMaps: ["Cargo_Port"],
            animationStructure: {
              reload: [0, 1, 1],
              reload_full: [1, 1, 1],
              idle: [2, 0.5, 0.2],
              run: [5, 2.5, 1],
              shoot: [3, 1, 1],
              throw: [4, 0.5, 1],
              walk: [5, 1.6, 1]
            }
          }
        }
      };
      utils = {
        options: {
          store: {},
          set: function(key, value) {
            utils.options.store[key] = value;
          },
          get: function(key) {
            if (typeof utils.options.store[key] == "undefined") {
              return null;
            }
            return utils.options.store[key];
          }
        },
        ui: {
          cache: {
            ammoCurrentValue: null,
            ammoRemainingValue: null,
            grenades: {
              mk2: null,
              plasma: null
            },
            reticle: 0
          },
          elements: {
            crosshair: document.querySelector(".ui .crosshair"),
            radarCanvas: document.querySelector(".ui-radar canvas"),
            ammoCurrentValue: document.querySelector(".ui .ui-weapon .ui-ammo .current-value"),
            ammoRemainingValue: document.querySelector(".ui .ui-weapon .ui-ammo .remaining-value"),
            grenades_mk2: document.querySelector(".ui .ui-grenades-mk2 .value"),
            grenades_plasma: document.querySelector(".ui .ui-grenades-plasma .value")
          },
          update: function(currentAmmo, remainingAmmo, grenades, reticle) {
            if (utils.ui.cache.ammoCurrentValue != currentAmmo) {

          radar: {
            init: function(radarRange = 18) {
              const radarCanvas = utils.ui.elements.radarCanvas;
              const ctx = radarCanvas.getContext("2d");
              const radarRadiusPx = 75;
              const worldUp = new THREE.Vector3(0, 1, 0);
              const forward = new THREE.Vector3();
              const forwardH = new THREE.Vector3();
              const right = new THREE.Vector3();
              const tmpVec3 = new THREE.Vector3();
              function updatePlayerBasis() {
                camera.getWorldDirection(forward);
                forward.negate();
                forwardH.copy(forward).addScaledVector(worldUp, -forward.dot(worldUp)).normalize();
                right.crossVectors(worldUp, forwardH).normalize();
              }
              function computeRadarBlipForEnemy(enemy) {
                const playerPos = tmpVec3.setFromMatrixPosition(camera.matrixWorld);
                const enemyPos = new THREE.Vector3().setFromMatrixPosition(enemy.matrixWorld);
                const V = enemyPos.sub(playerPos);
                const dotVy = V.dot(worldUp);
                const Vh = V.addScaledVector(worldUp, -dotVy);
                if (Vh.lengthSq() === 0) return null;
                const xLocal = Vh.dot(right);
                const yLocal = -Vh.dot(forwardH);
                const d = Math.sqrt(xLocal * xLocal + yLocal * yLocal);
                if (d === 0) return { x: radarRadiusPx, y: radarRadiusPx };
                const dClamped = Math.min(d, radarRange);
                const scale = dClamped / radarRange;
                const nx = xLocal / d;
                const ny = yLocal / d;
                const xOffset = nx * scale * radarRadiusPx;
                const yOffset = ny * scale * radarRadiusPx;
                const screenX = radarRadiusPx + xOffset;
                const screenY = radarRadiusPx - yOffset;
                return { x: screenX, y: screenY };
              }
              utils.ui.radar.update = function(enemy = null) {
                const radarCanvas = utils.ui.elements.radarCanvas;
                updatePlayerBasis();
                ctx.clearRect(0, 0, radarCanvas.width, radarCanvas.height);
                if (utils.options.get("Walking") && !utils.options.get("Crouching")) {
                  ctx.beginPath();
                  ctx.fillStyle = "rgba(180, 180, 255, 0.7)";
                  ctx.arc(radarRadiusPx, radarRadiusPx, 5, 0, 2 * Math.PI);
                  ctx.fill();
                }
                if (!enemy) return;
                if (!enemy.isWalking || enemy.isCrouching || camera.position.distanceTo(enemy.scene.position) > radarRange + 3) return;
                const blip = computeRadarBlipForEnemy(enemy.scene);
                if (!blip) return;
                ctx.beginPath();
                ctx.fillStyle = 'rgba(255, 20, 20, 0.8)';
                ctx.arc(blip.x, blip.y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
              };
              utils.ui.radar.update();
            },
            update: null
          }
        },

              const clip = weapon.model.animationMixer.clipAction(weapon.model.animations[weapon.animationStructure[animation][0]]);
              clip.timeScale = options.timeScale || weapon.animationStructure[animation][1];
              clip.weight = weapon.animationStructure[animation][2];

              if (animation == "idle") clip.loop = THREE.LoopRepeat;
              if (animation == "walk") {
                clip.loop = THREE.LoopRepeat;
                clip.reset();
                if (!options.instant) clip.fadeIn(0.3);
              }

              if (options.loop) clip.loop = options.loop;
              if (options.reset) clip.reset();
              clip.play();

              if (typeof onfinish == "function") {
                let finished = false;
                let customCallback = function(event) {
                  if (event.action === clip) {
                    if (finished) return;
                    finished = true;
                    onfinish();
                    weapon.model.animationMixer.removeEventListener("finished", customCallback);
                  }
                };
                weapon.model.animationMixer.addEventListener("finished", customCallback);
                return customCallback;
              }
            },
            stop: function(animation, options = {}) {
              const weapon = utils.weapons.getCurrentEntry();
              const clip = weapon.model.animationMixer.clipAction(weapon.model.animations[weapon.animationStructure[animation][0]]);
              if (animation == "walk") {
                clip.fadeOut(0.3);

                clip.stop();

              if (options.reset) clip.reset();

                sandbox.currentWeapon.rotateY(Math.PI);

                sandbox.currentWeapon.translateY(-0.068);
                sandbox.currentWeapon.translateZ(0.032);

            const cameraShake = utils.options.get("CameraShake");
            if (cameraShake) {
              const randomX = (Math.random() / 200) * cameraShake;
              const randomY = (Math.random() / 200) * cameraShake;
              const randomZ = (Math.random() / 200) * cameraShake;
              camera.position.x += randomX * 9.9;
              camera.position.y += randomY * 9.9;
              camera.position.z += randomZ * 9.9;
              position();
              camera.position.x += randomX;
              camera.position.y += randomY;
              camera.position.z += randomZ;
            } else {

          fire: function(rounds = 1) {

            if (utils.options.get("Firing") || utils.options.get("Reloading") || utils.options.get("ThrowingGrenade") || utils.options.get("Melee") || weapon.currentAmmo <= 0) return;
            utils.options.set("Firing", true);
            utils.options.set("ContinueFiring", true);
            utils.weapons.stopSprint();

            const rate = weapon.fireRate;
            if (weapon.fireMode == "auto") {
              rounds = 200;
            } else if (weapon.fireMode == "burst") {
              rounds = 3;
            }

            let lastFire = Date.now() - rate;
            let roundsFired = 0;
            let spreads = Array(rounds *  2).fill(0).map(x => { const spread = Math.random() / (utils.options.get("Zoomed") ? 90 : 60) * weapon.spread; return Math.floor(Math.random() * 2) == 0 ? -spread : spread });

            utils.weapons.animations.stop("walk");

            let interval = setInterval(function() {

                  lastFire = Date.now();

                  const spreadX = spreads[roundsFired];
                  const spreadY = spreads[roundsFired + 1];

                  roundsFired++;

                  if (utils.options.get("Walking")) {

          reload: function(full = false) {
            const weapon = utils.weapons.getCurrentEntry();
            if (utils.options.get("Reloading") || weapon.ammo <= 0 || weapon.currentAmmo >= weapon.maxAmmo) return;
            utils.options.set("Reloading", true);
            utils.weapons.stopZoom();
            utils.weapons.stopMelee();
            utils.weapons.stopSprint(false);
            let animation = null;
            if (full) {
              animation = "reload_full";
            } else {
              animation = "reload";
            }
            utils.weapons.animations.stop("idle");
            utils.weapons.animations.stop("walk");
            const callbackFunction = utils.weapons.animations.start(animation, { loop: THREE.LoopOnce, reset: true }, function() {
              const weapon = utils.weapons.getCurrentEntry();
              const ammo = weapon.ammo;
              weapon.ammo = Math.max(weapon.ammo - (weapon.maxAmmo - weapon.currentAmmo), 0);
              weapon.currentAmmo = Math.min(weapon.currentAmmo + Math.min(weapon.maxAmmo, ammo), weapon.maxAmmo);
              utils.options.set("Reloading", false);
              if (utils.options.get("Walking")) {
                utils.weapons.animations.start("walk", { instant: true });
              } else {
                utils.weapons.animations.start("idle");
              }
            });
            utils.options.set("ReloadCallbackFunction", callbackFunction);
            gametime.run("reloadWeapon", [gametime.player.uuid]);
          },
          stopReload: function() {
            if (utils.options.get("Reloading")) {
              utils.weapons.animations.cancelCallback(utils.options.get("ReloadCallbackFunction"));
              utils.weapons.animations.stop("reload");
              utils.weapons.animations.stop("reload_full");
              utils.options.set("Reloading", false);
            }
          },
          melee: function() {
            if (utils.options.get("Melee")) return;
            utils.options.set("Melee", true);
            utils.options.set("CancelMelee", false);
            utils.weapons.stopFire();
            utils.weapons.stopZoom();
            utils.weapons.stopReload();
            utils.weapons.stopSprint(false);
            utils.effects.bob();
            function reset() {
              utils.options.set("CancelMelee", false);
              utils.options.set("Melee", false);
            }
            utils.options.set("globalMeleeTween", new TWEEN.Tween(sandbox.currentWeapon.children[0].rotation).to({ x: -0.8, y: .1, z: -.2 }, 100).easing(TWEEN.Easing.Quadratic.InOut).start());
            setTimeout(() => {
              if (utils.options.get("CancelMelee")) return reset();
              utils.options.set("globalMeleeTween", new TWEEN.Tween(sandbox.currentWeapon.children[0].rotation).to({ x: .5, y: .1, z: -.2 }, 200).easing(TWEEN.Easing.Quadratic.Out).start());
              setTimeout(() => {
              if (utils.options.get("CancelMelee")) return reset();
                utils.options.set("globalMeleeTween", new TWEEN.Tween(sandbox.currentWeapon.children[0].rotation).to({ x: 0, y: 0, z: 0 }, 300).easing(TWEEN.Easing.Quadratic.Out).start());
                setTimeout(() => {
                  utils.options.set("Melee", false);
                  utils.weapons.update();
                }, 300);
              }, 200);
            }, 100);
          },
          stopMelee: function() {
            if (utils.options.get("Melee")) {
              utils.options.set("CancelMelee", true);
              utils.options.get("globalMeleeTween").stop();
              sandbox.currentWeapon.children[0].rotation.set(0, 0, 0);
            }
          },
          sprint: function() {
            if (utils.options.get("Sprinting")) return;
            utils.options.set("Sprinting", true);
            utils.weapons.stopFire();
            utils.weapons.stopZoom();
            utils.weapons.stopReload();
            utils.weapons.stopMelee();
            utils.weapons.stopCrouch();
            utils.ui.hideCrosshair();
            utils.options.set("globalSprintTween", {
              position: new TWEEN.Tween(sandbox.currentWeapon.children[0].position).to({ x: -0.01, y: 0, z: -0.01 }, 400).easing(TWEEN.Easing.Quadratic.Out).start(),
              rotation: new TWEEN.Tween(sandbox.currentWeapon.children[0].rotation).to({ x: 0.2, y: 0.3, z: -0.3 }, 400).easing(TWEEN.Easing.Quadratic.Out).start()
            });
            utils.weapons.animations.stop("idle");
            utils.weapons.animations.restart("run");
            gametime.run("startRunning", [gametime.player.uuid]);
          },
          stopSprint: function(animation = true, force = false) {
            if (!utils.options.get("Sprinting") && !force) return;
            utils.options.set("Sprinting", false);
            utils.ui.showCrosshair();
            if (utils.options.get("globalSprintTween")) {
              utils.options.get("globalSprintTween").position.stop();
              utils.options.get("globalSprintTween").rotation.stop();
            }
            if (animation) {
              new TWEEN.Tween(sandbox.currentWeapon.children[0].position).to({ x: 0, y: 0, z: 0 }, 500).easing(TWEEN.Easing.Quadratic.Out).start();
              new TWEEN.Tween(sandbox.currentWeapon.children[0].rotation).to({ x: 0, y: 0, z: 0 }, 500).easing(TWEEN.Easing.Quadratic.Out).start();
            } else {
              sandbox.currentWeapon.children[0].position.set(0, 0, 0);
              sandbox.currentWeapon.children[0].rotation.set(0, 0, 0);
            }
            utils.weapons.animations.stop("run");
            if (utils.options.get("Walking")) {
              utils.weapons.animations.start("walk");
            } else {
              utils.weapons.animations.start("idle");
            }
            utils.weapons.update();
            gametime.run("stopRunning", [gametime.player.uuid]);
          },
          crouch: function() {
            function animation(amount) {
              let step = 0;
              function next() {
                if (step >= 9) return;
                step++;
                playerCollider.end.y += amount;
                requestAnimationFrame(next);
              }
              next();
            }
            if (utils.options.get("Crouching")) {
              utils.options.set("Crouching", false);
              animation(0.03);
              gametime.run("stopCrouching", [gametime.player.uuid]);
            } else {
              utils.weapons.stopSprint();
              utils.options.set("Crouching", true);
              animation(-0.03);
              gametime.run("startCrouching", [gametime.player.uuid]);
            }
          },
          stopCrouch: function() {
            if (utils.options.get("Crouching")) utils.weapons.crouch();
          },
          update: function() {
            const weapon = utils.weapons.getCurrentEntry();
            if (weapon.currentAmmo <= 0) {
              utils.weapons.reload(true);
            }
          }
        },
        grenades: {
          throw: function(type = null, isMultiplayer = false, point = camera, direction = playerDirection) {
            if (type == null) {
              if (sandbox.grenades["mk2"] > 0) {
                type = "mk2";
              } else if (sandbox.grenades["plasma"] > 0) {
                type = "plasma";
              }
            }
            if (!type) return;
            const grenade = grenades[utils.grenades.getAvailable(type)];
            if (isMultiplayer) {
              grenade.explode = false;
            } else {
              utils.weapons.stopFire();
              utils.weapons.stopZoom();
              utils.weapons.stopReload();
              utils.weapons.stopMelee();
              utils.weapons.stopSprint(false, true);
              if (utils.options.get("ThrowingGrenade")) return;
              utils.options.set("ThrowingGrenade", true);
              if (sandbox.grenades[type] <= 0) return;
              sandbox.grenades[type]--;
              utils.weapons.animations.stop("walk");
              utils.weapons.animations.stop("idle");
              utils.weapons.animations.start("throw", { reset: true, loop: THREE.LoopOnce }, function() {
                utils.options.set("ThrowingGrenade", false);
                if (utils.options.get("Walking")) {
                  utils.weapons.animations.start("walk", { instant: true });
                } else {
                  utils.weapons.animations.start("idle");
                }
                utils.weapons.update();
              });
              gametime.run("throwGrenade", [gametime.player.uuid, type, [direction.x, direction.y, direction.z, camera.rotation.x, camera.rotation.y, camera.rotation.z, camera.position.x, camera.position.y, camera.position.z], grenade.id]);
            }
            grenade.available = false;
            setTimeout(() => {
              point.getWorldDirection(direction);
              grenade.collider.center.copy(point.position).addScaledVector(direction, playerCollider.radius * 1.5);
              grenade.velocity.copy(direction).multiplyScalar(35);
              grenade.angularVelocity.set(0, 0, 0);
              grenade.velocity.addScaledVector(playerVelocity, 2);
            }, 300);
            return grenade.id;
          },
          explode: function(grenade, isMultiplayer = false) {
            const worldPosition = grenade.mesh.getWorldPosition(new THREE.Vector3());
            if (grenade.type == "plasma") {
              THREE.particles.plasma(worldPosition);
            } else {
              THREE.particles.explosion(worldPosition);
            }
            const shakeIntensity = 2 / (Math.max(camera.position.distanceTo(worldPosition), 1) / 2);
            utils.effects.shake(shakeIntensity);
            if (grenade.stuck) scene.add(grenade.mesh);
            if (!isMultiplayer) gametime.run("explodeGrenade", [gametime.player.uuid, grenade.id, [worldPosition.x, worldPosition.y, worldPosition.z]]);
            grenade.collider.center.set(0, -100, 0);
            grenade.available = true;
            grenade.hits = 0;
            grenade.timestamp = null;
            grenade.stuck = false;
            grenade.explode = true;
            grenade.multiplayerId = null;
          },
          getAvailable: function(type) {
            return grenades.filter(grenade => grenade.type == type && grenade.available)[0].id;
          },
          add: function(mesh, type) {
            grenades.push({
              type: type,
              mesh: mesh,
              collider: new THREE.Sphere(new THREE.Vector3(0, -100, 0), 0.1),
              velocity: new THREE.Vector3(),
              angularVelocity: new THREE.Vector3(),
              available: true,
              hits: 0,
              timestamp: null,
              explodeTime: 1500,
              stuck: false,
              explode: true,
              id: grenades.length,
              multiplayerId: null
            });
          }
        },
        effects: {
          bulletHole: function(spreadX, spreadY, point = camera) {
            const raycaster = utils.options.get("effectsRaycaster");
            raycaster.setFromCamera({ x: spreadX, y: spreadY }, point);
            const intersects = raycaster.intersectObjects(map.children);

            if (intersects.length > 0) {
              const intersect = intersects[0];
              const size = utils.options.get("bulletHoleSize");
              const normal = intersect.face.normal.clone();
              normal.transformDirection(intersect.object.matrixWorld);
              const rotation = new THREE.Euler().setFromQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal));

              const decalGeometry = new THREE.DecalGeometry(intersect.object, intersect.point, rotation, size);
              const decalMesh = new THREE.Mesh(decalGeometry, utils.options.get("bulletHoleMaterial"));
              scene.add(decalMesh);

              THREE.particles.dust(intersect.point);

              const tmpObjects = utils.options.get("tmpObjects");
              decalMesh.objectType = "bulletHole";
              decalMesh.timestamp = Date.now();
              decalMesh.disposeTime = 20000;
              tmpObjects.push(decalMesh);
              utils.options.set("tmpObjects", tmpObjects);
            }
          },
          muzzleFlash: function(model = null) {
            const flash = (model || sandbox.currentWeapon).getObjectByName("muzzleFlash");
            flash.rotateZ(Math.random());
            flash.material.color.setHex(0xff1111);
            flash.material.emissive.setHex(0xff1c11);
            flash.material.opacity = 1;
            const tmpObjects = utils.options.get("tmpObjects");
            flash.material.objectType = "muzzleFlash";
            flash.material.timestamp = Date.now();
            flash.material.disposeTime = 30;
            tmpObjects.push(flash.material);
            utils.options.set("tmpObjects", tmpObjects);
          },
          shake: function(intensity = 2, startDuration = 200, endDuration = 700) {
            new TWEEN.Tween({ intensity: 0 }).to({ intensity: intensity }, startDuration).easing(TWEEN.Easing.Quadratic.InOut).start().onUpdate(function(value) {
              utils.options.set("CameraShake", value.intensity);
              if (value.intensity >= intensity - 0.05) {
                new TWEEN.Tween({ intensity: intensity }).to({ intensity: 0 }, endDuration).easing(TWEEN.Easing.Quadratic.InOut).start().onUpdate(function(value) {
                  utils.options.set("CameraShake", value.intensity);
                });
              }
            });
          },
          bob: function() {
            let step = 0;
            function next(strength = 0.001) {
              const interval = setInterval(() => {
                if (step > 10) {
                  clearInterval(interval);
                  step = 0;
                  if (strength > 0) next(-strength);
                  return;
                }
                step++;
                camera.rotateX(strength / 3);
                camera.rotateZ(strength);
              });
            }
            next();
          }
        }
      };

      for (let i = 0; i < sandbox.models.length; i++) {
        new THREE.GLTFLoader(sandbox.loadingManager).load(sandbox.models[i].path, async function(model) {
          sandbox.models[i].model = model;
          sandbox.models[i].loaded = true;
          scene.add(model.scene);
          renderer.render(scene, camera);
          if (model.animations) {
            sandbox.models[i].model.animationMixer = new THREE.AnimationMixer(model.scene);
          }
          if (typeof sandbox.models[i].callback == "function") sandbox.models[i].callback(model);
          let idSplit = sandbox.models[i].id.split(".");
          if (idSplit[0] == "weapon") {
            let name = idSplit[1];
            // todo: update with selected map name
            if (sandbox.weapons[name].requiredMaps.includes("Cargo_Port") || sandbox.loadout.includes(name)) {
              model.scene.traverse(child => child.frustumCulled = false);
              sandbox.weapons[name].model = model;
              sandbox.weapons[name].loaded = true;
              if (name == sandbox.loadout[0]) utils.weapons.setPrimary(model.scene);
              if (name == sandbox.loadout[1]) utils.weapons.setSecondary(model.scene);
              utils.images.preload("/images/crosshairs/" + sandbox.weapons[name].reticle + ".png");
            }
          }
        });
      }

      sandbox.loadingManager.onProgress = function(url, itemsLoaded, itemsTotal) {
        const progress = itemsLoaded / itemsTotal;
        if (progress >= 1) {
          sandbox.models.forEach(model => {
            if (typeof model.removeAfterLoaded == "undefined") scene.remove(model.model.scene);
          });
          sandbox.initialize();
        }
      };

      function onWindowResize() {
        renderer.setPixelRatio(1.4);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth * 0.5, window.innerHeight * 0.5, false);
      }
      window.addEventListener("resize", onWindowResize);
      onWindowResize();

      let globalRepeat = false;
      document.addEventListener("keydown", (event) => {
        if (!PointerControls.isLocked) return;
        keyStates[event.code] = true;

        if (!event.repeat && !utils.options.get("Walking") && /KeyW|KeyA|KeyS|KeyD|ArrowUp|ArrowLeft|ArrowDown|ArrowRight/i.test(event.code)) {
          utils.options.set("Walking", true);
          if (!utils.options.get("Firing") && !utils.options.get("Reloading")) {
            utils.weapons.animations.stop("idle");
            utils.weapons.animations.start("walk");
          }
          gametime.run("startWalking", [gametime.player.uuid]);
        }
        if (!event.repeat) {
          if (sandbox.controls.fire.includes(event.code)) utils.weapons.fire();
          if (sandbox.controls.zoom.includes(event.code)) utils.weapons.zoom();
          if (sandbox.controls.reload.includes(event.code)) utils.weapons.reload();
          if (sandbox.controls.switch.includes(event.code)) utils.weapons.switch();
          if (sandbox.controls.grenade.includes(event.code)) utils.grenades.throw();
          if (sandbox.controls.melee.includes(event.code)) utils.weapons.melee();
          if (sandbox.controls.sprint.includes(event.code) && (keyStates["KeyW"] || keyStates["ArrowUp"])) utils.weapons.sprint();
          if (sandbox.controls.crouch.includes(event.code)) utils.weapons.crouch();
        }
        globalRepeat = true;
      });

      document.addEventListener("keyup", (event) => {
        globalRepeat = false;
        keyStates[event.code] = false;

        if (!keyStates["KeyW"] && !keyStates["KeyA"] && !keyStates["KeyS"] && !keyStates["KeyD"] && !keyStates["ArrowUp"] && !keyStates["ArrowLeft"] && !keyStates["ArrowDown"] && !keyStates["ArrowRight"] && /KeyW|KeyA|KeyS|KeyD|ArrowUp|ArrowLeft|ArrowS|ArrowD/i.test(event.code)) {
          utils.options.set("Walking", false);
          utils.weapons.stopSprint();
          if (!utils.options.get("Firing") && !utils.options.get("Reloading")) {
            utils.weapons.animations.stop("walk");
            utils.weapons.animations.start("idle");
          }
          gametime.run("stopWalking", [gametime.player.uuid]);
        }
        if (sandbox.controls.fire.includes(event.code)) utils.weapons.stopFire();
        if (sandbox.controls.sprint.includes(event.code)) utils.weapons.stopSprint();
      });

      document.addEventListener("mousedown", (event) => {
        if (document.pointerLockElement != null) return;
        document.body.requestPointerLock();
        PointerControls.lock();
      });

      document.addEventListener("mouseup", (event) => {
        if (!PointerControls.isLocked) return;
        PointerControls.lock();
      });

      const PointerControls = new PointerLockControls(camera, renderer.domElement);
      PointerControls.maxPolarAngle = Math.PI - .15;
      PointerControls.minPolarAngle = .15;
      PointerControls.pointerSpeed = .6;
      PointerControls.isLocked = true;

      utils.options.set("Walking", false);
      utils.options.set("Firing", false);
      utils.options.set("Zoomed", false);
      utils.options.set("Reloading", false);
      utils.options.set("Switching", false);
      utils.options.set("ThrowingGrenade", false);
      utils.options.set("Sprinting", false);
      utils.options.set("ReloadCallbackFunction", () => {});
      utils.options.set("bulletHoleMaterial", new THREE.MeshStandardMaterial({ map: new THREE.TextureLoader().load("/images/assets/bullet-holes/0.png"), transparent: true, depthTest: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4, side: THREE.DoubleSide }));
      utils.options.set("bulletHoleSize", new THREE.Vector3(0.04, 0.04, 0.04));
      utils.options.set("playerCamera", camera.clone());
      utils.options.set("effectsRaycaster", new THREE.Raycaster());
      utils.options.set("globalZoomTween", null);
      utils.options.set("globalMeleeTween", null);
      utils.options.set("globalSprintTween", null);
      utils.options.set("tmpObjects", []);
      utils.options.set("CameraShake", 0);

      scene.add(utils.options.get("playerCamera"));

      gametime.onupdate = function(player) {
        if (player.uuid == gametime.player.uuid) return;
        if (typeof utils.players.objects[player.uuid] === "undefined") {
          utils.players.add(player);
        }
      };

      gametime.on("jump", function(player) {
        if (player != gametime.player.uuid) {
          utils.players.animations.start(utils.players.objects[player], utils.players.objects[player].weapon.type + "_jump", { loop: THREE.LoopOnce, reset: true });
        }
      });
      gametime.on("switchWeapon", function(player, weapon) {
        if (player != gametime.player.uuid) {
          utils.players.weapons.set(utils.players.objects[player], weapon);
        }
      });
      gametime.on("startWalking", function(player) {
        if (player != gametime.player.uuid) {
          utils.players.startWalking(utils.players.objects[player]);
        }
      });
      gametime.on("stopWalking", function(player) {
        if (player != gametime.player.uuid) {
          utils.players.stopWalking(utils.players.objects[player]);
        }
      });
      gametime.on("startRunning", function(player) {
        if (player != gametime.player.uuid) {
          utils.players.startRunning(utils.players.objects[player]);
        }
      });
      gametime.on("stopRunning", function(player) {
        if (player != gametime.player.uuid) {
          utils.players.stopRunning(utils.players.objects[player]);
        }
      });
      gametime.on("fireWeapon", function(player, point, spreadX, spreadY) {
        if (player != gametime.player.uuid) {
          utils.players.weapons.fire(utils.players.objects[player], point, spreadX, spreadY);
        }
      });
      gametime.on("reloadWeapon", function(player) {
        if (player != gametime.player.uuid) {
          utils.players.weapons.reload(utils.players.objects[player]);
        }
      });
      gametime.on("throwGrenade", function(player, type, point, grenadeId) {
        if (player != gametime.player.uuid) {
          utils.players.grenades.throw(utils.players.objects[player], type, point, grenadeId);
        }
      });
      gametime.on("explodeGrenade", function(player, grenadeId, grenadePosition) {
        if (player != gametime.player.uuid) {
          utils.players.grenades.explode(grenadeId, grenadePosition);
        }
      });
      gametime.on("startCrouching", function(player) {
        if (player != gametime.player.uuid) {
          utils.players.startCrouching(utils.players.objects[player]);
        }
      });
      gametime.on("stopCrouching", function(player) {
        if (player != gametime.player.uuid) {
          utils.players.stopCrouching(utils.players.objects[player]);
        }
      });
    </script>
  </body>
</html>
