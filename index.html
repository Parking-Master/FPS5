<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS5 Multiplayer Shooter</title>
    <style>
      @font-face {
        font-family: "Aperture";
        src: url(/fonts/Aperture.ttf);
      }
      @keyframes active-animation {
        50% {
          box-shadow: inset 0 0 40px rgba(255, 255, 255, 0.4);
        }
      }
      @keyframes flicker {
        0% {
          opacity: 1;
        }
        10% {
          opacity: 0;
        }
        15% {
          opacity: 1;
        }
        40% {
          opacity: 0;
        }
        45% {
          opacity: 1;
        }
      }
      html, body {
        margin: 0 !important;
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden !important;
      }
      .wrapper {
        position: absolute;
        width: 100%;
        height: 100%;
        margin: 0;
        background: #cdd3d8;
        border: 20px solid #d9d9d9;
        box-sizing: border-box;
        background-image: url(/images/menu/splatter.png);
        background-repeat: no-repeat;
        background-position: center;
        background-size: 70%;
      }
      body.auto-resize {
        background: #d9d9d9;
      }
      body.auto-resize > .wrapper {
        position: fixed;
        width: 1280px;
        height: 720px;
        left: 50%;
        top: 50%;
        margin-left: -640px;
        margin-top: -360px;
      }
      .header {
        position: relative;
        width: 500px;
        left: 50%;
        margin-left: -250px;
        margin-top: 50px;
      }
      .subheader {
        font-family: "Aperture", monospace, Arial;
        font-size: 30px;
        color: #5aace1;
        text-align: center;
        margin: 0;
        margin-top: 10px;
        text-shadow: 0 2px 3px rgba(0, 0, 0, 0.2);
      }
      .buttons-wrapper {
        position: absolute;
        width: 180px;
        left: 50%;
        margin-left: -90px;
        bottom: 50px;
      }
      .buttons-wrapper button.button {
        position: relative;
        width: 100%;
        background: #cdd3d8;
        padding: 6px;
        font-size: 16px;
        border: 2px solid #ddd;
        box-shadow: 0 2px 20px rgba(255, 255, 255, .2);
        box-sizing: border-box;
        color: #5aace1;
        margin-top: 20px;
      }
      .buttons-wrapper button.button::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 12px;
        background: #5aace1;
        transform: perspective(50px) rotateX(-40deg) scale(.92);
        display: block;
        left: 0;
        top: 31px;
      }
      .buttons-wrapper button.button:hover {
        transform: scale(1.1);
      }
      .button.menu-button:focus, .buttons-wrapper button.button:focus {
        animation: active-animation .15s step-start;
        animation-iteration-count: 4;
      }
      img.sniper {
        position: relative;
        width: 350px;
        left: 50%;
        margin-left: -175px;
        margin-top: 25px;
      }
      .copyright {
        position: absolute;
        width: 100%;
        text-align: center;
        bottom: 15px;
        color: #5aace1;
      }
      a {
        color: #5aace1 !important;
      }
      .login-buttons {
        position: absolute;
        width: 100%;
        top: 0;
        left: 0;
        right: 0;
        padding: 30px;
        box-sizing: border-box;
      }
      .button.menu-button {
        display: block;
        width: 90px;
        height: 65px;
        background: #a7bbcc;
        border: none;
        border-radius: 0;
        border-bottom: 5px solid #6c9abf;
        color: #2b78aa;
        font-weight: bold;
        font-size: 15px;
      }
      .button.menu-button:hover {
        background: #9eb1c0;
      }
      .button.menu-button.signup-button {
        margin-top: 10px !important;
      }
      .button.menu-button.options-button {
        position: relative;
        width: 65px;
        float: right;
        top: 0;
        right: 0;
        background-image: url(/images/menu/options.png);
        background-size: 55%;
        background-position: center;
        background-repeat: no-repeat;
      }
      .loadout-wrapper {
        position: absolute;
        width: 250px;
        height: 200px;
        background: #a7bbcc;
        border-top: 5px solid #6c9abf;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 15px;
        padding-bottom: 0;
        box-sizing: border-box;
        bottom: 50px;
        left: 100px;
        transform-origin: bottom left;
      }
      .loadout-header {
        font-family: "Aperture";
        font-size: 26px;
        color: #2b78aa;
        text-align: center;
      }
      .loadout-header a {
        color: #000 !important;
      }
      .loadout-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-wrap: wrap;
        flex-direction: column;
      }
      .loadout-container .loadout-item {
        background: #cdd3d8;
        box-sizing: border-box;
        margin: 10px;
        background-position: center;
        background-repeat: no-repeat;
      }
      .loadout-container .loadout-character {
        flex-basis: calc(100% - 20px);
        background-image: url(/images/characters/Raven.png);
        background-size: auto 90%;
      }
      .loadout-container .loadout-primary-weapon {
        flex-basis: calc(50% - 20px);
        background-image: url(/images/weapons/AK-74.png);
        background-size: auto 70%;
      }
      .loadout-container .loadout-secondary-weapon {
        flex-basis: calc(50% - 20px);
        background-image: url(/images/weapons/FN-502.png);
        background-size: auto 90%;
      }
      .loadout-container .loadout-secondary-weapon::after {
        content: "";
        position: absolute;
        width: 35px;
        height: 35px;
        display: inline-block;
        margin-left: 27px;
        margin-top: -46px;
        background-image: url(/images/menu/loadout.png);
        background-size: 100%;
        background-position: center;
        background-repeat: no-repeat;
      }
      .loadout-container .loadout-item-tag {
        position: relative;
        width: 60px;
        margin: 0 auto;
        background: #cdd3d8;
        font-family: "Aperture";
        font-size: 9px;
        color: #2b78aa;
        padding: 2px 0;
        border: 2px solid #a7bbcc;
        text-align: center;
        bottom: calc(-100% + 8px);
      }
      .loadout-container .loadout-primary-weapon .loadout-item-tag {
        top: -10px;
      }
      .points {
        position: absolute;
        margin-top: 220px;
        font-family: "Aperture";
        font-size: 22px;
        color: #2b78aa;
      }
      .profile-picture {
        width: 30px;
        background-color: #fff;
        border-radius: 100%;
        margin-bottom: -6px;
        box-shadow: 3px 2px 0 #2b78aa;
        border: 2px solid #999;
      }
      .window {
        position: absolute;
        max-width: 600px;
        max-height: 400px;
        width: 100%;
        height: 100%;
        background: #fff;
        border: 8px solid #5aace1;
        border-top: none;
        left: 50%;
        top: 50%;
        margin-left: -300px;
        margin-top: -200px;
        z-index: 9999;
        overflow-y: scroll;
        scrollbar-width: thin !important;
        padding: 20px;
        box-sizing: border-box;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        display: none;
      }
      @media only screen and (max-width:600px) {
        .window {
          left: 0;
          margin-left: 0;
        }
      }
      @media only screen and (max-height:400px) {
        .window {
          top: 0;
          margin-top: 0;
        }
      }
      .lobby-list {
        position: relative;
        width: 100%;
      }
      .lobby {
        width: 100%;
        height: 60px;
        margin-bottom: 10px;
        background: #eee;
        box-sizing: border-box;
        padding: 10px;
        cursor: pointer !important;
        overflow-x: scroll;
        overflow-y: hidden;
        white-space: nowrap;
        scrollbar-width: thin;
      }
      .lobby:hover {
        background: #ddd;
      }
      .lobby:active {
        background: #aaa;
      }
      .lobby-map-preview {
        position: relative;
        width: 60px;
        height: 38px;
        background-color: #ccc;
        background-size: cover;
        float: left;
        margin-right: 20px;
      }
      .lobby-map-name {
        position: relative;
        width: 100%;
        top: 20px;
        color: #eee;
        text-align: center;
        font-family: "Aperture";
        font-size: 10px;
        text-shadow: 0 0 2px #000;
        white-space: nowrap;
        display: inline-block;
      }
      .lobby-name {
        font-size: 20px;
      }
      .lobby-info {
        font-size: 12px;
        color: #888;
      }
      .lobby-status {
        position: relative;
        width: 10px;
        height: 10px;
        float: right;
        margin: auto 0;
        border-radius: 100%;
        top: -24px;
      }
      .lobby-status.lobby-status-active {
        background: #00ff00;
      }
      .lobby-status.lobby-status-inactive {
        background: #ff0000;
      }
      .lobby-status.lobby-status-full {
        background: #ffd500;
      }
      .window-header {
        font-size: 30px;
        font-family: "Aperture";
      }
      .lobbies-description {
        color: #999;
        font-size: 14px;
        margin: 10px 0;
        border-left: 3px solid #ddd;
        padding-left: 10px;
      }
      .button.lobby-button {
        background: #ddd;
        border: none;
        box-shadow: 1px 1px 0 #333;
        color: #000;
        padding: 3px 10px;
      }
      .button.lobby-button:hover {
        background: #999;
      }
      .window-close {
        float: right;
        cursor: pointer !important;
      }
      .lobby-status-player-count {
        font-size: 10px;
        left: -20px;
        position: relative;
        color: #999;
        top: -5px;
      }
      .lobby-options-left-section {
        position: relative;
        width: 50%;
        height: 250px;
        float: left;
        overflow-y: scroll;
        scrollbar-width: thin;
        box-sizing: border-box;
        padding: 10px;
        padding-bottom: 100px;
        background: #eee;
        font-size: 14px;
      }
      .lobby-options-left-section .input, .lobby-options-left-section button, .lobby-options-left-section select {
        float: right;
        position: relative;
        background: #ddd;
        box-shadow: 1px 1px 0 #333;
        border: none;
        border-radius: 0 !important;
        color: #000 !important;
        padding: 3px 10px;
        outline: none !important;
        font-size: 12px;
      }
      .lobby-options-left-section input {
        float: right;
      }
      .lobby-options-left-section .lobby-options-edit_presets {
        float: none;
      }
      .lobby-options-left-section input[data-disabled], .lobby-options-left-section button[data-disabled], .lobby-options-left-section select[data-disabled] {
        background: #e5e5e5;
        color: #999 !important;
        box-shadow: 1px 1px 0 #999;
        pointer-events: none;
      }
      .lobby-options-left-section button:hover, .lobby-options-left-section select:hover {
        background: #bbb !important;
      }
      label[data-disabled] {
        color: #999;
      }
      .lobby-options-right-section {
        position: relative;
        width: 50%;
        height: 250px;
        float: right;
        box-sizing: border-box;
        padding: 0 10px;
      }
      .lobby-options-map-preview {
        position: relative;
        width: 100%;
        height: 100%;
        max-height: 120px;
        background-color: #ccc;
        background-image: url(/images/maps/Cargo_Port.png);
        background-size: cover;
      }
      .lobby-options-right-section p {
        margin: 0;
        margin-top: 10px;
        font-size: 14px;
      }
      .lobby-options-name {
        position: relative;
        width: 100%;
        box-sizing: border-box;
        padding: 4px 10px;
        border: 1px solid #333;
        border-radius: 0;
        font-size: 18px;
        outline: none !important;
      }
      .create-lobby-submit {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        background: #5aace1;
        border: none;
        margin: 5px 0;
        color: #fff;
      }
      .create-lobby-submit:hover {
        background: #4e8cb6;
      }
      .create-lobby-submit:active {
        background: #3d6e8f;
      }
      .lobby-options-code_required {
        margin-top: 10px;
      }
      .lobby-options-code_required_text {
        font-size: 14px;
      }
      .lobby-options-left-section select {
        width: 120px;
      }
      .lobby-options-left-section .input.number-input {
        width: 30px;
      }
      .edit-presets-container {
        background: #ccc;
        padding: 10px;
        display: none;
      }
      .edit-presets-container select {
        width: 100px;
      }
      .notiflix-loading {
        background: rgba(0, 0, 0, .6) !important;
      }
      .notiflix-loading-icon {
        animation: flicker 1s step-end infinite;
      }
      .notiflix-report, notiflix-confirm {
        z-index: 10000 !important;
      }
      .notiflix-report-button, .notiflix-confirm-buttons a {
        color: #fff !important;
      }
      .notiflix-report-icon {
        width: 70px !important;
        height: 70px !important;
      }
      i.fa {
        pointer-events: none !important;
      }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="/css/responsive.css" id="responsive-stylesheet">
  </head>
  <body>
    <script src="https://unpkg.com/sweetalert@2.1.2/dist/sweetalert.min.js"></script>
    <script src="https://parking-master.github.io/Parking-Master-2.0/notiflix/notiflix-3.2.8.min.js"></script>
    <script src="/js/user.js"></script>
    <div class="window"></div>
    <div class="wrapper">
      <img src="/images/menu/heading.png" class="header">
      <p class="subheader">MULTIPLAYER SHOOTER</p>
      <img class="sniper" src="/images/menu/sniper.png">
      <div class="login-buttons">
        <button class="button menu-button options-button"></button>
        <button class="button menu-button login-button" onclick="location.href = '/login.html'">LOG IN</button>
        <button class="button menu-button signup-button" onclick="location.href = '/signup.html'">SIGN UP</button>
      </div>
      <div class="loadout-wrapper">
        <div class="loadout-header">YOUR LOADOUT</div>
        <div class="loadout-container">
          <div class="loadout-item loadout-character">
            <div class="loadout-item-tag">RAVEN</div>
          </div>
          <div class="loadout-item loadout-primary-weapon">
            <div class="loadout-item-tag">AK-74</div>
          </div>
          <div class="loadout-item loadout-secondary-weapon">
            <div class="loadout-item-tag">FN-502</div>
          </div>
        </div>
        <div class="points">0 PTS</div>
      </div>
      <div class="buttons-wrapper">
        <button class="button" id="lobby-button">FIND LOBBY</button>
        <button class="button" id="preferences-button">PREFERENCES</button>
        <button class="button" id="chat-button">WORLD CHAT</button>
        <button class="button" id="forge-button">FORGE</button>
        <button class="button" id="help-button">HELP</button>
      </div>
      <div class="copyright"><span id="copyright-text">Copyright </span>&copy; 2026 <a href="https://github.com/Parking-Master">Parking-Master</a></div>
    </div>
    <script>
      Notiflix.Loading.init({ svgColor: "#fff" });
      let modes = {
        "slayer": {
          mode: "slayer",
          scoreLimit: 25,
          timeLimit: 15,
          teamsEnabled: false,
          teamSize: null,
          playersNeeded: 2,
          personalLoadoutsEnabled: true,
          presets: {
            loadout: ["AK-74", "FN-502"],
            armorAbility: null,
            grenades: { "mk2": 2, "plasma": 0 }
          },
          radarEnabled: true,
          vehiclesEnabled: true
        },
        "team_slayer_2v2": {
          mode: "team_slayer_2v2",
          scoreLimit: 50,
          timeLimit: 15,
          teamsEnabled: true,
          teamSize: 2,
          playersNeeded: 4,
          personalLoadoutsEnabled: true,
          presets: {
            loadout: ["AK-74", "FN-502"],
            armorAbility: null,
            grenades: { "mk2": 2, "plasma": 0 }
          },
          radarEnabled: true,
          vehiclesEnabled: true
        },
        "team_slayer_4v4": {
          mode: "team_slayer_4v4",
          scoreLimit: 50,
          timeLimit: 15,
          teamsEnabled: true,
          teamSize: 4,
          playersNeeded: 8,
          personalLoadoutsEnabled: true,
          presets: {
            loadout: ["AK-74", "FN-502"],
            armorAbility: null,
            grenades: { "mk2": 2, "plasma": 0 }
          },
          radarEnabled: true,
          vehiclesEnabled: true
        },
        "fiesta": {
          mode: "fiesta",
          scoreLimit: 25,
          timeLimit: 12,
          teamsEnabled: false,
          teamSize: null,
          playersNeeded: 2,
          personalLoadoutsEnabled: false,
          presets: {
            loadout: ["random", "random"],
            armorAbility: null,
            grenades: { "mk2": 0, "plasma": 1 }
          },
          radarEnabled: true,
          vehiclesEnabled: true
        },
        "snipers": {
          mode: "snipers",
          scoreLimit: 15,
          timeLimit: 10,
          teamsEnabled: false,
          teamSize: null,
          playersNeeded: 2,
          personalLoadoutsEnabled: false,
          presets: {
            loadout: ["HK-G28"],
            armorAbility: null,
            grenades: { "mk2": 0, "plasma": 0 }
          },
          radarEnabled: false,
          vehiclesEnabled: true
        }
      };
      let currentModeConfig = null;
      let currentLobbies = [];
      function openWindow(title, content) {
        document.querySelector(".window").innerHTML = `
        <div class="window-header">${title} <span class="window-close">&times;</span></div>
        ${content}
        `;
        document.querySelector(".window").style.display = "block";
      }
      function closeWindow(removeLoading = true) {
        document.querySelector(".window").style.display = "";
        if (removeLoading) Notiflix.Loading.remove();
      }
      function formatNumber(number) {
        return number.toString().replace(/\B(?=(\d{3})+(?!\d))/g,",");
      }
      if (!localStorage["points"]) localStorage.setItem("points", 0);
      function updateLoadout() {
        let character = user.data.character;
        let loadout = user.data.loadout;
        let points = user.data.points;
        document.querySelector(".loadout-character .loadout-item-tag").textContent = character;
        document.querySelector(".loadout-character").style.backgroundImage = `url(/images/characters/${character}.png)`;
        document.querySelector(".loadout-primary-weapon .loadout-item-tag").textContent = loadout[0];
        document.querySelector(".loadout-primary-weapon").style.backgroundImage = `url(/images/weapons/${loadout[0]}.png)`;
        document.querySelector(".loadout-secondary-weapon .loadout-item-tag").textContent = loadout[1];
        document.querySelector(".loadout-secondary-weapon").style.backgroundImage = `url(/images/weapons/${loadout[1]}.png)`;
        document.querySelector(".points").textContent = formatNumber(points) + " PTS";
      }
      updateLoadout();
      if (user.loggedIn) {
        document.querySelector(".login-button").textContent = "LOG OUT";
        document.querySelector(".login-button").onclick = null;
        document.querySelector(".login-button").onmousedown = function() {
          user.logout();
          this.innerHTML = "<i class='fa fa-check' style='font-size:30px'></i>";
          setTimeout(() => {
            this.textContent = "LOG IN";
            this.onclick = () => location.href = "/login.html";
            this.onmousedown = null;
            document.querySelector(".signup-button").style.display = "";
            document.querySelector(".loadout-header").innerHTML = "YOUR LOADOUT";
            updateLoadout();
          }, 700);
        };
        document.querySelector(".signup-button").style.display = "none";
        let displayUsername = user.data.username;
        if (displayUsername.length > 11) displayUsername = displayUsername = displayUsername.slice(0, 10) + "...";
        document.querySelector(".loadout-header").innerHTML = `<p style="margin:0!important" title="${user.data.username}"><img src="${user.data.profilePicture}" class="profile-picture"> ${displayUsername}</p><span style="font-size:14px">YOUR LOADOUT &bullet; <a href="#">EDIT</a></span>`;
      }

      function createLobby(dialog = true, lobbyName, lobbyOptions) {
        if (dialog) {
          openWindow("Create new Lobby", `
          <div class="lobbies-description">Create a multiplayer lobby by choosing a map, mode, and custom presets. You can disable score/time limits to make them unlimited. <a href="">Need help?</a></div>
          <div class="lobby-options-left-section">
            <div class="lobby-options-container">
              <label for="map">Map</label>
              <select value="Cargo_Port" name="map" class="lobby-options-map" onchange="updateLobbyMapPreview(this.value)">
                <option value="Cargo_Port" selected>Cargo Port</option>
                <option value="Lihid">Lihid</option>
                <option value="Haven">Haven</option>
                <option value="Standoff">Standoff</option>
                <option value="Abandoned_City">Abandoned City</option>
                <option value="Vertex">Vertex</option>
                <option value="Apex">Apex</option>
              </select>
            </div>
            <br>
            <div class="lobby-options-container">
              <label for="mode">Mode</label>
              <select value="slayer" name="mode" class="lobby-options-mode" onchange="chooseMode(modes[this.value])">
                <option value="slayer" selected>Slayer</option>
                <option value="team_slayer_2v2">Team Slayer 2v2</option>
                <option value="team_slayer_4v4">Team Slayer 4v4</option>
                <option value="fiesta">Fiesta</option>
                <option value="snipers">Snipers</option>
              </select>
            </div>
            <br>
            <div class="lobby-options-container">
              <label for="scoreLimit">Score Limit</label>
              <input type="text" data-min="1" data-max="100" value="25" name="scoreLimit" class="input number-input lobby-options-scoreLimit" onchange="updateLobbyInputs(this)" oninput="updateLobbyInputs(this)"> <input type="checkbox" name="scoreEnabled" class="lobby-options-score_enabled" checked>
            </div>
            <br>
            <div class="lobby-options-container">
              <label for="timeLimit">Time Limit (minutes)</label>
              <input type="text" data-min="1" data-max="60" value="15" name="timeLimit" class="input number-input lobby-options-timeLimit" onchange="updateLobbyInputs(this)" oninput="updateLobbyInputs(this)"> <input type="checkbox" name="timeEnabled" class="lobby-options-time_enabled" checked>
            </div>
            <br>
            <div class="lobby-options-container">
              <label for="teamsEnabled">Team Game</label>
              <button name="teamsEnabled" data-enabled="0" class="lobby-options-teamsEnabled" onclick="toggleLobbyOption(this)"><i class="fa fa-retweet"></i> Disabled</button>
            </div>
            <br>
            <div class="lobby-options-container">
              <label for="teamSize">Team Size</label>
              <input type="text" data-min="1" data-max="8" value="1" name="teamSize" class="input number-input lobby-options-teamSize" data-disabled="1" onchange="updateLobbyInputs(this)" oninput="updateLobbyInputs(this)">
            </div>
            <br>
            <div class="lobby-options-container">
              <label for="playersNeeded">Players Needed to Start</label>
              <input type="text" data-min="1" data-max="16" value="2" name="playersNeeded" class="input number-input lobby-options-playersNeeded" onchange="updateLobbyInputs(this)" oninput="updateLobbyInputs(this)" data-override-teams="0">
            </div>
            <br>
            <div class="lobby-options-container">
              <label for="personalLoadoutsEnabled">Personal Loadouts</label>
              <button name="personalLoadoutsEnabled" data-enabled="1" class="lobby-options-personalLoadoutsEnabled" onclick="toggleLobbyOption(this)"><i class="fa fa-retweet"></i> Enabled</button>
            </div>
            <br>
            <div class="lobby-options-container">
              <button class="lobby-options-edit_presets" name="editPresets" data-disabled="1">Edit Custom Loadouts <i class="fa fa-chevron-right"></i></button>
              <br>
              <div class="edit-presets-container">
                <div class="lobby-options-container">
                  <label for="primary-weapon">Primary Weapon</label>
                  <select value="AK-74" name="primary-weapon" class="lobby-options-presets-primary_weapon" onchange="updateLobbyConfig()">
                    <option value="random">Random</option>
                    <option value="AK-74" selected>AK-74 Assault Rifle</option>
                    <option value="Ace-35r">Ace-35r Battle Rifle</option>
                    <option value="AR-15">AR-15 Precision Rifle</option>
                    <option value="SCAR-H">SCAR-H SMG</option>
                    <option value="30-SST">30-SST SMG</option>
                    <option value="Machine-Gun">Machine Gun</option>
                    <option value="FN-502">FN-502 Pistol</option>
                    <option value="XD-Mod-2">XD Mod.2 Compact Pistol</option>
                    <option value="Desert-Eagle">Desert Eagle .50AE Pistol</option>
                    <option value="Phone-Gun">Cell Phone Gun</option>
                    <option value="HK-G28">HK-G28 Sniper Rifle</option>
                    <option value="Ruger-RPR">Ruger-RPR Sniper Rifle</option>
                    <option value="Remington-870">Remington 870 Shotgun</option>
                    <option value="M319-Grenade-Launcher">M319 Grenade Launcher</option>
                    <option value="Grenade-Launcher">Revolving Grenade Launcher</option>
                    <option value="Rocket-Launcher">SPNKR Rocket Launcher</option>
                    <option value="MLRS">MLRS Rocket Cannon</option>
                  </select>
                </div>
                <br>
                <div class="lobby-options-container">
                  <label for="secondary-weapon">Secondary Weapon</label>
                  <select value="FN-502" name="secondary-weapon" class="lobby-options-presets-secondary_weapon" onchange="updateLobbyConfig()">
                    <option value="none">None</option>
                    <option value="random">Random</option>
                    <option value="AK-74">AK-74 Assault Rifle</option>
                    <option value="Ace-35r">Ace-35r Battle Rifle</option>
                    <option value="AR-15">AR-15 Precision Rifle</option>
                    <option value="SCAR-H">SCAR-H SMG</option>
                    <option value="30-SST">30-SST SMG</option>
                    <option value="Machine-Gun">Machine Gun</option>
                    <option value="FN-502" selected>FN-502 Pistol</option>
                    <option value="XD-Mod-2">XD Mod.2 Compact Pistol</option>
                    <option value="Desert-Eagle">Desert Eagle .50AE Pistol</option>
                    <option value="Phone-Gun">Cell Phone Gun</option>
                    <option value="HK-G28">HK-G28 Sniper Rifle</option>
                    <option value="Ruger-RPR">Ruger-RPR Sniper Rifle</option>
                    <option value="Remington-870">Remington 870 Shotgun</option>
                    <option value="M319-Grenade-Launcher">M319 Grenade Launcher</option>
                    <option value="Grenade-Launcher">Revolving Grenade Launcher</option>
                    <option value="Rocket-Launcher">SPNKR Rocket Launcher</option>
                    <option value="MLRS">MLRS Rocket Cannon</option>
                  </select>
                </div>
                <br>
                <div class="lobby-options-container">
                  <label for="secondary-weapon">Armor Ability</label>
                  <select value="none" name="armor-ability" class="lobby-options-presets-armor_ability" onchange="updateLobbyConfig()">
                    <option value="none" selected>None</option>
                    <option value="jet-pack">Jet pack</option>
                    <option value="thruster-pack">Thruster pack</option>
                    <option value="active-camo">Active Camo</option>
                  </select>
                </div>
                <br>
                <div class="lobby-options-container">
                  <label for="grenades-mk2">Grenades (Frag)</label>
                  <input type="text" data-min="0" data-max="4" value="2" name="grenades-mk2" class="input number-input lobby-options-presets-grenades_mk2" onchange="updateLobbyInputs(this)" oninput="updateLobbyInputs(this)">
                </div>
                <br>
                <div class="lobby-options-container">
                  <label for="grenades-plasma">Grenades (Plasma)</label>
                  <input type="text" data-min="0" data-max="4" value="0" name="grenades-plasma" class="input number-input lobby-options-presets-grenades_plasma" onchange="updateLobbyInputs(this)" oninput="updateLobbyInputs(this)">
                </div>
              </div>
            </div>
            <br>
            <div class="lobby-options-container">
              <label for="radarEnabled">Radar</label>
              <button name="radarEnabled" data-enabled="1" class="lobby-options-radarEnabled" onclick="toggleLobbyOption(this)"><i class="fa fa-retweet"></i> Enabled</button>
            </div>
            <br>
            <div class="lobby-options-container">
              <label for="vehiclesEnabled">Vehicles</label>
              <button name="vehiclesEnabled" data-enabled="1" class="lobby-options-vehiclesEnabled" onclick="toggleLobbyOption(this)"><i class="fa fa-retweet"></i> Enabled</button>
            </div>
          </div>
          <div class="lobby-options-right-section">
            <div class="lobby-options-map-preview"></div>
            <p>Lobby name (2-20 characters)</p>
            <input type="text" class="lobby-options-name">
            <br>
            <input type="checkbox" name="code-required" class="lobby-options-code_required">
            <label for="code-required" class="lobby-options-code_required_text">Players need a code to join</label>
            <button class="create-lobby-submit">Create Lobby</button>
          </div>
          `);
          chooseMode(modes["slayer"]);
        } else {
          lobbyName = lobbyName.trim();
          if (lobbyName.length >= 2 && lobbyName.length <= 20) {
            Notiflix.Block.circle(".window");
            user.createLobby(lobbyName, lobbyOptions, function() {
              if (lobbyOptions.code) {
                Notiflix.Report.success("Your lobby has been created!", "Your lobby is hidden from other players. In order to join, players need to click 'Enter Code' in the lobby dropdown and enter this code: " + lobbyOptions.code, "Got it", function() {
                  location.href = "/src.html?code=" + lobbyOptions.code;
                }, { borderRadius: 0 });
              } else {
                findLobby(lobbyName);
                Notiflix.Report.success("Your lobby has been created!", "Anybody can see your lobby and join it. It is recommended to wait in your lobby so that others are more interested in joining.", "Got it", { borderRadius: 0 });
              }
            }, function() {
              Notiflix.Block.remove(".window");
              Notiflix.Report.failure("Error creating lobby", "A lobby with that name already exists. Please choose another name.", "Close", { borderRadius: 0 });
            });
          } else {
            document.querySelector(".lobby-options-right-section p").style.color = "#ff0000";
          }
        }
      }
      function enterCode() {
        Notiflix.Confirm.prompt("Enter Code", "Enter the 6-digit code for the lobby you want to join:", "", "Join", "Cancel", function(code) {
          let foundLobby = false;
          for (let i = 0; i < currentLobbies.length; i++) {
            let lobby = currentLobbies[i];
            if (lobby.code == code) {
              foundLobby = true;
              closeWindow(false);
              Notiflix.Loading.change("Joining lobby...");
              location.href = "/src.html?code=" + lobby.code;
              return;
            }
          }
          if (!foundLobby) Notiflix.Report.failure("Error finding lobby", "We couldn't find a lobby with that code. Check if you typed it right and try again.", "Close", { borderRadius: 0 });
        }, () => {}, {
          borderRadius: 0,
          okButtonBackground: "#5aace1",
          titleColor: "#5aace1",
          zindex: 10000
        });
        document.querySelector("#NXConfirmValidationInput").placeholder = "000000";
      }

      function chooseMode(modeConfig) {
        for (option in modeConfig) {
          if (option == "presets") {
            if (!modeConfig.personalLoadoutsEnabled) {
              for (presetOption in modeConfig.presets) {
                let value = modeConfig.presets[presetOption];
                if (presetOption == "loadout") {
                  document.querySelector(".lobby-options-presets-primary_weapon").value = value[0];
                  document.querySelector(".lobby-options-presets-secondary_weapon").value = (typeof value[1] === "undefined" || value[1] == null) ? "none" : value[1];
                } else if (presetOption == "armorAbility") {
                  if (value == null) value = "none";
                  document.querySelector(".lobby-options-presets-armor_ability").value = value;
                } else if (presetOption == "grenades") {
                  document.querySelector(".lobby-options-presets-grenades_mk2").value = value["mk2"];
                  document.querySelector(".lobby-options-presets-grenades_plasma").value = value["plasma"];
                }
              }
            }
            continue;
          }
          if (option == "personalLoadoutsEnabled") {
            if (modeConfig[option]) {
              document.querySelector(".lobby-options-edit_presets").dataset.disabled = "1";
              if (document.querySelector(".edit-presets-container").style.display == "block") document.querySelector(".edit-presets-container").style.display = "";
            } else {
              document.querySelector(".lobby-options-edit_presets").removeAttribute("data-disabled");
            }
          }
          let element = document.querySelector(".lobby-options-" + option);
          if (typeof element.dataset.enabled === "undefined") {
            if (modeConfig[option] == null) {
              disableLobbyOption(option, false);
            } else {
              enableLobbyOption(option, false);
              element.value = modeConfig[option];
            }
          } else {
            let enabled = modeConfig[option] ? "1" : "0";
            element.dataset.enabled = enabled;
            if (enabled == "1") {
              element.innerHTML = '<i class="fa fa-retweet"></i> Enabled';
            } else {
              element.innerHTML = '<i class="fa fa-retweet"></i> Disabled';
            }
          }
        }
        currentModeConfig = modeConfig;
      }
      let threeLetterMonthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      function findLobby(lobbyName = null) {
        Notiflix.Loading.circle();
        Notiflix.Loading.change("Fetching latest server data...");
        user.getLobbies(function(lobbies) {
          currentLobbies = lobbies;
          lobbies = lobbies.reverse();
          openWindow("Lobbies", `
          <button class="button lobby-button lobby-create-button"><i class="fa fa-plus"></i> Create Lobby</button>
          <button class="button lobby-button lobby-enter-code-button"><i class="fa fa-unlock"></i> Enter Code</button>
          <hr>
          <div class="lobbies-description">A lobby is a game with custom presets created by other people. Lobbies marked red currently have no players in them. Lobbies marked green already have at least one player. The game will start when the required amount of players join that lobby.</div>
          <div class="lobby-list"></div>
          `);
          for (let i = 0; i < lobbies.length; i++) {
            let lobby = lobbies[i];
            if (lobby.code) continue;
            let lobbyCreationDate = new Date(lobby.creationDate);
            let lobbyCreatedAt = threeLetterMonthNames[lobbyCreationDate.toISOString().split("-")[1] - 1] + " " + lobbyCreationDate.toISOString().split("-")[2].split("T")[0] + " " + lobbyCreationDate.toISOString().split("-")[0] + " " + lobbyCreationDate.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
            document.querySelector(".lobby-list").innerHTML += `
            <div class="lobby" onclick="location.href = '/src.html?lobby=${lobby.name}'" ${(lobbyName && lobbyName == lobby.name) ? 'style="outline: 3px solid #5aace1"' : ""}>
              <div class="lobby-map-preview" style="background-image: url(/images/map-previews/${lobby.map}.png)"><span class="lobby-map-name">${lobby.map.replace(/_/g, " ")}</span></div>
              <div class="lobby-name">${lobby.name.trim()}</div>
              <div class="lobby-info">${lobbyCreatedAt} &bullet; Mode: <b>${lobby.mode.toUpperCase()}</b> &bullet; Score limit: <b>${lobby.scoreLimit}</b> &bullet; Time: <b>${lobby.timeLimit}</b> minutes</div>
              <div class="lobby-status lobby-status-${lobby.playersActive < 1 ? "inactive" : lobby.playersActive >= lobby.playersNeeded ? "full" : "active"}"><span class="lobby-status-player-count">${Math.min(lobby.playersActive, lobby.playersNeeded)}/${lobby.playersNeeded}</span></div>
            </div>
            `;
          }
        }, 1000);
      }
      function enableLobbyOption(option, updateConfig = true) {
        let element = document.querySelector(".lobby-options-" + option);
        element.removeAttribute("data-disabled");
        element.parentElement.querySelector("label").removeAttribute("data-disabled");
        if (element.parentElement.querySelector("input[type='checkbox']")) element.parentElement.querySelector("input[type='checkbox']").checked = true;
        element.value = element.dataset.defaultValue;
        if (updateConfig) updateLobbyConfig();
      }
      function disableLobbyOption(option, updateConfig = true) {
        let element = document.querySelector(".lobby-options-" + option);
        element.dataset.disabled = "1";
        element.parentElement.querySelector("label").dataset.disabled = "1";
        if (element.parentElement.querySelector("input[type='checkbox']")) element.parentElement.querySelector("input[type='checkbox']").checked = false;
        if (!isNaN(element.value)) element.dataset.defaultValue = element.value;
        element.value = "None";
        if (updateConfig) updateLobbyConfig();
      }
      function toggleLobbyOption(element) {
        let enabled = element.dataset.enabled == "0" ? "1" : "0";
        element.dataset.enabled = enabled;
        if (enabled == "1") {
          element.innerHTML = '<i class="fa fa-retweet"></i> Enabled';
          if (element.className == "lobby-options-teamsEnabled") enableLobbyOption("teamSize", false), updateLobbyInputs();
        } else {
          element.innerHTML = '<i class="fa fa-retweet"></i> Disabled';
          if (element.className == "lobby-options-teamsEnabled") disableLobbyOption("teamSize", false);
        }
        updateLobbyConfig();
      }
      function updateLobbyConfig() {
        let modeConfig = {
          mode: currentModeConfig.mode,
          scoreLimit: document.querySelector(".lobby-options-scoreLimit").dataset.disabled == "1" ? null : document.querySelector(".lobby-options-scoreLimit").value - 0,
          timeLimit: document.querySelector(".lobby-options-timeLimit").dataset.disabled == "1" ? null : document.querySelector(".lobby-options-timeLimit").value - 0,
          teamsEnabled: document.querySelector(".lobby-options-teamsEnabled").dataset.enabled == "1",
          teamSize: document.querySelector(".lobby-options-teamsEnabled").dataset.enabled == "1" ? document.querySelector(".lobby-options-teamSize").value - 0 : null,
          playersNeeded: document.querySelector(".lobby-options-playersNeeded").value - 0,
          personalLoadoutsEnabled: document.querySelector(".lobby-options-personalLoadoutsEnabled").dataset.enabled == "1",
          presets: {
            loadout: [document.querySelector(".lobby-options-presets-primary_weapon").value],
            armorAbility: document.querySelector(".lobby-options-presets-armor_ability").value == "none" ? null : document.querySelector(".lobby-options-presets-armor_ability").value,
            grenades: { "mk2": document.querySelector(".lobby-options-presets-grenades_mk2").value - 0, "plasma": document.querySelector(".lobby-options-presets-grenades_plasma").value - 0 }
          },
          radarEnabled: document.querySelector(".lobby-options-radarEnabled").dataset.enabled == "1",
          vehiclesEnabled: document.querySelector(".lobby-options-vehiclesEnabled").dataset.enabled == "1"
        };
        if (document.querySelector(".lobby-options-presets-secondary_weapon").value != "none") modeConfig.presets.loadout[1] = document.querySelector(".lobby-options-presets-secondary_weapon").value;
        chooseMode(modeConfig);
      }
      function updateLobbyMapPreview(map) {
        document.querySelector(".lobby-options-map-preview").style.backgroundImage = "url(/images/maps/" + map + ".png)";
      }
      function updateLobbyInputs(element = null) {
        document.querySelectorAll(".number-input").forEach(input => {
          if (!input.value) {
            setTimeout(function() {
              if (!input.value) input.value = input.dataset.min;
            }, 2000);
          } else {
            if (input.value != "None") input.value = Math.max(Math.min(input.value.replace(/[^0-9\s!?]/g, "") - 0, input.dataset.max - 0), input.dataset.min - 0);
          }
        });
        if (element.className.includes("lobby-options-playersNeeded")) {
          if (document.querySelector(".lobby-options-teamsEnabled").dataset.enabled == "1") {
            element.dataset.overrideTeams = "1";
          } else {
            element.dataset.overrideTeams = "0";
          }
        }
        if (document.querySelector(".lobby-options-playersNeeded").dataset.overrideTeams != "1" && document.querySelector(".lobby-options-teamsEnabled").dataset.enabled == "1") document.querySelector(".lobby-options-playersNeeded").value = (document.querySelector(".lobby-options-teamSize").value - 0) * 2;
        updateLobbyConfig();
      }

      document.addEventListener("click", function(event) {
        if (event.target.id == "lobby-button") {
          findLobby();
        } else if (event.target.className.includes("lobby-create-button")) {
          createLobby();
        } else if (event.target.className.includes("lobby-enter-code-button")) {
          enterCode();
        } else if (event.target.className == "window-close") {
          closeWindow();
        } else if (event.target.className == "lobby-options-score_enabled") {
          if (event.target.checked) {
            enableLobbyOption("scoreLimit");
          } else {
            disableLobbyOption("scoreLimit");
          }
        } else if (event.target.className == "lobby-options-time_enabled") {
          if (event.target.checked) {
            enableLobbyOption("timeLimit");
          } else {
            disableLobbyOption("timeLimit");
          }
        } else if (event.target.className == "lobby-options-edit_presets") {
          if (document.querySelector(".edit-presets-container").style.display == "block") {
            document.querySelector(".edit-presets-container").style.display = "";
          } else {
            document.querySelector(".edit-presets-container").style.display = "block";
          }
        } else if (event.target.className == "create-lobby-submit") {
          currentModeConfig.map = document.querySelector(".lobby-options-map").value;
          if (document.querySelector(".lobby-options-code_required").checked) {
            let code = Math.floor(100000 + Math.random() * 900000);
            currentModeConfig.code = code;
          }
          createLobby(false, document.querySelector(".lobby-options-name").value, currentModeConfig);
        }
      });

      let responsiveDisabled = false;
      function onWindowResize() {
        if (window.innerWidth > 1920 && window.innerHeight > 1080) {
          if (!responsiveDisabled) {
            responsiveDisabled = true;
            document.querySelector("#responsive-stylesheet").setAttribute("disabled", "disabled");
            document.querySelector("body").classList.add("auto-resize");
          }
          let averageScale = window.innerHeight / 720;
          let minWidth = 1280 * averageScale;
          if (window.innerWidth < minWidth) {
            let wrapperScale = (window.innerWidth / 1280);
            document.querySelector(".wrapper").style.transform = `scale(${wrapperScale})`;
            if (document.querySelector(".swal-modal")) {
              document.querySelector(".swal-modal").style.scale = wrapperScale * 1.5;
            }
          } else {
            let wrapperScale = (window.innerHeight / 720);
            document.querySelector(".wrapper").style.transform = `scale(${wrapperScale})`;
            if (document.querySelector(".swal-modal")) {
              document.querySelector(".swal-modal").style.scale = wrapperScale * 1.5;
            }
          }
        } else {
          if (responsiveDisabled) {
            responsiveDisabled = false;
            document.querySelector("#responsive-stylesheet").removeAttribute("disabled");
            document.querySelector("body").classList.remove("auto-resize");
            document.querySelector(".wrapper").style.transform = "";
            document.querySelector(".swal-modal").style.scale = "";
          }
        }
      }
      window.addEventListener("resize", onWindowResize);
      onWindowResize();
    </script>
  </body>
</html>
