<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS5 Multiplayer Shooter</title>
    <style>
      @font-face {
        font-family: "Aperture";
        src: url(/fonts/Aperture.ttf);
      }
      html, body {
        margin: 0 !important;
        font-family: Arial, Helvetica, sans-serif;
      }
      .wrapper {
        position: absolute;
        width: 100%;
        height: 100%;
        margin: 0;
        background: #cdd3d8;
        border: 20px solid #d9d9d9;
        box-sizing: border-box;
        background-image: url(/images/menu/splatter.png);
        background-repeat: no-repeat;
        background-position: center;
        background-size: 70%;
      }
      .header {
        font-family: "Aperture", monospace, Arial;
        font-size: 80px;
        color: #5aace1;
        text-align: center;
        margin: 0;
        margin-top: 50px;
      }
      .subheader {
        font-family: "Aperture", monospace, Arial;
        font-size: 30px;
        color: #5aace1;
        text-align: center;
        margin: 0;
        margin-top: 10px;
        text-shadow: 0 2px 3px rgba(0, 0, 0, 0.2);
      }
      .buttons-wrapper {
        position: absolute;
        width: 180px;
        left: 50%;
        margin-left: -90px;
        bottom: 50px;
      }
      .buttons-wrapper button.button {
        width: 100%;
        background: #cdd3d8;
        padding: 6px;
        font-size: 16px;
        border: 4px solid #5aace1;
        box-sizing: border-box;
        color: #5aace1;
        margin-top: 20px;
      }
      img.sniper {
        position: relative;
        width: 350px;
        left: 50%;
        margin-left: -175px;
        margin-top: 25px;
      }
      .copyright {
        position: absolute;
        width: 100%;
        text-align: center;
        bottom: 15px;
        color: #5aace1;
      }
      a {
        color: #5aace1 !important;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <h1 class="header">FPS 5</h1>
      <p class="subheader">MULTIPLAYER SHOOTER</p>
      <img class="sniper" src="/images/menu/sniper.png">
      <div class="buttons-wrapper">
        <button class="button">FIND LOBBY</button>
        <button class="button">PREFERENCES</button>
        <button class="button">WORLD CHAT</button>
        <button class="button">FORGE</button>
        <button class="button">HELP</button>
      </div>
      <div class="copyright">Copyright &copy; 2026 <a href="https://github.com/Parking-Master">Parking-Master</a></div>
    </div>
  </body>
</html>
