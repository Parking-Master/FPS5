<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS5 multiplayer shooter</title>
    <style>
      @font-face {
        font-family: "Arame";
        src: url(/fonts/Arame.ttf);
      }
      @keyframes health-flash {
        0% {
          box-shadow: inset 0 0 40px rgba(220, 30, 20, 0.8);
        }
        60% {
          box-shadow: inset 0 0 40px rgba(250, 50, 40, 0.2);
        }
        100% {
          box-shadow: inset 0 0 40px rgba(220, 30, 20, 0.8);
        }
      }
      html, body {
        margin: 0;
        overflow: hidden !important;
        user-select: none !important;
      }
      body {
        margin: 0;
        position: fixed;
        inset: 0;
        display: flex;
      }
      .vignette {
        position: relative;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        margin: 0;
        padding: 0;
        pointer-events: none !important;
        opacity: 1;
        transition: opacity 0.3s, box-shadow 0.5s;
        box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.6);
      }
      .hurt-screen {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        margin: 0;
        padding: 0;
        pointer-events: none !important;
        z-index: 99;
      }
      .crosshair {
        position: absolute;
        width: 20px;
        height: 20px;
        left: 50%;
        top: 50%;
        margin-left: -10px;
        margin-top: -10px;
      }
      .ui {
        position: fixed;
        width: 100%;
        height: 100%;
        pointer-events: none !important;
        z-index: 2147483645;
      }
      canvas {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .ui-section.top-section {
        position: absolute;
        width: 400px;
        top: 20px;
        left: 50%;
        margin-left: -200px;
        transform: perspective(600px) rotateX(-30deg);
      }
      .ui-section.top-section .ui-health-bar {
        position: relative;
        width: 100%;
        height: 30px;
        margin: 0;
        border: 2px solid rgba(100, 200, 255, 0.4);
        filter: drop-shadow(1px 1px 0px #fff);
        box-shadow: inset 0 0 20px rgba(200, 200, 255, 0.3);
        border-radius: 4px;
        transition: box-shadow .2s;
      }
      .ui-section.top-section .ui-health-value {
        position: relative;
        width: 100%;
        height: 100%;
        background: rgba(100, 100, 150, 0.3);
        transition: width 2s linear;
      }
      .ui-section.top-section .ui-health-bar.value-low {
        box-shadow: inset 0 0 20px rgba(255, 183, 120, 0.7);
        border: 2px solid rgba(255, 200, 10, 0.5);
      }
      .ui-section.top-section .ui-health-bar.value-low .ui-health-value {
        background: rgba(255, 200, 100, 0.4);
      }
      .ui-section.top-section .ui-health-bar.value-danger {
        animation: health-flash .5s infinite;
        border: 2px solid rgba(255, 60, 60, 0.5);
      }
      .ui-section.bottom-right-section {
        position: absolute;
        width: 150px;
        bottom: 40px;
        right: 60px;
        transform: perspective(600px) rotateY(-20deg) rotatez(2deg);
        font-family: Arial;
        filter: drop-shadow(1px 1px 0px #fff);
        text-shadow: 2px 2px 20px rgb(50, 50, 50);
      }
      .ui-section.bottom-right-section .ui-weapon {
        position: relative;
        padding: 6px;
        border-top: 2px solid rgba(100, 200, 255, 0.2);
        border-bottom: 2px solid rgba(100, 200, 255, 0.2);
        color: rgba(150, 160, 255, 0.7);
        letter-spacing: 2px;
      }
      .ui-section.bottom-right-section .ui-weapon .current-value {
        font-size: 24px;
      }
      .ui-section.bottom-right-section .ui-weapon .remaining-value {
        color: rgba(170, 170, 200, 0.7);
        font-size: 16px;
      }
      .ui-section.bottom-right-section .ui-weapon .remaining-value {
        color: rgba(170, 170, 200, 0.7);
        font-size: 16px;
      }
      .ui-section.bottom-right-section .ui-slot {
        position: relative;
        display: inline-block;
        color: rgba(180, 180, 255, 0.8);
        padding: 10px;
        line-height: 0.5;
        box-shadow: inset 15px 0px 10px 1px rgba(150, 170, 255, 0.25);
        border-right: 2px solid rgba(100, 200, 255, 0.2);
      }
      .ui-section.bottom-right-section .ui-slot .icon {
        width: 16px;
        vertical-align: middle;
        opacity: 0.8;
      }
      .ui-section.bottom-right-section .ui-slot.ui-slot-empty {
        opacity: 0.3;
      }
      .ui-radar {
        position: absolute;
        bottom: 40px;
        left: 90px;
        width: 150px;
        height: 130px;
        border-radius: 100%;
        background: rgba(100, 100, 150, 0.4);
        box-shadow: inset 0 0 50px rgba(210, 200, 200, 0.4);
        border: 2px solid rgba(100, 200, 255, 0.2);
        transform: perspective(500px) rotateY(10deg) rotateX(10deg);
        overflow: hidden;
      }
      .ui-section.bottom-right-section .ui-weapon .ui-ammo {
        display: inline-block;
      }
      .ui-section.bottom-right-section .ui-weapon .ui-primary-weapon-display {
        height: 24px;
        float: right;
        opacity: 0.4;
      }
      .ui-section.bottom-right-section .ui-secondary-weapon-display {
        height: 18px;
        opacity: 0.3;
        margin-left: 2px;
        filter: saturate(50%);
      }
      .ui-section.left-section {
        position: absolute;
        left: 40px;
        bottom: 30%;
        margin-bottom: 100px;
        z-index: 10;
      }
      .ui-section.left-section .ui-kill-stats .row {
        font-family: "Arame";
        font-size: 11px;
        font-weight: 600;
        color: #67d4ff;
      }
    </style>
  </head>
  <body>
    <script src="/js/three.js"></script>
    <script src="/js/GLTFLoader.js"></script>
    <script src="/js/Capsule.js"></script>
    <script src="/js/Octree.js"></script>
    <script src="/js/DecalGeometry.js"></script>
    <script src="/js/graphics.js"></script>
    <script src="/js/particles.js"></script>
    <script src="/js/audio.js"></script>
    <script src="/js/physics.js"></script>
    <script src="/js/text.js"></script>
    <script src="/js/Tween.js"></script>
    <script src="/js/PointerLockControls.js"></script>
    <script src="https://parking-master.github.io/Gametime.js-4.0/gametime.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/Parking-Master/Gametime.js/js/username-generator.js"></script>
    <div class="hurt-screen"></div>
    <div class="ui-section left-section">
      <div class="ui-kill-stats"></div>
    </div>
    <div class="ui" id="game-ui">
      <div class="vignette"></div>
      <img class="crosshair" src="/images/crosshairs/0.png">
      <div class="ui-section top-section">
        <div class="ui-health-bar">
          <div class="ui-health-value"></div>
        </div>
      </div>
      <div class="ui-section bottom-left-section">
        <div class="ui-radar">
          <canvas style="width: 100%; height: 100%" width="150" height="150"></canvas>
        </div>
      </div>
      <div class="ui-section bottom-right-section">
        <div class="ui-weapon">
          <div class="ui-ammo"><span class="current-value">36</span> <span class="remaining-value">/ 108</span></div>
          <img class="ui-primary-weapon-display">
        </div>
        <div class="ui-slot ui-grenades ui-grenades-mk2"><img class="icon" src="/images/ui/grenade_mk2.png"> <span class="value">0</span></div>
        <div class="ui-slot ui-grenades ui-grenades-plasma"><img class="icon" src="/images/ui/grenade_plasma.png"> <span class="value">0</span></div>
        <img class="ui-secondary-weapon-display">
      </div>
    </div>
    <script>
      if (!location.hostname.includes("fps5")) gametime.serverURL = "ws://192.168.70.58:4656";
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, 1440 / 900, 0.01, 1000);
      const clock = new THREE.Clock();
      const worldOctree = new THREE.Octree();

      let map = null;
      let playerOnFloor = false;
      let playerAgainstWall = false;
      let deathScreen = false;
      let frameCount = 0;
      const vectors = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Euler(), new THREE.Quaternion(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(0, 0, 1), new THREE.Quaternion(), new THREE.Euler(), new THREE.Quaternion(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(0.04, 0.04, 0.04), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(0, 1, 0)];
      const keyStates = {};
      const grenades = [];
      const vehicles = [];
      const playerCollider = new THREE.Capsule(new THREE.Vector3(0, 0.35, 0), new THREE.Vector3(0, 1, 0), 0.35);
      const playerVelocity = vectors[7];
      const playerDirection = vectors[8];
      const playerSpeeds = [];
      const STEPS_PER_FRAME = 4;

      camera.rotation.order = "YXZ";
      scene.add(camera);
      document.body.appendChild(renderer.domElement);
      graphics.activate();
      audio.initialize();

      function animate(now) {
        const clockDelta = clock.getDelta();
        const deltaTime = Math.min(0.04, clockDelta) / STEPS_PER_FRAME;
        const time = Date.now();
        const weapon = utils.weapons.getCurrentEntry();

        const cameraPosition = camera.getWorldPosition(vectors[6]);
        const cameraRotation = vectors[9];
        camera.getWorldQuaternion(vectors[10]);
        cameraRotation.setFromQuaternion(vectors[10]);

        for (let i = 0; i < STEPS_PER_FRAME; i++) {
          utils.physics.controls(deltaTime);
          utils.physics.updatePlayer(deltaTime);
          utils.physics.updateGrenades(deltaTime, time, i);
          utils.physics.updateVehicles(deltaTime, time, i);
          utils.players.update();
        }

        TWEEN.update();
        particles.update();
        utils.ui.update(weapon.currentAmmo, weapon.ammo, sandbox.grenades, weapon.reticle);
        audio.update(cameraPosition, cameraRotation);
        utils.weapons.position(cameraPosition, cameraRotation);

        for (let i = 0; i < sandbox.models.length; i++) {
          if (sandbox.models[i].loaded && sandbox.models[i].model.animationMixer) {
            sandbox.models[i].model.animationMixer.update(clockDelta);
          }
        }

        let playersIterated = false;
        for (player in utils.players.objects) {
          playersIterated = true;
          const playerObject = utils.players.objects[player];
          if (playerObject) {
            if (frameCount % 4 == 0) utils.ui.radar.update(playerObject);
            if (playerObject.animationMixer) {
              playerObject.animationMixer.update(clockDelta);
              if (!playerObject.isRunning && (playerObject.vehicle ? playerObject.vehicle.seat != "driver" : true)) {
                const offset = playerObject.weapon.type == "pistol" ? 1.3 : 0.9;
                const weaponRotation = Math.min(Math.max(-playerObject.weaponRotation + offset, 0.1), 1.7);
                const rightShoulder = playerObject.scene.getObjectByName("mixamorigRightShoulder");
                const leftShoulder = playerObject.scene.getObjectByName("mixamorigLeftShoulder");
                const head = playerObject.scene.getObjectByName("mixamorigHead");
                rightShoulder.rotation.x = weaponRotation;
                leftShoulder.rotation.x = weaponRotation;
                head.rotation.x = weaponRotation - offset;
                if (playerObject.isWalking && playerObject.weapon.type == "rifle") {
                  if (playerObject.isCrouching) {
                    rightShoulder.rotation.x += 0.4;
                  } else {
                    rightShoulder.rotation.x += 7;
                  }
                  leftShoulder.rotation.x += .2;
                  head.rotation.x -= offset - .4;
                }
              }
            }
          }
        }
        if (!playersIterated) utils.ui.radar.update(null);
        if (frameCount % 3 == 0) utils.weapons.updateAim(weapon);

        const tmpObjects = utils.options.get("tmpObjects");
        for (uuid in tmpObjects) {
          const object = tmpObjects[uuid];
          if (object.disposeTime == 0 ? object.addedOnFrame != frameCount : time - object.timestamp > object.disposeTime) {
            if (object.objectType == "muzzleFlash") {
              object.opacity = 0;
              delete tmpObjects[uuid];
            } else if (object.objectType == "bulletHole") {
              scene.remove(object);
              object.geometry.dispose();
              delete tmpObjects[uuid];
            } else if (object.objectType == "deathPose") {
              if (object.isFirstPerson) {
                utils.models.get("pose").model.scene.add(object);
              } else {
                scene.remove(object);
              }
              delete tmpObjects[uuid];
            } else if (object.objectType == "htmlElement") {
              object.remove();
              delete tmpObjects[uuid];
            } else if (object.objectType == "hurtScreen") {
              utils.ui.elements.hurtScreen.style = `transition: box-shadow ${Math.max(Math.pow(Math.min(object.intensity, 1), 2), 0.2)}s ease-out; box-shadow: inset 0px 0px 0px transparent; opacity: ${Math.min(object.intensity, 1)}`;
              delete tmpObjects[uuid];
            } else if (object.objectType == "resetStyle") {
              object.style = "";
              delete tmpObjects[uuid];
            }
          }
          if (object.objectType == "deathPose" && object.parentType == "camera") {
            object.position.copy(camera.position);
            object.position.y += -1;
            if (time - object.timestamp > sandbox.presets.respawnTime * 1000 - 10) {
              object.parentType = "player";
            }
          }
        }

        if (time - utils.health.lastHitTimestamp > 6000) {
          utils.health.increment(clockDelta);
        }

        const deathTime = utils.options.get("DeathTime");
        if (deathTime) {
          if (time - deathTime > sandbox.presets.respawnTime * 1000) {
            utils.health.respawn();
          }
          const killer = utils.options.get("Killer");
          if (killer) {
            let target = null;
            if (killer.killType == "self") {
              target = killer.body;
            } else {
              target = utils.players.objects[killer].scene;
            }
            const targetQuaternion = vectors[16];
            targetQuaternion.set(0, 0, 0, 1);
            const matrix = new THREE.Matrix4().lookAt(camera.position, target.position, camera.up);
            targetQuaternion.setFromRotationMatrix(matrix);
            camera.quaternion.slerp(targetQuaternion, 0.04);
          }
        }

        frameCount++;

        if (weapon.scope) {
          if (utils.options.get("Zoomed") || !weapon.scopeRendered) {
            if (!weapon.scopeRendered) {
              weapon.scopeRendered = true;
              sandbox.currentWeapon.getObjectByName("Lens").material.color.setHex(weapon.scopeColor[1]);
            }
            const compass = utils.options.get("scopeCompass");
            compass.position.z = -1;
            compass.rotation.z = camera.rotation.y;
            renderer.setRenderTarget(utils.options.get("scopeRenderTarget"));
            renderer.render(scene, sandbox.currentWeapon.getObjectByName("LensCamera"));
            renderer.setRenderTarget(null);
          }
        }
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      function generateUUID() {
        return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c) {
          let r = Math.random() * 16 | 0;
          let v = (c == "x" ? r : (r & 0x3 | 0x8));
          return v.toString(16);
        });
      }

      sandbox = {
        setup: false,
        presets: {
          map: "Cargo_Port",
          character: "Raven",
          respawnTime: 5,
          loadout: ["Ace-35r", "HK-G28"],
          grenades: {
            "mk2": 2,
            "plasma": 0
          },
          options: {
            gravity: 10,
            teamGame: false,
            teamSize: 2,
            teamOrder: null
          }
        },
        loadout: [],
        grenades: {},
        currentWeapon: null,
        primaryWeapon: null,
        secondaryWeapon: null,
        controls: {
          "fire": ["KeyF", "BracketRight"],
          "zoom": ["KeyI"],
          "reload": ["KeyR"],
          "switch": ["KeyY", "Tab"],
          "grenade": ["KeyG"],
          "melee": ["KeyB"],
          "sprint": ["ShiftLeft"],
          "crouch": ["KeyC"],
          "enterVehicle": ["KeyE", "KeyT"],
          "vehicleView": ["KeyV"],
        },
        initialize: function() {
          gametime.set("player", {
            character: sandbox.presets.character,
            position: [0, 0, 0],
            rotation: [0, 0, 0],
            loadout: sandbox.loadout,
            visibleOnRadar: false,
            team: null
          });
          gametime.set("username", generateName());
          gametime.connect();
          gametime.onconnect = function() {
            if (sandbox.setup) return;
            sandbox.setup = true;
            if (sandbox.presets.options.teamGame) {
              gametime.player.data.team = sandbox.presets.options.teamOrder[gametime.player.position - 1];
              utils.players.setArmorColor("self");
            }
            utils.ui.radar.init();
            utils.health.respawn();
            animate();
            renderer.shadowMap.needsUpdate = true;
            audio.ambience(sandbox.maps[sandbox.presets.map].ambienceSound);
          };
        },
        loadingManager: new THREE.LoadingManager(),
        models: [
          {
            id: "map",
            path: "/models/maps/Cargo_Port.glb",
            model: null,
            loaded: false,
            removeAfterLoaded: false,
            requiredMaps: ["Cargo_Port"],
            callback: function(model) {
              map = model.scene;
              worldOctree.fromGraphNode(map);
              if (sandbox.maps[sandbox.presets.map].vehicles.length > 0) physics.initialize(map);
              map.traverse(child => {
                child.frustumCulled = false;
                if (child.isMesh) {
                  child.castShadow = true;
                  child.receiveShadow = true;
                  if (child.material.map) child.material.map.anisotropy = 4;
                }
              });
              sky = new THREE.Mesh(new THREE.SphereGeometry(100, 25, 25), new THREE.MeshBasicMaterial({
                color: 0xffffff,
                map: new THREE.TextureLoader().load("/images/assets/skies/0.png"),
                side: THREE.BackSide
              }));
              scene.add(sky);
            }
          },
          {
            id: "map",
            path: "/models/maps/Lihid.glb",
            model: null,
            loaded: false,
            removeAfterLoaded: false,
            requiredMaps: ["Lihid"],
            callback: function(model) {
              map = model.scene;
              worldOctree.fromGraphNode(map);
              map.traverse(child => {
                child.frustumCulled = false;
                if (child.isMesh) {
                  child.castShadow = true;
                  child.receiveShadow = true;
                  if (child.material.map) child.material.map.anisotropy = 4;
                }
              });
              sky = new THREE.Mesh(new THREE.SphereGeometry(100, 25, 25), new THREE.MeshBasicMaterial({
                color: 0xf9c886,
                map: new THREE.TextureLoader().load("/images/assets/skies/1.png"),
                side: THREE.BackSide
              }));
              sky.position.y = 2;
              scene.add(sky);
            }
          },
          {
            id: "pose",
            path: null,
            model: null,
            loaded: false,
            requiredMaps: "all",
            callback: function(model) {
              model.scene.traverse(child => child.frustumCulled = false);
            }
          },
          {
            id: "weapon.AK-74",
            path: "/models/weapons/AK-74.glb",
            model: null,
            loaded: false,
            requiredMaps: []
          },
          {
            id: "weapon.FN-502",
            path: "/models/weapons/FN-502.glb",
            model: null,
            loaded: false,
            requiredMaps: []
          },
          {
            id: "weapon.SCAR-H",
            path: "/models/weapons/SCAR-H.glb",
            model: null,

            requiredMaps: []
          },
          {
            id: "weapon.30-SST",

            model: null,
            loaded: false,
            requiredMaps: []
          },
          {
            id: "weapon.HK-G28",
            path: "/models/weapons/HK-G28.glb",
            model: null,
            loaded: false,
            requiredMaps: []
          },
          {
            id: "weapon.Phone-Gun",
            path: "/models/weapons/Phone-Gun.glb",
            model: null,
            loaded: false,
            requiredMaps: []
          },
          {
            id: "weapon.Ace-35r",
            path: "/models/weapons/Ace-35r.glb",
            model: null,
            loaded: false,
            requiredMaps: []
          },
          {
            id: "grenade.MK2",
            path: "/models/weapons/grenades/MK2.glb",
            model: null,
            loaded: false,
            removeAfterLoaded: false,
            requiredMaps: "all",
            callback: function(model) {
              const glow = new THREE.Sprite(new THREE.SpriteMaterial({ color: 0xff8888, opacity: 0.6, map: new THREE.TextureLoader().load("/images/assets/glow/0.png"), sizeAttenuation: true, depthWrite: false }));
              glow.scale.set(0.3, 0.3, 0.3);
              model.scene.add(glow);
              for (let i = 0; i < 6; i++) {
                const grenade = i == 0 ? model.scene : model.scene.clone();
                scene.add(grenade);
                utils.grenades.add(grenade, "mk2");
              }
            }
          },
          {
            id: "grenade.Plasma",

            model: null,
            loaded: false,
            removeAfterLoaded: false,

              const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.TextureLoader().load("/images/assets/glow/2.png"), sizeAttenuation: true, depthWrite: false }));
              glow.scale.set(0.5, 0.5, 0.5);
              glow.position.z = 0.2;
              const group = new THREE.Group();
              group.add(glow);
              model.scene.add(group);
              for (let i = 0; i < 6; i++) {
                const grenade = i == 0 ? model.scene : model.scene.clone();
                scene.add(grenade);
                utils.grenades.add(grenade, "plasma");
              }
            }
          },
          {

          },
          {

          },
          {

            model: null,

            requiredMaps: "all"
          },
          {
            id: "propweapon.30-SST",
            path: "/models/characters/weapons/30-SST.glb",
            model: null,
            loaded: false,
            requiredMaps: "all"
          },
          {
            id: "propweapon.HK-G28",
            path: "/models/characters/weapons/HK-G28.glb",
            model: null,
            loaded: false,
            requiredMaps: "all"
          },
          {
            id: "propweapon.Phone-Gun",
            path: "/models/characters/weapons/Phone-Gun.glb",
            model: null,
            loaded: false,
            requiredMaps: "all"
          },

          radar: {
            init: function(radarRange = 18) {
              const radarCanvas = utils.ui.elements.radarCanvas;
              const ctx = radarCanvas.getContext("2d");
              const radarRadiusPx = 75;
              const worldUp = new THREE.Vector3(0, 1, 0);
              const forward = new THREE.Vector3();
              const forwardH = new THREE.Vector3();
              const right = new THREE.Vector3();
              const tmpVec3 = new THREE.Vector3();
              function updatePlayerBasis() {
                camera.getWorldDirection(forward);
                forward.negate();
                forwardH.copy(forward).addScaledVector(worldUp, -forward.dot(worldUp)).normalize();
                right.crossVectors(worldUp, forwardH).normalize();
              }
              function computeRadarBlipForEnemy(enemy) {
                const playerPos = tmpVec3.setFromMatrixPosition(camera.matrixWorld);
                const enemyPos = vectors[11].setFromMatrixPosition(enemy.matrixWorld);
                const V = enemyPos.sub(playerPos);
                const dotVy = V.dot(worldUp);
                const Vh = V.addScaledVector(worldUp, -dotVy);
                if (Vh.lengthSq() === 0) return null;
                const xLocal = Vh.dot(right);
                const yLocal = -Vh.dot(forwardH);
                const d = Math.sqrt(xLocal * xLocal + yLocal * yLocal);
                if (d === 0) return { x: radarRadiusPx, y: radarRadiusPx };
                const dClamped = Math.min(d, radarRange);
                const scale = dClamped / radarRange;
                const nx = xLocal / d;
                const ny = yLocal / d;
                const xOffset = nx * scale * radarRadiusPx;
                const yOffset = ny * scale * radarRadiusPx;
                const screenX = radarRadiusPx + xOffset;
                const screenY = radarRadiusPx - yOffset;
                return { x: screenX, y: screenY };
              }
              utils.ui.radar.update = function(enemy = null) {
                const radarCanvas = utils.ui.elements.radarCanvas;
                updatePlayerBasis();
                ctx.clearRect(0, 0, radarCanvas.width, radarCanvas.height);
                ctx.beginPath();
                ctx.fillStyle = "rgba(160, 150, 150, 0.25)";
                ctx.moveTo(radarRadiusPx, radarRadiusPx);
                ctx.lineTo(150, 0);
                ctx.lineTo(0, 0);
                ctx.lineTo(radarRadiusPx, radarRadiusPx);
                ctx.fill();
                const playerSpeed = Math.sqrt(Math.pow(playerVelocity.x, 2) + Math.pow(playerVelocity.y, 2) + Math.pow(playerVelocity.z, 2));
                playerSpeeds.push(playerSpeed);
                if (playerSpeeds.length > 10) playerSpeeds.shift();
                const averageSpeed = playerSpeeds.reduce((a, b) => a + b) / playerSpeeds.length;
                const speedThreshold = (utils.options.get("Crouching") ? 1.3 : 0.03);
                const inVehicle = utils.vehicles.check(true);
                if (averageSpeed > speedThreshold || utils.options.get("Firing") || inVehicle) {
                  ctx.beginPath();
                  ctx.fillStyle = "rgba(242, 218, 60, 0.8)";
                  ctx.arc(radarRadiusPx, radarRadiusPx, inVehicle ? 8 : 4, 0, 2 * Math.PI);
                  ctx.fill();
                  gametime.player.data.visibleOnRadar = true;
                } else {
                  gametime.player.data.visibleOnRadar = false;
                }
                if (enemy && enemy.visibleOnRadar && camera.position.distanceTo(enemy.scene.position) < radarRange + 3) {
                  const blip = computeRadarBlipForEnemy(enemy.scene);
                  if (!blip) return;
                  ctx.beginPath();
                  ctx.fillStyle = "rgba(255, 20, 20, 0.8)";
                  ctx.arc(blip.x, blip.y, enemy.vehicle ? 8 : 4, 0, Math.PI * 2);
                  ctx.fill();
                  ctx.restore();
                }
              };
              utils.ui.radar.update();
            },
            update: null
          },

              let realDamage = null;

              if (animation == "rifle_idle" || animation == "pistol_idle") clip.loop = THREE.LoopRepeat;
              if (animation == "rifle_walk" || animation == "pistol_walk") {
                clip.loop = THREE.LoopRepeat;
                clip.reset();
              }

              if (options.loop) clip.loop = options.loop;
              if (options.reset) clip.reset();
              clip.play();

              if (typeof onfinish == "function") {
                let finished = false;
                let customCallback = function(event) {
                  if (event.action === clip) {
                    if (finished) return;
                    finished = true;
                    onfinish();
                    player.animationMixer.removeEventListener("finished", customCallback);

        physics: {
          getSideOfCamera: function(position) {
            const forward = vectors[13];
            camera.getWorldDirection(forward).normalize();
            const right = vectors[14];
            right.crossVectors(forward, camera.up).normalize();
            const toObject = vectors[21].copy(position).sub(camera.position).normalize();
            const f = forward.dot(toObject);
            const r = right.dot(toObject);
            if (f > 0.5 && r > 0.5) return "topRight";
            if (f > 0.5 && r < -0.5) return "topLeft";
            if (f < -0.5 && r > 0.5) return "bottomRight";
            if (f < -0.5 && r < -0.5) return "bottomLeft";
            if (f > 0.5) return "top";
            if (f < -0.5) return "bottom";
            if (r > 0.5) return "right";
            if (r < -0.5) return "left";
            return "all";
          },
          getCameraForwardVector: function() {
            camera.getWorldDirection(playerDirection);
            playerDirection.y = 0;
            playerDirection.normalize();
            return playerDirection;
          },
          getCameraSideVector: function() {
            camera.getWorldDirection(playerDirection);
            playerDirection.y = 0;
            playerDirection.normalize();
            playerDirection.cross(camera.up);
            return playerDirection;
          },
          controls: function(deltaTime) {
            if (deathScreen) return;
            const vehicle = utils.options.get("CurrentVehicle");
            if (vehicle) {
              if (keyStates["KeyW"] || keyStates["ArrowUp"]) {
                utils.vehicles.throttle(vehicle, "drive", deltaTime);
              }
              if (keyStates["KeyS"] || keyStates["ArrowDown"]) {
                utils.vehicles.throttle(vehicle, "reverse", deltaTime);
              }
              if (keyStates["KeyA"] || keyStates["ArrowLeft"]) {
                utils.vehicles.steer(vehicle, "left", deltaTime);
              }
              if (keyStates["KeyD"] || keyStates["ArrowRight"]) {
                utils.vehicles.steer(vehicle, "right", deltaTime);
              }
            } else {
              const walkSpeed = deltaTime * (playerOnFloor ? 24 : 1.5) * (utils.options.get("Sprinting") ? 2 : utils.options.get("Crouching") ? 0.5 : 1);
              if (keyStates["KeyW"] || keyStates["ArrowUp"]) {
                playerVelocity.add(utils.physics.getCameraForwardVector().multiplyScalar(walkSpeed));
              }
              if (keyStates["KeyS"] || keyStates["ArrowDown"]) {
                playerVelocity.add(utils.physics.getCameraForwardVector().multiplyScalar(-walkSpeed));
              }
              if (keyStates["KeyA"] || keyStates["ArrowLeft"]) {
                playerVelocity.add(utils.physics.getCameraSideVector().multiplyScalar(-walkSpeed));
              }
              if (keyStates["KeyD"] || keyStates["ArrowRight"]) {
                playerVelocity.add(utils.physics.getCameraSideVector().multiplyScalar(walkSpeed));
              }
              if (playerOnFloor && keyStates["Space"]) utils.weapons.jump();
            }
          },
          updatePlayer: function(deltaTime) {
            let damping = (Math.exp(-4 * deltaTime) - 1) * 2;
            if (!playerOnFloor) {
              playerVelocity.y -= sandbox.presets.options.gravity * deltaTime;
              damping *= 0.1;
            }
            playerVelocity.addScaledVector(playerVelocity, damping);
            const deltaPosition = vectors[22].copy(playerVelocity).multiplyScalar(deltaTime);
            playerCollider.translate(deltaPosition);
            const result = worldOctree.capsuleIntersect(playerCollider);
            playerOnFloor = false;
            playerAgainstWall = false;
            if (result) {
              playerOnFloor = result.normal.y > 0;
              playerAgainstWall = (result.normal.x > 0) || (result.normal.z > 0);
              if (!playerOnFloor) playerVelocity.addScaledVector(result.normal, -result.normal.dot(playerVelocity));
              playerCollider.translate(result.normal.multiplyScalar(result.depth));
            }
            if (!utils.vehicles.check(true)) camera.position.copy(playerCollider.end);
            if (camera.position.y <= -40) {
              utils.health.die("self");
            }
          },
          updateGrenades: function(deltaTime, time, loop) {
            for (let i = 0; i < grenades.length; i++) {
              const grenade = grenades[i];
              if (grenade.available) continue;
              if (grenade.collider.center.y < -40 && grenade.collider.center.y > -1000) grenade.hits++;
              if (grenade.smoke && time % 3 == 0 && loop == 0) particles.dust(grenade.mesh.position, 0.05);
              if (grenade.hits > 0 && time - grenade.timestamp > grenade.explodeTime && grenade.explode) utils.grenades.explode(grenade);
              if (grenade.type == "plasma") grenade.mesh.children[1].lookAt(camera.position);
              if (grenade.stuck) continue;
              grenade.mesh.rotation.x += grenade.angularVelocity.x * deltaTime;
              grenade.mesh.rotation.y += grenade.angularVelocity.y * deltaTime;
              grenade.mesh.rotation.z += grenade.angularVelocity.z * deltaTime;
              grenade.collider.center.addScaledVector(grenade.velocity, deltaTime);
              const result = worldOctree.sphereIntersect(grenade.collider);
              if (result) {
                grenade.hits++;
                grenade.velocity.addScaledVector(result.normal, -result.normal.dot(grenade.velocity) * 1.8);
                if (grenade.type == "mk2") {
                  grenade.doSound = true;
                  if (grenade.doSound && !grenade.didSound && grenade.hits < 8) {
                    grenade.didSound = true;
                    audio.grenadeHit(grenade.mesh.position);
                  }
                }
                if (grenade.timestamp == null) {
                  grenade.timestamp = time;
                }
                const rotationAxis = vectors[0].crossVectors(result.normal, grenade.velocity).normalize();
                const rotationSpeed = grenade.velocity.length() * 0.2;
                grenade.angularVelocity.addScaledVector(rotationAxis, rotationSpeed);
                grenade.collider.center.add(result.normal.multiplyScalar(result.depth));
              } else {
                grenade.velocity.y -= (sandbox.presets.options.gravity * deltaTime + 0.01) * 1.8;
                grenade.didSound = false;
                grenade.doSound = false;
              }
              const damping = (Math.exp(deltaTime * -2.3) - 1.003) / 1.2;
              grenade.velocity.addScaledVector(grenade.velocity, damping);
              grenade.angularVelocity.addScaledVector(grenade.angularVelocity, damping);
              const grenade1 = grenades[i];
              const grenade2 = grenades[i + 1];
              if (grenade2) {
                const d2 = grenade1.collider.center.distanceToSquared(grenade2.collider.center);
                const r = grenade1.collider.radius + grenade2.collider.radius;
                const r2 = r * r;
                if (d2 < r2) {
                  const normal = vectors[1].subVectors(grenade1.collider.center, grenade2.collider.center).normalize();
                  const v1 = vectors[2].copy(normal).multiplyScalar(normal.dot(grenade1.velocity));
                  const v2 = vectors[3].copy(normal).multiplyScalar(normal.dot(grenade2.velocity));
                  grenade1.velocity.add(v2).sub(v1);
                  grenade2.velocity.add(v1).sub(v2);
                  const d = (r - Math.sqrt(d2)) / 20;
                  grenade1.collider.center.addScaledVector(normal, d);
                  grenade2.collider.center.addScaledVector(normal, - d);
                }
              }
              grenade.mesh.position.copy(grenade.collider.center);
              if (grenade.type == "plasma") {
                for (player in utils.players.objects) {
                  const playerObject = utils.players.objects[player];
                  if (playerObject) {
                    const playerPosition = vectors[19];
                    playerPosition.set(playerObject.scene.position.x, playerObject.scene.position.y + 1, playerObject.scene.position.z);
                    if (!grenade.stuck) {
                      if (grenade.mesh.position.distanceTo(playerPosition) < 0.5) {
                        audio.grenadeExplosion(grenade.mesh.position, grenade.type, true);
                        grenade.stuck = true;
                        grenade.explodeTime = 1200;
                        grenade.hits = 1;
                        grenade.timestamp = time;
                        playerObject.scene.add(grenade.mesh);
                        const worldPosition = vectors[20];
                        worldPosition.copy(grenade.mesh.position);
                        playerObject.scene.updateMatrixWorld(true);
                        const localPosition = playerObject.scene.worldToLocal(worldPosition);
                        grenade.mesh.position.copy(localPosition);
                      }
                    }
                  }
                }
                if (!grenade.stuck && grenade.mesh.position.distanceTo(camera.position) < 0.5) {
                  audio.grenadeExplosion(grenade.mesh.position, grenade.type, true);
                  grenade.stuck = true;
                  grenade.explodeTime = 1200;
                  grenade.hits = 1;
                  grenade.timestamp = time;
                  camera.add(grenade.mesh);
                  grenade.mesh.position.set(-0.15, -0.1, -0.2);
                }
              }
            }
          },
          updateVehicles: function(deltaTime, time, loop) {
            physics.update(deltaTime, !utils.vehicles.check(true));
            for (let i = 0; i < vehicles.length; i++) {
              const vehicle = vehicles[i];
              audio.updateVehicle(vehicle);
              if (vehicle.allowedToUpdate) {
                for (let j = 0; j < vehicle.seats.length; j++) vehicle.seats[j].taken = false;
                vehicle.shadow.position.set(vehicle.mesh.position.x, 0.05, vehicle.mesh.position.z);
                vehicle.shadow.rotation.set(-Math.PI / 2, 0, vehicle.mesh.rotation.y);
                const shiftFactor = vehicle.physicsVariables.gear == "drive" ? 1 : -1;
                if (vehicle.physicsVariables.throttle) {
                  if (vehicle.physicsVariables.gear == "drive") {
                    if (vehicle.physicsVariables.enginePower < vehicle.physicsVariables.maxEnginePower) vehicle.physicsVariables.enginePower += 10;
                  } else if (vehicle.physicsVariables.gear == "reverse") {
                    if (vehicle.physicsVariables.enginePower > -vehicle.physicsVariables.maxEnginePowerReverse) vehicle.physicsVariables.enginePower -= 10;
                  }
                } else {
                  if ((vehicle.physicsVariables.enginePower > -10 && vehicle.physicsVariables.enginePower < 10) || time - vehicle.lastCollision < 200) {
                    vehicle.physicsVariables.enginePower = 0;
                  } else if (vehicle.physicsVariables.enginePower > 0) {
                    vehicle.physicsVariables.enginePower -= 2 * deltaTime * 125;
                  } else if (vehicle.physicsVariables.enginePower < 0) {
                    vehicle.physicsVariables.enginePower += 3 * deltaTime * 125;
                  }
                }
                physics.forward.set(0, 0, -1);
                vehicle.body.quaternion.vmult(physics.forward, physics.forward);
                physics.forward.scale(vehicle.physicsVariables.enginePower * deltaTime, physics.forward);
                const result = physics._vec1;
                result.set(0, 0, 0);
                vehicle.body.velocity.lerp(physics.forward, 0.06, result);
                vehicle.body.velocity.set(result.x, vehicle.body.velocity.y, result.z);
                const speed = Math.sqrt(Math.pow(vehicle.body.velocity.x, 2) + Math.pow(vehicle.body.velocity.y, 2) + Math.pow(vehicle.body.velocity.z, 2));
                vehicle.speed = speed;
                const turningAngle = utils.vehicles.calculateTurningAngle(speed * (vehicle.physicsVariables.enginePower > 0 ? 1 : -1), vehicle.physicsVariables.heading);
                const target = physics._vec4.copy(vehicle.body.angularVelocity);
                target.y = turningAngle * 400;
                result.set(0, 0, 0);
                vehicle.body.angularVelocity.lerp(target, 0.3, result);
                vehicle.body.angularVelocity.set(result.x, result.y, result.z);
                vehicle.physicsVariables.heading += utils.vehicles.calculateHeadingReset(vehicle.physicsVariables.heading, speed);
                vehicle.mesh.getObjectByName("Steering_Wheel").rotation.y = -vehicle.physicsVariables.heading * 10;
                const wheelVelocity = -(speed / 2.54) * deltaTime * shiftFactor * 6;
                const wheel_fl = vehicle.mesh.getObjectByName("Wheel_FL");
                const wheel_fr = vehicle.mesh.getObjectByName("Wheel_FR");
                const wheel_rl = vehicle.mesh.getObjectByName("Wheel_RL");
                const wheel_rr = vehicle.mesh.getObjectByName("Wheel_RR");
                wheel_fl.rotation.order = "ZXY";
                wheel_fr.rotation.order = "ZXY";
                wheel_fl.rotation.z = vehicle.physicsVariables.heading * 2;
                wheel_fr.rotation.z = vehicle.physicsVariables.heading * 2;
                wheel_fl.rotation.x += wheelVelocity;
                wheel_fr.rotation.x += wheelVelocity;
                wheel_rl.rotation.x += wheelVelocity;
                wheel_rr.rotation.x += wheelVelocity;
                if (vehicle.currentSeat) {
                  if (vehicle.currentView == 1) {
                    if (vehicle.currentSeat.type == "driver") {
                      const motion = vectors[5];
                      motion.set(vehicle.body.angularVelocity.y / 5, 0.7, speed / 50 + 3);
                      vectors[24].set(vehicle.mesh.position.x, vehicle.mesh.position.y + 0.5, vehicle.mesh.position.z);
                      camera.lookAt(vectors[24]);
                      camera.position.lerp(motion, 0.02);
                    } else {
                      camera.position.set(0, 0, 0);
                      camera.translateY(0.5);
                      camera.translateZ(3);
                    }
                  } else {
                    const motion = vectors[5];
                    motion.set(vehicle.body.velocity.x / 150, vehicle.body.velocity.y / 150, vehicle.body.velocity.z / 150);
                    camera.position.lerp(motion, 0.02);
                  }
                  gametime.player.data.vehicle.condition = vehicle.condition;
                  gametime.player.data.vehicle.horn = vehicle.horn;
                  gametime.player.data.vehicle.heading = vehicle.physicsVariables.heading;
                  gametime.player.data.vehicle.throttle = vehicle.physicsVariables.throttle;
                  gametime.player.data.vehicle.enginePower = vehicle.physicsVariables.enginePower;
                  gametime.player.data.vehicle.gear = vehicle.physicsVariables.gear;
                  gametime.player.data.vehicle.position = [vehicle.body.velocity.x, vehicle.body.velocity.y, vehicle.body.velocity.z, vehicle.body.position.x, vehicle.body.position.y, vehicle.body.position.z, vehicle.body.quaternion.x, vehicle.body.quaternion.y, vehicle.body.quaternion.z, vehicle.body.quaternion.w, vehicle.physicsVariables.heading];
                  if (frameCount % 60 == 0 && speed < 1 && utils.vehicles.checkIfFlipped(vehicle)) utils.vehicles.exit();
                }
                if (vehicle.smoke && time % 6 == 0 && loop == 0) particles.dust(vehicle.mesh.position, 4);
                function applyDamageLevel(level) {
                  if (level == 0) {
                    const windshield = vehicle.mesh.getObjectByName("Windshield");
                    windshield.material = utils.options.get("materials").windshield;
                  } else if (level == 1) {
                    const windshield = vehicle.mesh.getObjectByName("Windshield");
                    windshield.material = utils.options.get("materials").shattered_windshield;
                  } else if (level == 2) {
                    vehicle.smoke = true;
                  } else if (level == 3) {
                    utils.vehicles.explode(vehicle);
                  }
                }
                if (vehicle.mesh.position.y < -40) vehicle.condition = 0;
                if (vehicle.condition <= 0) {
                  vehicle.damageLevel = 3;
                } else if (vehicle.condition < 40) {
                  vehicle.damageLevel = 2;
                } else if (vehicle.condition < 80) {
                  vehicle.damageLevel = 1;
                } else {
                  vehicle.damageLevel = 0;
                }
                for (let level = 0; level < 4; level++) {
                  if (level <= vehicle.damageLevel && !vehicle.currentDamage.includes(level)) {
                    vehicle.currentDamage.push(level);
                    applyDamageLevel(level);
                  }
                }
              }
              if (vehicle.despawnTime != null) {
                if (time - vehicle.despawnTime > vehicle.respawnTime) {
                  utils.vehicles.respawn(vehicle);
                }
              }
            }
          }
        },
        models: {
          get: function(id) {
            return sandbox.models.filter(model => model.id == id)[0];
          },
          reload: function(path, callback) {
            new THREE.GLTFLoader().load(path, function(model) {
              callback(model);
            });
          }
        },
        images: {
          preload: function(src) {
            (new Image()).src = src;
          }
        },
        weapons: {
          animations: {
            start: function(animation, options = {}, onfinish = null) {
              const weapon = utils.weapons.getCurrentEntry();
              const action = weapon.model.animations[weapon.animationStructure[animation][0]]
              const clip = weapon.model.animationMixer.clipAction(action);
              clip.timeScale = options.timeScale || weapon.animationStructure[animation][1];
              clip.weight = weapon.animationStructure[animation][2];

              if (animation == "idle") clip.loop = THREE.LoopRepeat;
              if (animation == "walk") {
                clip.loop = THREE.LoopRepeat;
                clip.reset();
                if (!options.instant) clip.fadeIn(0.3);
              }

              if (options.loop) clip.loop = options.loop;
              if (options.reset) clip.reset();
              clip.play();

              if (typeof onfinish == "function") {
                let finished = false;
                let customCallback = function(event) {
                  if (typeof event == "undefined" || event.action === clip) {
                    if (finished) return;
                    finished = true;
                    onfinish();
                    weapon.model.animationMixer.removeEventListener("finished", customCallback);
                  }
                };
                weapon.model.animationMixer.addEventListener("finished", customCallback);
                if (options.returnAnimationLength) return { _function: customCallback, animationLength: action.duration / clip.timeScale };
                return customCallback;
              } else {
                if (options.returnAnimationLength) return action.duration / clip.timeScale;
              }
            },
            stop: function(animation, options = {}) {
              const weapon = utils.weapons.getCurrentEntry();
              const clip = weapon.model.animationMixer.clipAction(weapon.model.animations[weapon.animationStructure[animation][0]]);
              if (animation == "walk") {
                clip.fadeOut(0.3);
              } else {
                clip.stop();
              }
              if (options.reset) clip.reset();
            },
            cancelCallback: function(callbackFunction) {
              const weapon = utils.weapons.getCurrentEntry();
              weapon.model.animationMixer.removeEventListener("finished", callbackFunction);
            },
            restart: function(animation) {
              utils.weapons.animations.stop(animation);
              utils.weapons.animations.start(animation);
            },
          },
          position: function(worldPosition, worldRotation) {
            function position() {
              if (sandbox.currentWeapon) {
                if (utils.vehicles.check(true)) {
                  sandbox.currentWeapon.position.copy(worldPosition);
                  sandbox.currentWeapon.rotation.copy(worldRotation);
                } else {
                  sandbox.currentWeapon.position.copy(camera.position);
                  sandbox.currentWeapon.rotation.copy(camera.rotation);
                }
                sandbox.currentWeapon.rotateY(Math.PI);
                sandbox.currentWeapon.rotateX(-0.05);
                sandbox.currentWeapon.translateX(-0.02);
                sandbox.currentWeapon.translateY(-0.068);
                sandbox.currentWeapon.translateZ(0.032);
              }
            }
            const cameraShake = utils.options.get("CameraShake");
            if (cameraShake) {
              const randomX = (Math.random() / 200) * cameraShake;
              const randomY = (Math.random() / 200) * cameraShake;
              const randomZ = (Math.random() / 200) * cameraShake;
              camera.position.x += randomX * 9.9;
              camera.position.y += randomY * 9.9;
              camera.position.z += randomZ * 9.9;
              position();
              camera.position.x += randomX;
              camera.position.y += randomY;
              camera.position.z += randomZ;
            } else {
              position();
            }
          },
          setCurrent: function(model) {
            sandbox.currentWeapon = model;
          },
          setPrimary: function(model) {
            sandbox.primaryWeapon = model;
          },
          setSecondary: function(model) {
            sandbox.secondaryWeapon = model;
          },
          getCurrentEntry: function() {
            if (sandbox.currentWeapon == sandbox.primaryWeapon) {
              return sandbox.weapons[sandbox.loadout[0]];
            } else {
              return sandbox.weapons[sandbox.loadout[1]];
            }
          },
          getPrimaryEntry: function() {
            return sandbox.weapons[sandbox.loadout[0]];
          },
          getSecondaryEntry: function() {
            return sandbox.weapons[sandbox.loadout[1]];
          },
          getChild: function() {
            if (sandbox.currentWeapon) {
              return sandbox.currentWeapon.children[0];
            }
          },
          switch: function(slot = null, instant = false) {
            if (utils.vehicles.check()) return;
            utils.options.set("Switching", true);
            utils.weapons.stopFire();
            utils.weapons.stopZoom();
            utils.weapons.stopReload();
            utils.weapons.stopMelee();
            utils.weapons.stopSprint(false);
            if (!slot) {
              if (sandbox.currentWeapon == sandbox.secondaryWeapon) {
                slot = "primary";
              } else {
                slot = "secondary";
              }
            }
            if (utils.options.get("Walking")) utils.weapons.animations.stop("walk");
            function next() {
              utils.weapons.animations.stop("idle");
              scene.remove(sandbox.currentWeapon);
              if (slot == "primary") {
                utils.weapons.setCurrent(sandbox.primaryWeapon);
                utils.ui.setPrimaryDisplay(utils.weapons.getPrimaryEntry().name);
                utils.ui.setSecondaryDisplay(utils.weapons.getSecondaryEntry().name);
              } else if (slot == "secondary") {
                utils.weapons.setCurrent(sandbox.secondaryWeapon);
                utils.ui.setPrimaryDisplay(utils.weapons.getSecondaryEntry().name);
                utils.ui.setSecondaryDisplay(utils.weapons.getPrimaryEntry().name);
              }
              utils.ui.weaponSwitch();
              utils.weapons.animations.start("idle");
              scene.add(sandbox.currentWeapon);
              if (instant) {
                utils.options.set("Switching", false);
              } else {
                utils.weapons.getChild().position.set(0, -0.03, 0);
                utils.weapons.getChild().rotation.set(0.5, 0, 0);
                new TWEEN.Tween(utils.weapons.getChild().position).to({ x: 0, y: 0, z: 0 }, 200).easing(TWEEN.Easing.Quadratic.InOut).start();
                new TWEEN.Tween(utils.weapons.getChild().rotation).to({ x: 0, y: 0, z: 0 }, 200).easing(TWEEN.Easing.Quadratic.InOut).start().onComplete(function() {
                  utils.options.set("Switching", false);
                });
              }
              if (utils.options.get("Walking")) {
                utils.weapons.animations.start("walk");
              }
              utils.weapons.update();
              gametime.run("switchWeapon", [gametime.player.uuid, utils.weapons.getCurrentEntry().name]);
            }
            if (instant) {
              next();
            } else {
              new TWEEN.Tween(utils.weapons.getChild().position).to({ x: 0, y: -0.03, z: 0 }, 100).easing(TWEEN.Easing.Quadratic.InOut).start();
              new TWEEN.Tween(utils.weapons.getChild().rotation).to({ x: 0.5, y: 0, z: 0 }, 100).easing(TWEEN.Easing.Quadratic.InOut).start().onComplete(function() {
                utils.weapons.getChild().position.set(0, 0, 0);
                utils.weapons.getChild().rotation.set(0, 0, 0);
                next();
              });
            }
          },
          fire: function(rounds = 1) {
            if (utils.vehicles.check()) return utils.vehicles.check().horn = true;
            const weapon = utils.weapons.getCurrentEntry();
            if (utils.options.get("Firing") || utils.options.get("Reloading") || utils.options.get("Switching") || utils.options.get("ThrowingGrenade") || utils.options.get("Melee") || weapon.currentAmmo <= 0) return;
            const zoomed = utils.options.get("Zoomed");
            const time = Date.now();
            if (time - weapon.lastShot < weapon.delayBetweenShots) return;
            utils.options.set("Firing", true);
            utils.options.set("ContinueFiring", true);
            utils.weapons.stopSprint();
            utils.weapons.animations.stop("walk");
            utils.weapons.animations.stop("idle");
            if (weapon.fireMode == "auto") {
              rounds = 200;
            } else if (weapon.fireMode == "burst") {
              rounds = 3;
            }
            let lastFire = time - weapon.fireRate;
            let spreads = Array(rounds * 2).fill(0).map(x => { const spread = Math.random() / (zoomed ? 90 : 60) * weapon.spread; return Math.floor(Math.random() * 2) == 0 ? -spread : spread });
            let roundsFired = 0;
            function animation() {
              if (roundsFired < rounds && weapon.currentAmmo > 0 && utils.options.get("ContinueFiring")) {
                const time = Date.now();
                if (time - lastFire >= weapon.fireRate) {
                  lastFire = time;
                  if (weapon.delayBetweenShots) weapon.lastShot = time;
                  utils.weapons.animations.start("shoot", { loop: THREE.LoopOnce, reset: true });
                  audio.fire(weapon, roundsFired);

                  const spreadX = spreads[roundsFired];
                  const spreadY = spreads[roundsFired + 1];
                  utils.effects.bulletHole(spreadX, spreadY, weapon.bulletHole, camera, weapon);
                  if (weapon.muzzleFlash) {
                    if (!weapon.scope || !zoomed) {
                      utils.effects.muzzleFlash();
                    }
                  }
                  utils.effects.bob(1, weapon.recoil);
                  utils.effects.shake(weapon.recoil / (zoomed ? 4 : 2), 100, 50 * weapon.recoil);

                  roundsFired++;
                  weapon.currentAmmo--;
                  utils.weapons.update();
                  gametime.run("fireWeapon", [gametime.player.uuid, [camera.position.x, camera.position.y, camera.position.z, camera.rotation.x, camera.rotation.y, camera.rotation.z], spreadX, spreadY, weapon.bulletHole]);
                }
                requestAnimationFrame(animation);
              } else {
                if (!utils.options.get("Reloading")) {
                  if (utils.options.get("Walking")) {
                    utils.weapons.animations.start("walk", { instant: true });
                  } else {
                    utils.weapons.animations.start("idle");
                  }
                }
                spreads = undefined;
                utils.options.set("Firing", false);
              }
            }
            animation();
          },
          stopFire: function() {
            if (utils.vehicles.check()) return utils.vehicles.check().horn = false;
            const weapon = utils.weapons.getCurrentEntry();
            if (utils.options.get("Firing") && weapon.fireMode == "auto") {
              utils.options.set("ContinueFiring", false);
            }
          },
          zoom: function(force = false) {
            if (utils.vehicles.check()) return;
            if ((utils.options.get("Reloading") || utils.options.get("Switching")) && !force) return;
            const weapon = utils.weapons.getCurrentEntry();
            if (utils.options.get("Zoomed")) {
              if (utils.options.get("globalZoomTween")) {
                utils.options.get("globalZoomTween").in.position.stop();
                utils.options.get("globalZoomTween").in.rotation.stop();
                utils.options.get("globalZoomTween").in.fov.stop();
              }
              utils.options.set("globalZoomTween", {
                out: {
                  position: new TWEEN.Tween(weapon.model.scene.children[0].position).to({ x: 0, y: 0, z: 0 }, weapon.zoomDuration).easing(TWEEN.Easing.Quadratic.InOut).start(),
                  rotation: new TWEEN.Tween(weapon.model.scene.children[0].rotation).to({ x: 0, y: 0, z: 0 }, weapon.zoomDuration).easing(TWEEN.Easing.Quadratic.InOut).start(),
                  fov: new TWEEN.Tween(camera).to({ fov: 45 }, weapon.zoomDuration).easing(TWEEN.Easing.Quadratic.InOut).onUpdate(() => { camera.updateProjectionMatrix() }).start(),
                }
              });
              weapon.animationStructure["walk"][2] *= 5;
              weapon.animationStructure["idle"][2] *= 5;
              weapon.animationStructure["shoot"][2] *= 5;
              PointerControls.pointerSpeed *= 2;
              utils.ui.setVignette(0);
              if (weapon.scope) {
                sandbox.currentWeapon.getObjectByName("Lens").material.color.setHex(weapon.scopeColor[1]);
                camera.remove(utils.options.get("scopeCompass"));
              } else {
                utils.ui.showCrosshair();
              }
              utils.options.set("Zoomed", false);
            } else {
              utils.weapons.stopMelee();
              utils.weapons.stopSprint(false, true);
              if (utils.options.get("globalZoomTween")) {
                utils.options.get("globalZoomTween").out.position.stop();
                utils.options.get("globalZoomTween").out.rotation.stop();
                utils.options.get("globalZoomTween").out.fov.stop();
              }
              utils.options.set("globalZoomTween", {
                in: {
                  position: new TWEEN.Tween(weapon.model.scene.children[0].position).to({ x: weapon.zoomPosition[0], y: weapon.zoomPosition[1], z: weapon.zoomPosition[2] }, weapon.zoomDuration).easing(TWEEN.Easing.Quadratic.InOut).start(),
                  rotation: new TWEEN.Tween(weapon.model.scene.children[0].rotation).to({ x: weapon.zoomPosition[3], y: weapon.zoomPosition[4], z: weapon.zoomPosition[5] }, weapon.zoomDuration).easing(TWEEN.Easing.Quadratic.InOut).start(),
                  fov: new TWEEN.Tween(camera).to({ fov: weapon.zoomFov }, weapon.zoomDuration).easing(TWEEN.Easing.Quadratic.InOut).onUpdate(() => { camera.updateProjectionMatrix() }).start(),
                }
              });
              weapon.animationStructure["walk"][2] /= 5;
              weapon.animationStructure["idle"][2] /= 5;
              weapon.animationStructure["shoot"][2] /= 5;
              PointerControls.pointerSpeed /= 2;

                sandbox.currentWeapon.getObjectByName("Lens").material.color.setHex(weapon.scopeColor[0]);
                camera.add(utils.options.get("scopeCompass"));

                utils.ui.hideCrosshair();
              }
              utils.options.set("Zoomed", true);
            }
            if (utils.options.get("Walking")) {

          stopZoom: function() {

          },
          reload: function(full = false) {
            if (utils.vehicles.check()) return;
            const weapon = utils.weapons.getCurrentEntry();
            if (utils.options.get("Reloading") || weapon.ammo <= 0 || weapon.currentAmmo >= weapon.maxAmmo) return;
            utils.options.set("Reloading", true);
            utils.weapons.stopZoom();
            utils.weapons.stopMelee();
            utils.weapons.stopSprint(false);
            utils.weapons.animations.stop("idle");
            utils.weapons.animations.stop("walk");
            let animation = null;
            if (full) {
              animation = "reload_full";
              audio.reload(weapon, "full");
            } else {
              animation = "reload";
              audio.reload(weapon, "normal");
            }
            const callback = utils.weapons.animations.start(animation, { loop: THREE.LoopOnce, reset: true, returnAnimationLength: true }, function() {
              const weapon = utils.weapons.getCurrentEntry();
              const ammo = weapon.ammo;
              weapon.ammo = Math.max(weapon.ammo - (weapon.maxAmmo - weapon.currentAmmo), 0);
              weapon.currentAmmo = Math.min(weapon.currentAmmo + Math.min(weapon.maxAmmo, ammo), weapon.maxAmmo);
              utils.options.set("Reloading", false);
              if (utils.options.get("Walking")) {
                utils.weapons.animations.start("walk", { instant: true });
              } else {
                utils.weapons.animations.start("idle");
              }
            });
            utils.options.set("ReloadCallback", {
              startTime: Date.now(),
              totalTime: callback.animationLength * 1000,
              _function: callback._function
            });
            gametime.run("reloadWeapon", [gametime.player.uuid]);
          },
          stopReload: function() {
            if (utils.options.get("Reloading")) {
              const reloadCallback = utils.options.get("ReloadCallback");
              if (Date.now() - reloadCallback.startTime > reloadCallback.totalTime - 800) reloadCallback._function();
              utils.weapons.animations.cancelCallback(reloadCallback._function);
              utils.weapons.animations.stop("reload");
              utils.weapons.animations.stop("reload_full");
              audio.stopReload(utils.weapons.getCurrentEntry());
              utils.options.set("Reloading", false);
            }
          },
          melee: function() {
            if (utils.vehicles.check()) return;

            utils.options.set("CancelMelee", false);
            utils.weapons.stopFire();
            utils.weapons.stopZoom();
            utils.weapons.stopReload();
            utils.weapons.stopSprint(false);
            utils.effects.bob();
            function reset() {
              utils.options.set("CancelMelee", false);
              utils.options.set("Melee", false);
            }
            for (player in utils.players.objects) {
              const playerObject = utils.players.objects[player];
              if (playerObject) {
                const playerPosition = playerObject.scene.position.clone();
                playerPosition.y += 0.8;
                const distance = camera.position.distanceTo(playerPosition);
                if (distance < 2.5 && utils.options.get("Aiming")) {
                  const lungeDistance = Math.max(distance - 0.7, 0);
                  const initialPosition = camera.position.clone();
                  camera.lookAt(playerPosition);
                  function animation() {
                    playerVelocity.add(utils.physics.getCameraForwardVector().multiplyScalar(10));
                    const currentDistance = camera.position.distanceTo(initialPosition);
                    if (currentDistance >= lungeDistance - 0.2) {
                      playerVelocity.set(0, 0, 0);
                      utils.players.hit(playerObject, null, "melee");
                      return;
                    }
                    requestAnimationFrame(animation);
                  }
                  animation();
                }
              }
            }
            utils.options.set("globalMeleeTween", new TWEEN.Tween(utils.weapons.getChild().rotation).to({ x: -0.8, y: 0.1, z: -0.2 }, 100).easing(TWEEN.Easing.Quadratic.InOut).start().onComplete(function() {
              if (utils.options.get("CancelMelee")) return reset();
              if (playerAgainstWall) {
                utils.effects.bulletHole(0, 0, 20, camera, null, true);
              }
              utils.options.set("globalMeleeTween", new TWEEN.Tween(utils.weapons.getChild().rotation).to({ x: 0.5, y: 0.1, z: -0.2 }, 200).easing(TWEEN.Easing.Quadratic.Out).start().onComplete(function() {
                if (utils.options.get("CancelMelee")) return reset();
                utils.options.set("globalMeleeTween", new TWEEN.Tween(utils.weapons.getChild().rotation).to({ x: 0, y: 0, z: 0 }, 300).easing(TWEEN.Easing.Quadratic.Out).start().onComplete(function() {
                  utils.options.set("Melee", false);
                  utils.weapons.update();
                }));

            }));
          },
          stopMelee: function() {

              utils.options.set("CancelMelee", true);
              utils.options.set("Melee", false);
              utils.options.get("globalMeleeTween").stop();
              utils.weapons.getChild().rotation.set(0, 0, 0);
            }

          sprint: function() {

            utils.weapons.stopFire();

            utils.weapons.stopMelee();

            utils.options.set("globalSprintTween", {

                rotation: new TWEEN.Tween(utils.weapons.getChild().rotation).to({ x: 0.2, y: 0.3, z: -0.3 }, 400).easing(TWEEN.Easing.Quadratic.Out).start()
              }

          stopSprint: function(animation = true, force = false) {
            if (!utils.options.get("Sprinting") && !force) return;

                utils.options.get("globalSprintTween").in.position.stop();
                utils.options.get("globalSprintTween").in.rotation.stop();
              }
              if (utils.options.get("globalSprintTween").out) {
                utils.options.get("globalSprintTween").out.position.stop();
                utils.options.get("globalSprintTween").out.rotation.stop();
              }
            }
            if (animation) {
              utils.options.set("globalSprintTween", {
                out: {
                  position: new TWEEN.Tween(utils.weapons.getChild().position).to({ x: 0, y: 0, z: 0 }, 500).easing(TWEEN.Easing.Quadratic.Out).start(),
                  rotation: new TWEEN.Tween(utils.weapons.getChild().rotation).to({ x: 0, y: 0, z: 0 }, 500).easing(TWEEN.Easing.Quadratic.Out).start()
                }
              });
            } else {
              utils.weapons.getChild().position.set(0, 0, 0);
              utils.weapons.getChild().rotation.set(0, 0, 0);

          crouch: function() {

              next();

          startWalking: function() {

            if (!utils.options.get("Firing") && !utils.options.get("Reloading")) {
              utils.weapons.animations.stop("idle");
              utils.weapons.animations.start("walk");
            }
            gametime.run("startWalking", [gametime.player.uuid]);
          },
          stopWalking: function(updateMultiplayer = true) {
            if (utils.vehicles.check(true)) return;
            utils.options.set("Walking", false);

              utils.weapons.animations.stop("walk");

          jump: function() {

            gametime.run("jump", [gametime.player.uuid]);
          },
          updateAim: function(weapon) {
            const raycaster = utils.options.get("aimRaycaster");
            raycaster.setFromCamera(vectors[4], camera);
            const intersects = raycaster.intersectObjects(utils.players.shields);
            if (intersects.length > 0) {
              const intersect = intersects[0];
              if (camera.position.distanceTo(intersect.point) < weapon.range) {
                if (sandbox.presets.options.teamGame) {
                  const player = utils.players.objects[intersect.object.playerUUID];
                  if (player.team == gametime.player.data.team) {
                    utils.ui.aimCrosshair("green");
                  } else {
                    utils.ui.aimCrosshair();
                  }
                  utils.options.set("Aiming", true);
                } else {
                  utils.ui.aimCrosshair();
                  utils.options.set("Aiming", true);
                }
              } else {
                utils.ui.unaimCrosshair();
                utils.options.set("Aiming", false);
              }
            } else {
              utils.ui.unaimCrosshair();
              utils.options.set("Aiming", false);

          update: function() {
            const weapon = utils.weapons.getCurrentEntry();
