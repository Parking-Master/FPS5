<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS5 multiplayer shooter</title>
    <style>
      @keyframes health-flash {
        0% {
          box-shadow: inset 0 0 20px rgba(220, 30, 20, 0.7);
        }
        60% {
          box-shadow: inset 0 0 20px rgba(250, 50, 40, 0.2);
        }
        100% {
          box-shadow: inset 0 0 20px rgba(220, 30, 20, 0.7);
        }
      }
      html, body {
        margin: 0;
        overflow: hidden !important;
        user-select: none !important;
      }
      body {
        margin: 0;
        position: fixed;
        inset: 0;
        display: flex;
      }
      .vignette {
        position: relative;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        margin: 0;
        padding: 0;
        pointer-events: none !important;
        transition: opacity .15s;
      }
      .crosshair {
        position: absolute;
        width: 20px;
        height: 20px;
        left: 50%;
        top: 50%;
        margin-left: -10px;
        margin-top: -10px;
      }
      .ui {
        position: fixed;
        width: 100%;
        height: 100%;
        pointer-events: none !important;
        z-index: 2147483645;
      }
      canvas {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .ui-section.top-section {
        position: absolute;
        width: 300px;
        top: 20px;
        left: 50%;
        margin-left: -150px;
        transform: perspective(600px) rotateX(-15deg);
      }
      .ui-section.top-section .ui-health-bar {
        position: relative;
        width: 100%;
        height: 15px;
        margin: 0;
        border: 2px solid rgba(100, 200, 255, 0.4);
        filter: drop-shadow(1px 1px 0px #fff);
        box-shadow: inset 0 0 20px rgba(200, 200, 255, 0.3);
        border-radius: 4px;
        transition: box-shadow .2s;
      }
      .ui-section.top-section .ui-health-value {
        position: relative;
        width: 100%;
        height: 100%;
        background: rgba(100, 100, 150, 0.2);
      }
      .ui-section.top-section .ui-health-bar.value-low {
        box-shadow: inset 0 0 20px rgba(255, 183, 120, 0.7);
      }
      .ui-section.top-section .ui-health-bar.value-danger {
        animation: health-flash .5s infinite;
      }
      .ui-section.bottom-right-section {
        position: absolute;
        width: 120px;
        bottom: 40px;
        right: 60px;
        transform: perspective(600px) rotateY(-20deg) rotatez(2deg);
        font-family: Arial;
        filter: drop-shadow(1px 1px 0px #fff);
        text-shadow: 2px 2px 20px rgb(50, 50, 50);
      }
      .ui-section.bottom-right-section .ui-weapon {
        position: relative;
        padding: 6px;
        border-top: 2px solid rgba(100, 200, 255, 0.2);
        border-bottom: 2px solid rgba(100, 200, 255, 0.2);
        color: rgba(150, 160, 255, 0.7);
        letter-spacing: 2px;
      }
      .ui-section.bottom-right-section .ui-weapon .current-value {
        font-size: 24px;
      }
      .ui-section.bottom-right-section .ui-weapon .remaining-value {
        color: rgba(170, 170, 200, 0.7);
        font-size: 16px;
      }
      .ui-section.bottom-right-section .ui-weapon .remaining-value {
        color: rgba(170, 170, 200, 0.7);
        font-size: 16px;
      }
      .ui-section.bottom-right-section .ui-slot {
        position: relative;
        display: inline-block;
        color: rgba(180, 180, 255, 0.8);
        padding: 10px;
        line-height: 0.5;
        box-shadow: inset 15px 0px 10px 1px rgba(150, 170, 255, 0.25);
        border-right: 2px solid rgba(100, 200, 255, 0.2);
      }
      .ui-section.bottom-right-section .ui-slot .icon {
        width: 16px;
        vertical-align: middle;
        opacity: 0.8;
      }
      .ui-section.bottom-right-section .ui-ability {
        opacity: 0.3;
      }
      .ui-radar {
        position: absolute;
        bottom: 40px;
        left: 60px;
        width: 150px;
        height: 150px;
        border-radius: 100%;
        background: rgba(100, 100, 150, 0.2);
        box-shadow: inset 0 0 50px rgba(210, 200, 200, 0.4);
        transform: perspective(500px) rotateY(10deg) rotateX(10deg);
      }
    </style>
  </head>
  <body>
    <script src="/js/three.js"></script>
    <script src="/js/GLTFLoader.js"></script>

    <div class="ui" id="game-ui">
      <img class="vignette" src="/images/vignette.png">
      <img class="crosshair" src="/images/crosshairs/0.png">
      <div class="ui-section top-section">

    <script>
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, 1440 / 900, 0.01, 1000);
      const clock = new THREE.Clock();
      const worldOctree = new THREE.Octree();
      const directionalLight = new THREE.DirectionalLight(0xfcc394, 0.8);
      const hemisphereLight = new THREE.AmbientLight(0xfcc394, 0.35);

      // For the radar
let radarCanvas = document.querySelector(".ui-radar canvas");
let ctx = radarCanvas.getContext("2d");
let radarRadiusPx = 75;
let radarRange = 18;

const worldUp = new THREE.Vector3(0, 1, 0);
const forward = new THREE.Vector3();
const forwardH = new THREE.Vector3();
const right = new THREE.Vector3();
const tmpVec3 = new THREE.Vector3();
function updatePlayerBasis() {
  camera.getWorldDirection(forward);
  forward.negate();
  forwardH.copy(forward).addScaledVector(worldUp, -forward.dot(worldUp)).normalize();
  right.crossVectors(worldUp, forwardH).normalize();
}
function computeRadarBlipForEnemy(enemy) {
  const playerPos = tmpVec3.setFromMatrixPosition(camera.matrixWorld);
  const enemyPos = new THREE.Vector3().setFromMatrixPosition(enemy.matrixWorld);
  const V = enemyPos.sub(playerPos);
  const dotVy = V.dot(worldUp);
  const Vh = V.addScaledVector(worldUp, -dotVy);
  if (Vh.lengthSq() === 0) return null;
  const xLocal = Vh.dot(right);
  const yLocal = -Vh.dot(forwardH);
  const d = Math.sqrt(xLocal * xLocal + yLocal * yLocal);
  if (d === 0) return { x: radarRadiusPx, y: radarRadiusPx };
  const dClamped = Math.min(d, radarRange);
  const scale = dClamped / radarRange;
  const nx = xLocal / d;
  const ny = yLocal / d;
  const xOffset = nx * scale * radarRadiusPx;
  const yOffset = ny * scale * radarRadiusPx;
  const screenX = radarRadiusPx + xOffset;
  const screenY = radarRadiusPx - yOffset;
  return { x: screenX, y: screenY };
}
function renderRadar(enemies) {
  updatePlayerBasis();
  ctx.clearRect(0, 0, radarCanvas.width, radarCanvas.height);
  ctx.beginPath();
  ctx.fillStyle = "rgba(180, 180, 255, 0.7)";
  ctx.arc(radarRadiusPx, radarRadiusPx, 5, 0, 2 * Math.PI);
  ctx.fill();
  ctx.fillStyle = 'rgba(230, 20, 20, 0.5)';
  for (const enemy of enemies) {
    if (camera.position.distanceTo(enemy.position) > radarRange + 3) continue;
    const blip = computeRadarBlipForEnemy(enemy);
    if (!blip) continue;
    ctx.beginPath();
    ctx.arc(blip.x, blip.y, 5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}
// e=new THREE.Mesh(new THREE.BoxGeometry(1,1,1));e.position.y=1;scene.add(e);
// setInterval(()=>renderRadar([e]),200);

      let keyStates = {};
      let playerOnFloor = false;

      let vector3 = new THREE.Vector3();
      let playerDefaultPosition = {
        x: 13.5,
        y: .35,
        z: -18.5
      };

      let STEPS_PER_FRAME = 4;
      let GRAVITY = 10;
      const grenades = [];

      const playerCollider = new THREE.Capsule(new THREE.Vector3(0, .35, 0), new THREE.Vector3(0, 1, 0), .35);
      const playerVelocity = vector3.clone();
      const playerDirection = vector3.clone();

      renderer.setClearAlpha();
      renderer.setClearColor(0x000000, 0);
      renderer.shadowMap.autoUpdate = false;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.VSMShadowMap;
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ReinhardToneMapping;

      camera.rotation.order = "YXZ";
      playerCollider.start.set(playerDefaultPosition.x, playerDefaultPosition.y, playerDefaultPosition.z);
      playerCollider.end.set(playerDefaultPosition.x, playerDefaultPosition.y + .65, playerDefaultPosition.z);
      directionalLight.position.set(20, 25, -10);
      directionalLight.castShadow = true;
      directionalLight.shadow.camera.near = .01;
      directionalLight.shadow.camera.far = 500;
      directionalLight.shadow.camera.right = 30;
      directionalLight.shadow.camera.left = -30;
      directionalLight.shadow.camera.top = 30;
      directionalLight.shadow.camera.bottom = -30;
      directionalLight.shadow.mapSize.width = 1024;
      directionalLight.shadow.mapSize.height = 1024;
      directionalLight.shadow.radius = 4;
      directionalLight.shadow.bias = -0.00006;
      hemisphereLight.position.set(2, 1, 1);
      document.body.appendChild(renderer.domElement);

      scene.add(hemisphereLight);
      scene.add(directionalLight);

      renderer.shadowMap.needsUpdate = true;

      THREE.activateBloom(0.6);

      let frameCount = 0;
      let lastTime = performance.now();
      let fps = 0;
      function animate(now) {
        const clockDelta = clock.getDelta();
        const deltaTime = Math.min(0.05, clockDelta) / STEPS_PER_FRAME;

        teleportPlayerIfOob();

        TWEEN.update();
        THREE.particles.update();

        for (let i = 0; i < STEPS_PER_FRAME; i++) {
          controls(deltaTime);
          updatePlayer(deltaTime);
          updateGrenades(deltaTime);
        }

        utils.weapons.position();

        for (let i = 0; i < sandbox.models.length; i++) {
          if (sandbox.models[i].loaded) {
            if (sandbox.models[i].model.animationMixer) {
              sandbox.models[i].model.animationMixer.update(clockDelta);
            }
          }
        }

        frameCount++;
        const diff = now - lastTime;
        if (diff >= 1000) {
          fps = (frameCount * 1000) / diff;
          frameCount = 0;
          lastTime = now;
          console.log('FPS:', fps.toFixed(1));
        }

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      let map = null;

      function update() {
        renderer.shadowMap.needsUpdate = true;
      }
      function getForwardVector() {
        camera.getWorldDirection(playerDirection);
        playerDirection.y = 0;
        playerDirection.normalize();
        return playerDirection;
      }
      function getSideVector() {
        camera.getWorldDirection(playerDirection);
        playerDirection.y = 0;
        playerDirection.normalize();
        playerDirection.cross(camera.up);
        return playerDirection;
      }
      function controls(deltaTime) {
        const speedDelta = deltaTime;
        const walkSpeed = deltaTime * (playerOnFloor ? 22 : 1);
        if (keyStates["KeyW"] || keyStates["ArrowUp"]) {
          playerVelocity.add(getForwardVector().multiplyScalar(walkSpeed));
        }
        if (keyStates["KeyS"] || keyStates["ArrowDown"]) {
          playerVelocity.add(getForwardVector().multiplyScalar(-walkSpeed));
        }
        if (keyStates["KeyA"] || keyStates["ArrowLeft"]) {
          playerVelocity.add(getSideVector().multiplyScalar(-walkSpeed));
        }
        if (keyStates["KeyD"] || keyStates["ArrowRight"]) {
          playerVelocity.add(getSideVector().multiplyScalar(walkSpeed));
        }
        if (playerOnFloor && keyStates["Space"]) {
          playerVelocity.y = 4;
        }
      }
      function playerCollisions() {
        const result = worldOctree.capsuleIntersect(playerCollider);
        playerOnFloor = false;
        if (result) {
          playerOnFloor = result.normal.y > 0;
          if (!playerOnFloor) {
            playerVelocity.addScaledVector(result.normal, - result.normal.dot(playerVelocity));
          }
          playerCollider.translate(result.normal.multiplyScalar(result.depth));
        }
      }
      function updatePlayer(deltaTime) {
        let damping = (Math.exp(-4 * deltaTime) - 1) * 2;
        if (!playerOnFloor) {
          playerVelocity.y -= GRAVITY * (deltaTime);
          damping *= 0.1;
        }
        playerVelocity.addScaledVector(playerVelocity, damping);
        const deltaPosition = playerVelocity.clone().multiplyScalar(deltaTime);
        playerCollider.translate(deltaPosition);
        playerCollisions();
        camera.position.copy(playerCollider.end);
      }
      function updateGrenades(deltaTime) {
        for (let i = 0; i < grenades.length; i++) {
          let grenade = grenades[i];

          grenade.mesh.rotation.x += grenade.angularVelocity.x * deltaTime;
          grenade.mesh.rotation.y += grenade.angularVelocity.y * deltaTime;
          grenade.mesh.rotation.z += grenade.angularVelocity.z * deltaTime;

          grenade.collider.center.addScaledVector(grenade.velocity, deltaTime);
          const result = worldOctree.sphereIntersect(grenade.collider);
          if (result) {
            grenade.hits++;
            grenade.velocity.addScaledVector(result.normal, -result.normal.dot(grenade.velocity) * 1.5);

            const rotationAxis = new THREE.Vector3().crossVectors(result.normal, grenade.velocity).normalize();
            const rotationSpeed = grenade.velocity.length() * 0.5;
            grenade.angularVelocity.addScaledVector(rotationAxis, rotationSpeed);

            grenade.collider.center.add(result.normal.multiplyScalar(result.depth));
          } else {
            grenade.velocity.y -= (GRAVITY * deltaTime + .01);
          }
          const damping = Math.exp(deltaTime * -1.5) - 1.003;
          grenade.velocity.addScaledVector(grenade.velocity, damping);
          grenade.angularVelocity.addScaledVector(grenade.angularVelocity, damping);
        }
        grenadeCollisions();
        for (let grenade of grenades) {
          grenade.mesh.position.copy(grenade.collider.center);
        }
      }
      function grenadeCollisions() {
        for (let i = 0, length = grenades.length; i < length; i++) {
          const s1 = grenades[i];
          for (let j = i + 1; j < length; j++) {
            const s2 = grenades[j];
            const d2 = s1.collider.center.distanceToSquared(s2.collider.center);
            const r = s1.collider.radius + s2.collider.radius;
            const r2 = r * r;
            if (d2 < r2) {
              const normal = _vector1.subVectors(s1.collider.center, s2.collider.center).normalize();
              const v1 = _vector2.copy(normal).multiplyScalar(normal.dot(s1.velocity));
              const v2 = _vector3.copy(normal).multiplyScalar(normal.dot(s2.velocity));
              s1.velocity.add(v2).sub(v1);
              s2.velocity.add(v1).sub(v2);
              const d = (r - Math.sqrt(d2)) / 2;
              s1.collider.center.addScaledVector(normal, d);
              s2.collider.center.addScaledVector(normal, - d);
            }
          }
        }
      }
      function teleportPlayerIfOob() {
        if (camera.position.y <= -25) {
          playerCollider.start.set(13.5, 0.35, -18.5);
          playerCollider.end.set(13.5, 1, -18.5);
          playerCollider.radius = 0.35;
          camera.position.copy(playerCollider.end);
          camera.rotation.set(0, Math.PI, 0);
        }
      }

      sandbox = {
        loadout: ["AK-74", "AK-74"],
        currentWeapon: null,
        primaryWeapon: null,
        secondaryWeapon: null,
        models: [
          {
            id: "weapon.AK-74",
            path: "/models/weapons/AK-74.glb",
            model: null,
            loaded: false
          }
        ],
        weapons: {
          // animationStructure: [animationIndex, animationTimeScale, animationWeight]
          "AK-74": {
            name: "AK-74",
            displayName: "AK-74 Assault Rifle",
            ammo: 36,
            damage: 4,
            spread: 1,
            muzzleFlash: true,
            zoomPosition: [.0395, 0.0132, -.05, .045, -.025, 0.12],
            zoomFov: 35,
            zoomDuration: 300,
            reticle: 0,
            model: null,
            loaded: false,
            requiredMaps: ["Cargo_Port"],
            animationStructure: {
              draw: [0, 1, 1],
              idle: [1, 1, 1],
              reload: [2, 1, 1],
              reload_full: [3, 1, 1],
              run: [5, 1, 1],
              shoot: [6, 1, 1],
              walk: [7, 1, 1]
            }
          }
        }
      };
      utils = {
        options: {
          store: {},
          set: function(key, value) {
            utils.options.store[key] = value;
          },
          get: function(key) {
            if (typeof utils.options.store[key] == "undefined") {
              return null;
            }
            return utils.options.store[key];
          }
        },
        weapons: {
          animations: {
            start: function(animation, options = {}) {
              let weapon = utils.weapons.getCurrentEntry();
              let clip = weapon.model.animationMixer.clipAction(weapon.model.animations[weapon.animationStructure[animation][0]]);
              clip.timeScale = options.timeScale || weapon.animationStructure[animation][1];
              clip.weight = weapon.animationStructure[animation][2];
              if (animation == "idle") clip.loop = THREE.LoopRepeat;
              if (animation == "walk") {
                clip.loop = THREE.LoopRepeat;
                clip.reset();
                if (!options.instant) clip.fadeIn(0.3);
              }
              if (options.loop) clip.loop = options.loop;
              if (options.reset) clip.reset();
              clip.play();
            },
            stop: function(animation, options = {}) {
              let weapon = utils.weapons.getCurrentEntry();
              let clip = weapon.model.animationMixer.clipAction(weapon.model.animations[weapon.animationStructure[animation][0]]);
              if (animation == "walk") {
                clip.fadeOut(0.3);
              } else {
                clip.stop();
              }
              if (options.reset) clip.reset();
            },
          },
          position: function(zoom = false, zoomTarget) {
            if (sandbox.currentWeapon) {
              sandbox.currentWeapon.position.copy(camera.position);
              sandbox.currentWeapon.rotation.copy(camera.rotation);
              sandbox.currentWeapon.rotateY(Math.PI);
              sandbox.currentWeapon.rotateX(-0.05);
              sandbox.currentWeapon.translateX(-0.02);
              sandbox.currentWeapon.translateY(-0.068);
              sandbox.currentWeapon.translateZ(0.032);
            }
          },
          setCurrent: function(model) {
            sandbox.currentWeapon = model;
          },
          setPrimary: function(model) {
            sandbox.primaryWeapon = model;
          },
          setSecondary: function(model) {
            sandbox.secondaryWeapon = model;
          },
          getCurrentEntry: function() {
            if (sandbox.currentWeapon == sandbox.primaryWeapon) {
              return sandbox.weapons[sandbox.loadout[0]];
            } else {
              return sandbox.weapons[sandbox.loadout[1]];
            }
          },
          switch: function(slot = null) {
            if (slot == "primary") {
              utils.weapons.animations.stop("idle");
              scene.remove(sandbox.currentWeapon);
              utils.weapons.setCurrent(sandbox.primaryWeapon);
              utils.weapons.animations.start("idle");
              scene.add(sandbox.currentWeapon);
            }
          },
          fire: function(rounds = 1, rate = 1000) {
            utils.options.set("Firing", true);
            let weapon = utils.weapons.getCurrentEntry();
            let timeScale = (weapon.model.animations[weapon.animationStructure["shoot"][0]].duration * 1000) / rate;
            let lastFire = Date.now() - rate;
            let roundsFired = 0;
            let spreads = Array(rounds * 2).fill(0).map(x => { const spread = Math.random() / (utils.options.get("Zoomed") ? 90 : 60) * weapon.spread; return Math.floor(Math.random() * 2) == 0 ? -spread : spread });

            if (timeScale < 1) timeScale = 1;

            utils.weapons.animations.stop("walk");
            utils.weapons.animations.stop("idle");

            let interval = setInterval(function() {
              if (roundsFired < rounds) {
                if (Date.now() - lastFire >= rate) {
                  lastFire = Date.now();
                  utils.weapons.animations.start("shoot", { loop: THREE.LoopOnce, reset: true });
                  utils.effects.bulletHole(spreads[roundsFired], spreads[roundsFired + 1]);
                  if (weapon.muzzleFlash) utils.effects.muzzleFlash();
                  roundsFired++;
                }
              } else {
                clearInterval(interval);
                utils.weapons.animations.start("idle");
                if (utils.options.get("Walking")) utils.weapons.animations.start("walk", { instant: true });
                utils.options.set("Firing", false);
              }
            });
          },
          zoom: function() {
            if (utils.options.get("Zoomed")) {
              const weapon = utils.weapons.getCurrentEntry();
              if (utils.options.get("globalZoomTween")) {
                utils.options.get("globalZoomTween").in.position.stop();
                utils.options.get("globalZoomTween").in.rotation.stop();
                utils.options.get("globalZoomTween").in.fov.stop();
              }
              utils.options.set("globalZoomTween", {
                out: {
                  position: new TWEEN.Tween(weapon.model.scene.children[0].position).to({ x: 0, y: 0, z: 0 }, weapon.zoomDuration).easing(TWEEN.Easing.Quadratic.InOut).start(),
                  rotation: new TWEEN.Tween(weapon.model.scene.children[0].rotation).to({ x: 0, y: 0, z: 0 }, weapon.zoomDuration).easing(TWEEN.Easing.Quadratic.InOut).start(),
                  fov: new TWEEN.Tween(camera).to({ fov: 45 }, weapon.zoomDuration).easing(TWEEN.Easing.Quadratic.InOut).onUpdate(() => { camera.updateProjectionMatrix() }).start(),
                }
              });
              weapon.animationStructure["walk"][2] *= 10;
              utils.options.set("Zoomed", false);
            } else {
              const weapon = utils.weapons.getCurrentEntry();
              if (utils.options.get("globalZoomTween")) {
                utils.options.get("globalZoomTween").out.position.stop();
                utils.options.get("globalZoomTween").out.rotation.stop();
                utils.options.get("globalZoomTween").out.fov.stop();
              }
              utils.options.set("globalZoomTween", {
                in: {
                  position: new TWEEN.Tween(weapon.model.scene.children[0].position).to({ x: weapon.zoomPosition[0], y: weapon.zoomPosition[1], z: weapon.zoomPosition[2] }, weapon.zoomDuration).easing(TWEEN.Easing.Quadratic.InOut).start(),
                  rotation: new TWEEN.Tween(weapon.model.scene.children[0].rotation).to({ x: weapon.zoomPosition[3], y: weapon.zoomPosition[4], z: weapon.zoomPosition[5] }, weapon.zoomDuration).easing(TWEEN.Easing.Quadratic.InOut).start(),
                  fov: new TWEEN.Tween(camera).to({ fov: weapon.zoomFov }, weapon.zoomDuration).easing(TWEEN.Easing.Quadratic.InOut).onUpdate(() => { camera.updateProjectionMatrix() }).start(),
                }
              });
              weapon.animationStructure["walk"][2] /= 10;
              utils.options.set("Zoomed", true);
            }
          }
        },
        effects: {
          bulletHole: function(spreadX, spreadY) {
            let raycaster = new THREE.Raycaster();
            raycaster.setFromCamera({ x: spreadX, y: spreadY }, camera);
            const intersects = raycaster.intersectObjects(map.children);

            if (intersects.length > 0) {
              const intersect = intersects[0];
              const scale = 0.05;
              const size = new THREE.Vector3(scale, scale, scale);
              const normal = intersect.face.normal.clone();
              normal.transformDirection(intersect.object.matrixWorld);
              const rotation = new THREE.Euler().setFromQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal));

              const decalGeometry = new THREE.DecalGeometry(intersect.object, intersect.point, rotation, size);
              const decalMesh = new THREE.Mesh(decalGeometry, utils.options.get("bulletHoleMaterial"));
              scene.add(decalMesh);

              THREE.particles.dust(intersect.point);

              setTimeout(async function() {
                scene.remove(decalMesh);
                decalGeometry.dispose();
                raycaster = null;
              }, 20000);
            }
          },
          muzzleFlash: function() {
            let flash = sandbox.currentWeapon.getObjectByName("muzzleFlash");
            flash.rotateZ(Math.random());
            flash.material.color.setHex(0xff6604);
            flash.material.emissive.setHex(0xff2211);
            flash.material.opacity = 1;
            setTimeout(() => flash.material.opacity = 0, 20);
          }
        }
      };

      for (let i = 0; i < sandbox.models.length; i++) {
        new THREE.GLTFLoader().load(sandbox.models[i].path, function(model) {
          sandbox.models[i].model = model;
          sandbox.models[i].loaded = true;
          if (model.animations) {
            sandbox.models[i].model.animationMixer = new THREE.AnimationMixer(model.scene);
          }
          let idSplit = sandbox.models[i].id.split(".");
          if (idSplit[0] == "weapon") {
            let name = idSplit[1];
            // todo: update with selected map name
            if (sandbox.weapons[name].requiredMaps.includes("Cargo_Port") || sandbox.loadout.includes(name)) {
              model.scene.traverse(child => child.frustumCulled = false);
              sandbox.weapons[name].model = model;
              sandbox.weapons[name].loaded = true;
              if (name == sandbox.loadout[0]) {
                utils.weapons.setPrimary(model.scene);
                utils.weapons.switch("primary");
              }
            }
          }
        });
      }

      function onWindowResize() {
        renderer.setPixelRatio(1.4);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth * 0.5, window.innerHeight * 0.5, false);
        THREE.bloomPass.resize();
      }
      window.addEventListener("resize", onWindowResize);
      onWindowResize();

      let globalRepeat = false;
      document.addEventListener("keydown", (event) => {
        if (!PointerControls.isLocked) return;
        keyStates[event.code] = true;
        if (!event.repeat && !utils.options.get("Walking") && /KeyW|KeyA|KeyS|KeyD|ArrowUp|ArrowLeft|ArrowS|ArrowD/i.test(event.code)) {
          utils.options.set("Walking", true);
          if (!utils.options.get("Firing")) {
            utils.weapons.animations.stop("idle");
            utils.weapons.animations.start("walk");
          }
        }
        globalRepeat = true;
      });

      document.addEventListener("keyup", (event) => {
        globalRepeat = false;
        keyStates[event.code] = false;
        if (!keyStates["KeyW"] && !keyStates["KeyA"] && !keyStates["KeyS"] && !keyStates["KeyD"] && !keyStates["ArrowUp"] && !keyStates["ArrowLeft"] && !keyStates["ArrowDown"] && !keyStates["ArrowRight"] && /KeyW|KeyA|KeyS|KeyD|ArrowUp|ArrowLeft|ArrowS|ArrowD/i.test(event.code)) {
          utils.options.set("Walking", false);
          utils.weapons.animations.stop("walk");
          utils.weapons.animations.start("idle");
        }
      });

      document.addEventListener("mousedown", (event) => {
        if (document.pointerLockElement != null) return;
        document.body.requestPointerLock();
        PointerControls.lock();
      });

      document.addEventListener("mouseup", (event) => {
        if (!PointerControls.isLocked) return;
        PointerControls.lock();
      });

      new THREE.GLTFLoader().load("/maps/Cargo_Port.glb", (model) => {
        map = model.scene;

        map.traverse(object => object.frustumCulled = false);
        worldOctree.fromGraphNode(map);
        scene.add(map);
        map.traverse(child => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            if (child.material.map) {
              child.material.map.anisotropy = 4;
            }
          }
        });

        sky = new THREE.Mesh(new THREE.SphereGeometry(100, 25, 25), new THREE.MeshStandardMaterial({
          emissive: 0xf2a76a,
          map: new THREE.TextureLoader().load("sky2.png"),
          side: THREE.BackSide,
          emissiveIntensity: .4,
          roughness: 0,
          metalness: 0
        }));
        scene.add(sky);

        animate();
        update();
      });

      const PointerControls = new PointerLockControls(camera, renderer.domElement);
      PointerControls.maxPolarAngle = Math.PI - .15;
      PointerControls.minPolarAngle = .15;
      PointerControls.pointerSpeed = .6;
      PointerControls.isLocked = true;

      utils.options.set("Walking", false);
      utils.options.set("Firing", false);
      utils.options.set("Zoomed", false);
      utils.options.set("bulletHoleMaterial", new THREE.MeshStandardMaterial({ map: new THREE.TextureLoader().load("/images/assets/bullet-holes/0.png"), transparent: true, depthTest: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4, side: THREE.DoubleSide }));
      utils.options.set("globalZoomTween", null);
    </script>
  </body>
</html>
