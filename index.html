        },
        grenades: {
          throw: function(type = null, isMultiplayer = false, point = camera, direction = playerDirection) {
            if (type == null) {
              if (sandbox.grenades["mk2"] > 0) {
                type = "mk2";
              } else if (sandbox.grenades["plasma"] > 0) {
                type = "plasma";
              }
            }
            if (!type) return;
            const grenade = grenades[utils.grenades.getAvailable(type)];
            if (isMultiplayer) {
              grenade.explode = false;
            } else {
              if (utils.vehicles.check()) return;
              utils.weapons.stopFire();
              utils.weapons.stopZoom();
              utils.weapons.stopReload();
              utils.weapons.stopMelee();
              utils.weapons.stopSprint(false, true);
              if (utils.options.get("ThrowingGrenade") || sandbox.grenades[type] <= 0) return;
              utils.options.set("ThrowingGrenade", true);
              sandbox.grenades[type]--;
              utils.weapons.animations.stop("walk");
              utils.weapons.animations.stop("idle");
              utils.weapons.animations.start("throw", { reset: true, loop: THREE.LoopOnce }, function() {
                utils.options.set("ThrowingGrenade", false);
                if (!utils.options.get("Reloading")) {
                  if (utils.options.get("Walking")) {
                    utils.weapons.animations.start("walk", { instant: true });
                  } else {
                    utils.weapons.animations.start("idle");
                  }
                }
                utils.weapons.update();
              });
              gametime.run("throwGrenade", [gametime.player.uuid, type, [direction.x, direction.y, direction.z, camera.rotation.x, camera.rotation.y, camera.rotation.z, camera.position.x, camera.position.y, camera.position.z], grenade.id]);
            }
            grenade.available = false;
            setTimeout(() => {
              point.getWorldDirection(direction);
              grenade.collider.center.copy(point.position).addScaledVector(direction, playerCollider.radius * 1.5);
              grenade.velocity.copy(direction).multiplyScalar(35);
              grenade.angularVelocity.set(0, 0, 0);
              grenade.velocity.addScaledVector(playerVelocity, 2);
            }, 300);
            return grenade.id;
          },
          explode: function(grenade, isMultiplayer = false) {
            const worldPosition = grenade.mesh.getWorldPosition(vectors[6]);
            if (grenade.type == "plasma") {
              particles.plasma(worldPosition);
            } else {
              particles.explosion(worldPosition);
            }
            if (!grenade.stuck) {
              audio.grenadeExplosion(worldPosition, grenade.type);
            }
            utils.players.hit(null, null, grenade);
            const shakeIntensity = 2 / (Math.max(camera.position.distanceTo(worldPosition), 1) / 2);
            utils.effects.shake(shakeIntensity);
            if (grenade.stuck) scene.add(grenade.mesh);
            if (!isMultiplayer) gametime.run("explodeGrenade", [gametime.player.uuid, grenade.id, [worldPosition.x, worldPosition.y, worldPosition.z]]);
            grenade.mesh.position.set(0, -2000, 0);
            grenade.collider.center.set(0, -2000, 0);
            grenade.available = true;
            grenade.hits = 0;
            grenade.timestamp = null;
            grenade.lastHitTimestamp = null;
            grenade.explodeTime = 1500;
            grenade.stuck = false;
            grenade.explode = true;
            grenade.didSound = false;
            grenade.doSound = false;
            grenade.multiplayerId = null;
            grenade.playerUUID = null;
          },
          getAvailable: function(type) {
            return grenades.filter(grenade => grenade.type == type && grenade.available)[0].id;
          },
          add: function(mesh, type) {
            mesh.position.y = -2000;
            grenades.push({
              type: type,
              mesh: mesh,
              collider: new THREE.Sphere(new THREE.Vector3(0, -2000, 0), 0.1),
              velocity: new THREE.Vector3(),
              angularVelocity: new THREE.Vector3(),
              available: true,
              hits: 0,
              timestamp: null,
              lastHitTimestamp: null,
              explodeTime: 1500,
              stuck: false,
              explode: true,
              didSound: false,
              doSound: false,
              id: grenades.length,
              multiplayerId: null,
              playerUUID: null,
              damage: type == "mk2" ? 100 : 130,
              smoke: type == "mk2" ? true : false
            });
          }
        },
        effects: {
          bulletHole: function(spreadX, spreadY, type, point = camera, weapon = null, checkDistance = false) {
            const raycaster = utils.options.get("effectsRaycaster");
            raycaster.setFromCamera({ x: spreadX, y: spreadY }, point);
            const intersects = raycaster.intersectObjects(map.children.concat(utils.players.shields, utils.vehicles.shields));
            if (intersects.length > 0) {
              const intersect = intersects[0];
              if (intersect.object.isShield && weapon != null) {
                const shield = intersect.object;
                if (shield.shieldType == "vehicle") {
                  const damage = weapon.damage / 10;
                  shield.vehicle.condition += -damage;
                  particles.dust(intersect.point);
                  gametime.run("vehicleHit", [gametime.player.uuid, shield.vehicle.id, damage]);
                } else {
                  utils.players.hit(utils.players.objects[shield.playerUUID], shield, weapon);
                  particles.blood(intersect.point);
                }
              } else {
                if (checkDistance && camera.position.distanceTo(intersect.point) > 1) return;
                const bulletHole = utils.options.get("bulletHoles")[type];
                const size = bulletHole.size;
                const normal = intersect.face.normal;
                normal.transformDirection(intersect.object.matrixWorld);
                const euler = vectors[17];
                const quaternion = vectors[18];
                euler.set(0, 0, 0);
                quaternion.set(0, 0, 0, 1);
                const rotation = euler.setFromQuaternion(quaternion.setFromUnitVectors(vectors[15], normal));
                const decalGeometry = new THREE.DecalGeometry(intersect.object, intersect.point, rotation, size);
                const decalMesh = new THREE.Mesh(decalGeometry, bulletHole.material);
                scene.add(decalMesh);
                particles.dust(intersect.point);
                utils.options.addTmpObject(decalMesh, "bulletHole", 20000);
              }
            }
          },
          muzzleFlash: function(model = null) {
            const flash = (model || sandbox.currentWeapon).getObjectByName("muzzleFlash");
            flash.rotateZ(Math.random());
            flash.material.opacity = 1;
            utils.options.addTmpObject(flash.material, "muzzleFlash");
          },
          shake: function(intensity = 2, startDuration = 200, endDuration = 700) {
            new TWEEN.Tween({ intensity: 0 }).to({ intensity: intensity }, startDuration).easing(TWEEN.Easing.Quadratic.InOut).start().onUpdate(function(value) {
              utils.options.set("CameraShake", value.intensity);
              if (value.intensity >= intensity - 0.05) {
                new TWEEN.Tween({ intensity: intensity }).to({ intensity: 0 }, endDuration).easing(TWEEN.Easing.Quadratic.InOut).start().onUpdate(function(value) {
                  utils.options.set("CameraShake", value.intensity);
                });
              }
            });
          },
          bob: function(type = 0, intensity = 1) {
            let maxStep = 10;
            let step = 0;
            let strength = 0.001;
            function animation() {
              if (step > maxStep) {
                step = 0;
                if (strength > 0) {
                  strength *= -1;
                } else {
                  return;
                }
              }
              step++;
              if (type == 0) {
                camera.rotateX(strength / 3);
                camera.rotateZ(strength);
              } else if (type == 1) {
                maxStep = 2;
                camera.rotateX(strength * 2 * intensity);
              }
              requestAnimationFrame(animation);
            }
            animation();
          }
        },
        vehicles: {
          shields: [],
          add: function(model, type) {
            const amountOfVehicles = sandbox.maps[sandbox.presets.map].vehicles.length;

              const mapVehicle = sandbox.maps[sandbox.presets.map].vehicles[i];

              vehicle.position.set(mapVehicle.position[0], mapVehicle.position[1], mapVehicle.position[2]);

              const entry = {
                id: vehicles.length,
                type: "Jeep",
                mesh: vehicle,
                body: body,
                lastCollision: null,
                lastPlayerCollision: null,
                physicsVariables: {
                  enginePower: 0,
                  maxEnginePower: 3000,
                  maxEnginePowerReverse: 1000,
                  heading: 0,
                  maxHeading: 0.3,
                  steeringSensitivity: 0.004,
                  throttle: false,
                  gear: "drive"
                },
                currentSeat: null,
                currentView: 1,
                currentDamage: [],
                damageLevel: 0,
                condition: 100,
                despawnTime: null,
                respawnTime: 60000,
                horn: false,

                spawnPoint: mapVehicle.position,

                seats: [
                  {
                    type: "driver",
                    seat: vehicle.getObjectByName("Driver_Seat")
                  },
                  {
                    type: "passenger1",
                    seat: vehicle.getObjectByName("Passenger_Seat1")
                  },
                  {
                    type: "passenger2",
                    seat: vehicle.getObjectByName("Passenger_Seat2")
                  }
                ]
              };
              scene.add(entry.shadow);
              body.oncollision = function(point, intensity, contact, body) {

                    entry.lastPlayerCollision = time;

                  }
                } else {
                  utils.vehicles.collision(entry, point, intensity);
                }
              };
              vehicles.push(entry);
              const shield = vehicle.getObjectByName("Shield");
              shield.vehicle = entry;
              shield.shieldType = "vehicle";
              shield.isShield = true;
              utils.vehicles.shields.push(shield);
            }
          },
          explode: function(vehicle) {

            const distance = camera.position.distanceTo(vehicle.mesh.position);
            const shakeIntensity = 2 / (Math.max(distance, 1) / 5);
            utils.effects.shake(shakeIntensity);

            particles.explosion(vehicle.mesh.position, 3);

            vehicle.physicsVariables.gear = "drive";
            vehicle.smoke = false;
            vehicle.horn = false;
            vehicle.allowedToUpdate = false;
            vehicle.body.position.set(0, -2000, 0);
            vehicle.shadow.position.y = -2000;
          },
          respawn: function(vehicle) {
            vehicle.despawnTime = null;
            vehicle.currentDamage = [];
            vehicle.damageLevel = 0;
            vehicle.condition = 100;
            vehicle.allowedToUpdate = true;
            vehicle.body.velocity.set(0, 0, 0);
            vehicle.body.angularVelocity.set(0, 0, 0);
            vehicle.body.position.set(vehicle.spawnPoint[0], vehicle.spawnPoint[1], vehicle.spawnPoint[2]);
            vehicle.mesh.rotation.set(vehicle.spawnPoint[3], vehicle.spawnPoint[4], vehicle.spawnPoint[5]);
            vehicle.body.quaternion.copy(vehicle.mesh.quaternion);
          },
          switchView: function(view = null) {
            const vehicle = utils.options.get("CurrentVehicle");
            if (vehicle) {
              let newView = null;
              if (view != null) {
                newView = view;
              } else if (vehicle.currentView == 0) {
                newView = 1;
              } else if (vehicle.currentView == 1) {
                newView = 0;
              }
              if (newView == 1) {
                vehicle.currentView = 1;
                const sittingPose = utils.models.get("pose").model.scene.getObjectByName("Sitting_Pose");
                vehicle.currentSeat.seat.add(sittingPose);
                sandbox.primaryWeapon.visible = false;
                sandbox.secondaryWeapon.visible = false;
              } else if (newView == 0) {
                sandbox.primaryWeapon.visible = true;
                sandbox.secondaryWeapon.visible = true;
                vehicle.currentView = 0;
                camera.position.set(0, 0, 0);
                camera.rotation.set(0, 0, 0);
                const sittingPose = vehicle.currentSeat.seat.getObjectByName("Sitting_Pose");
                if (sittingPose) utils.models.get("pose").model.scene.add(sittingPose);
              }
            }
          },
          check: function(strict = false) {
            const vehicle = utils.options.get("CurrentVehicle");
            if (vehicle) {
              if (strict) return vehicle;
              if (vehicle.currentSeat.type == "driver") return vehicle;
              return false;
            }
          },
          exit: function() {
            const vehicle = utils.options.get("CurrentVehicle");
            if (vehicle) {
              utils.vehicles.switchView(0);
              const worldPosition = camera.getWorldPosition(vectors[6]);
              camera.position.set(worldPosition.x, worldPosition.y, worldPosition.z);
              camera.rotation.set(0, vehicle.mesh.rotation.y, 0);
              if (vehicle.currentSeat.type == "driver") {
                camera.translateX(-1);
              } else {
                camera.translateX(1);
              }
              playerCollider.start.set(camera.position.x, camera.position.y - 0.65, camera.position.z);
              playerCollider.end.set(camera.position.x, camera.position.y, camera.position.z);
              scene.add(camera);
              if (vehicle.currentSeat.type == "driver") {
                scene.add(sandbox.currentWeapon);
                utils.ui.showCrosshair();
                vehicle.physicsVariables.throttle = false;
              }
              utils.options.set("CurrentVehicle", null);
              gametime.run("exitVehicle", [gametime.player.uuid, vehicle.currentSeat.type, { index: gametime.player.data.vehicle.index, enginePower: vehicle.physicsVariables.enginePower }]);
              gametime.player.data.vehicle = null;
              vehicle.currentSeat = null;
              utils.weapons.update();
              return true;
            }
            return false;
          },
          enter: function() {
            if (utils.vehicles.exit() || utils.vehicles.flip()) return;
            for (let i = 0; i < vehicles.length; i++) {
              const vehicle = vehicles[i];
              vehicle.lastUsedBy = "self";
              for (let j = 0; j < vehicle.seats.length; j++) {
                const seat = vehicle.seats[j];
                const worldPosition = seat.seat.getWorldPosition(vectors[6]);
                if (camera.position.distanceTo(worldPosition) < 0.9 && !seat.taken) {
                  utils.weapons.stopFire();
                  utils.weapons.stopZoom();
                  utils.weapons.stopReload();
                  utils.weapons.stopMelee();
                  utils.weapons.stopCrouch();
                  utils.weapons.stopWalking();
                  vehicle.currentSeat = seat;
                  utils.options.set("CurrentVehicle", vehicle);
                  camera.position.set(0, 0, 0);
                  camera.rotation.set(0, 0, 0);
                  seat.seat.add(camera);
                  if (seat.type == "driver") {
                    scene.remove(sandbox.currentWeapon);
                    utils.ui.hideCrosshair();
                  }
                  utils.vehicles.switchView(1);
                  gametime.player.data.vehicle = {
                    index: vehicles.indexOf(vehicle),
                    condition: vehicle.condition,
                    heading: vehicle.physicsVariables.heading,
                    throttle: vehicle.physicsVariables.throttle,
                    enginePower: vehicle.physicsVariables.enginePower,
                    position: [0, 0, 0, 0, 0, 0, 0],
                    seat: seat.type
                  };
                  gametime.run("enterVehicle", [gametime.player.uuid, seat.type, gametime.player.data.vehicle.index]);
                  return;
                }
              }
            }
          },
          flip: function() {
            if (utils.vehicles.check(true)) return;
            let didFlip = false;
            for (let i = 0; i < vehicles.length; i++) {
              const vehicle = vehicles[i];
              if (!didFlip && camera.position.distanceTo(vehicle.mesh.position) < 3 && utils.vehicles.checkIfFlipped(vehicle)) {
                didFlip = true;
                vehicle.body.angularVelocity.x = 5;
                vehicle.body.velocity.y += 5;
                vehicle.body.angularVelocity.z = 5;
                vehicle.body.angularVelocity.x = 10;
              }
            }
            return didFlip;
          },
          throttle: function(vehicle, gear) {
            if (vehicle.currentSeat.type == "driver") {
              vehicle.physicsVariables.gear = gear;
              vehicle.physicsVariables.throttle = true;
            }
          },
          stopThrottle: function(vehicle) {
            if (vehicle.currentSeat.type == "driver") vehicle.physicsVariables.throttle = false;
          },
          steer: function(vehicle, direction) {
            if (vehicle.currentSeat.type == "driver") {
              if (direction == "left") {
                if (vehicle.physicsVariables.heading < vehicle.physicsVariables.maxHeading) vehicle.physicsVariables.heading += vehicle.physicsVariables.steeringSensitivity;
              } else if (direction == "right") {
                if (vehicle.physicsVariables.heading > -vehicle.physicsVariables.maxHeading) vehicle.physicsVariables.heading -= vehicle.physicsVariables.steeringSensitivity;
              }
            }
          },
          collision: function(vehicle, point, intensity) {
            const time = Date.now();
            if (vehicle.currentSeat) {
              if (time - vehicle.lastCollision > 500) utils.effects.shake(intensity / 30, 100, 300);
              if (intensity > 14) utils.health.subtract(intensity / 2, null);
            }
            if (intensity > 0.5) {
              particles.dust(point, Math.min(intensity * 2, 20));
              if (intensity < 2) {
                if (time - vehicle.lastCollision > 250) audio.vehicleCrash(vehicle, intensity);
              } else {
                audio.vehicleCrash(vehicle, intensity);
              }
              vehicle.lastCollision = time;
            }
            if (intensity > 5) {
              vehicle.condition += -intensity / 8;
            }
            if (intensity > 18) vehicle.horn = true;
          },
          checkIfFlipped: function(vehicle) {
            const up = vectors[27];
            up.set(vehicle.mesh.position.x, vehicle.mesh.position.y + 2, vehicle.mesh.position.z);
            const position1 = vectors[28];
            position1.set(vehicle.mesh.position.x, vehicle.mesh.position.y, vehicle.mesh.position.z);
            vectors[29].copy(vectors[30]).applyQuaternion(vehicle.mesh.quaternion);
            position1.add(vectors[29].multiplyScalar(1));
            const position2 = vectors[29];
            position2.set(vehicle.mesh.position.x, vehicle.mesh.position.y + 1, vehicle.mesh.position.z);
            return position1.distanceTo(up) > position2.distanceTo(up) + 0.5;
          },
          calculateTurningAngle: function(v, a) {
            return (v / 2.7) * Math.tan((a / (Math.max(v * 2.24, 10) / 10)) * (Math.PI / 180));
          },
          calculateHeadingReset: function(a, v) {
            const resetStrength = 0.2;
            const maxResetRate = Math.min(Math.max(v, 15), 30);
            let correctionAngularVelocity = -resetStrength * a * v;
            if (correctionAngularVelocity > maxResetRate) correctionAngularVelocity = maxResetRate;
            if (correctionAngularVelocity < -maxResetRate) correctionAngularVelocity = -maxResetRate;
            return correctionAngularVelocity / 200;
          }
        },
        health: {
          max: 100,
          current: 100,
          lastHitTimestamp: null,
          incremented: true,
          increment: function(deltaTime) {
            if (!utils.health.incremented) utils.ui.setHealthBar(utils.health.max, "long");
            utils.health.incremented = true;
            utils.health.current += 0.045 / deltaTime;
            if (utils.health.current >= utils.health.max) utils.health.current = utils.health.max;
          },
          add: function(amount) {
            let newHealth = utils.health.current + amount;
            if (newHealth > 100) {
              newHealth = 100;
            }
            utils.health.current = newHealth;
            utils.ui.setHealthBar(newHealth, "short");
          },
          subtract: function(amount, killer, grenade) {
            const newHealth = utils.health.current - Math.round(amount);
            if (newHealth <= -25) utils.health.die(killer || "self");
            utils.health.current = newHealth;
            utils.ui.setHealthBar(Math.max(newHealth, 0), "short");
            utils.health.lastHitTimestamp = Date.now();
            utils.health.incremented = false;
            const hurtIntensity = amount / 28;
            if (grenade) {
              utils.ui.hurtScreen(grenade.mesh.position, hurtIntensity);
            } else if (killer) {
              utils.ui.hurtScreen(killer.scene.position, hurtIntensity);
            } else {
              utils.ui.hurtScreen(camera.position, hurtIntensity);
            }
          },
          reset: function() {
            utils.health.current = 100;
            utils.ui.setHealthBar(100, "instant");
          },
          die: function(killer) {
            utils.vehicles.exit();
            utils.weapons.stopFire();
            utils.weapons.stopZoom();
            utils.weapons.stopReload();
            utils.weapons.stopMelee();
            utils.weapons.stopCrouch();
            utils.weapons.stopWalking(false);
            if (utils.options.get("DeathTime")) return;
            utils.options.set("DeathTime", Date.now());
            const deathPose = utils.players.createDeathPose(camera);
            if (killer == "self") {
              utils.options.set("Killer", {
                killType: "self",
                body: deathPose
              });
              utils.ui.addKillStatsRow("self", "self");
              gametime.run("playerDie", [gametime.player.uuid, gametime.player.uuid]);
            } else {
              utils.options.set("Killer", killer.uuid);
              utils.ui.addKillStatsRow(killer.uuid, "self");
              gametime.run("playerDie", [gametime.player.uuid, killer.uuid]);
            }
            camera.rotation.set(Math.PI / 2 - 0.8, 0, 0);
            deathScreen = true;
            scene.remove(sandbox.currentWeapon);
            utils.ui.hide();
            camera.fov = 70;
            camera.updateProjectionMatrix();
            utils.effects.shake(3, 100, 800);
            audio.dying(camera.position);
            PointerControls.isLocked = false;
          },
          respawn: function() {
            utils.options.set("DeathTime", null);
            utils.options.set("Killer", null);
            deathScreen = false;
            const spawnPoint = sandbox.maps[sandbox.presets.map].spawnPoints[Math.floor(Math.random() * sandbox.maps[sandbox.presets.map].spawnPoints.length)];
            playerCollider.start.set(spawnPoint[0], spawnPoint[1] + 0.35, spawnPoint[2]);
            playerCollider.end.set(spawnPoint[0], spawnPoint[1] + 1, spawnPoint[2]);
            camera.rotation.set(spawnPoint[3], spawnPoint[4], spawnPoint[5]);
            utils.ui.show();
            camera.fov = 45;
            camera.updateProjectionMatrix();
            PointerControls.isLocked = true;
            sandbox.loadout[0] = sandbox.presets.loadout[0];
            sandbox.loadout[1] = sandbox.presets.loadout[1];
            const primaryWeapon = utils.weapons.getPrimaryEntry();
            const secondaryWeapon = utils.weapons.getSecondaryEntry();
            primaryWeapon.ammo = primaryWeapon.defaultAmmo;
            secondaryWeapon.ammo = secondaryWeapon.defaultAmmo;
            primaryWeapon.currentAmmo = primaryWeapon.maxAmmo;
            secondaryWeapon.currentAmmo = secondaryWeapon.maxAmmo;
            utils.weapons.switch("primary", true);
            sandbox.grenades["mk2"] = sandbox.presets.grenades["mk2"];
            sandbox.grenades["plasma"] = sandbox.presets.grenades["plasma"];
            utils.health.reset();
            gametime.run("playerRespawn", [gametime.player.uuid, spawnPoint]);
          }
        }
      };

      sandbox.presets.options.teamOrder = Array(sandbox.presets.options.teamSize).fill("red").concat(Array(sandbox.presets.options.teamSize).fill("blue"));
      sandbox.loadout[0] = sandbox.presets.loadout[0];
      sandbox.loadout[1] = sandbox.presets.loadout[1];
      sandbox.grenades["mk2"] = sandbox.presets.grenades["mk2"];
      sandbox.grenades["plasma"] = sandbox.presets.grenades["plasma"];

      for (let i = 0; i < sandbox.models.length; i++) {
        const idSplit = sandbox.models[i].id.split(".");
        const isWeapon = idSplit[0] == "weapon";
        if (sandbox.models[i].requiredMaps.includes(sandbox.presets.map) || sandbox.models[i].requiredMaps == "all" || (isWeapon && sandbox.loadout.includes(idSplit[1]))) {
          if (sandbox.models[i].id == "pose") sandbox.models[i].path = `/models/characters/poses/${sandbox.presets.character}.glb`;
          new THREE.GLTFLoader(sandbox.loadingManager).load(sandbox.models[i].path, async function(model) {
            sandbox.models[i].model = model;
            sandbox.models[i].loaded = true;
            scene.add(model.scene);
            if (model.animations) {
              sandbox.models[i].model.animationMixer = new THREE.AnimationMixer(model.scene);
            }
            if (typeof sandbox.models[i].callback == "function") sandbox.models[i].callback(model);
            if (isWeapon) {
              const name = idSplit[1];
              model.scene.traverse(child => child.frustumCulled = false);
              sandbox.weapons[name].model = model;
              sandbox.weapons[name].loaded = true;
              if (name == sandbox.loadout[0]) utils.weapons.setPrimary(model.scene);
              if (name == sandbox.loadout[1]) utils.weapons.setSecondary(model.scene);
              utils.images.preload("/images/crosshairs/" + sandbox.weapons[name].reticle + ".png");
              if (sandbox.weapons[name].muzzleFlash) {
                model.scene.getObjectByName("muzzleFlash").material.color.setHex(0xffaa55);
                utils.effects.muzzleFlash(model.scene);
              }
              if (sandbox.weapons[name].scope) {
                const lensCamera = model.scene.getObjectByName("LensCamera");
                lensCamera.aspect = 1;
                lensCamera.updateProjectionMatrix();
                model.scene.getObjectByName("Lens").material.map = utils.options.get("scopeRenderTarget").texture;
              }
            }
            renderer.render(scene, camera);
          });
        }
      }

      sandbox.loadingManager.onProgress = function(url, itemsLoaded, itemsTotal) {
        const progress = itemsLoaded / itemsTotal;
      };
      sandbox.loadingManager.onLoad = function() {
        sandbox.models.forEach(model => {
          if (typeof model.removeAfterLoaded == "undefined" && model.model) scene.remove(model.model.scene);
        });
        sandbox.initialize();
      };

      function onWindowResize() {
        renderer.setPixelRatio(1.3);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth * 0.5, window.innerHeight * 0.5, false);
      }
      window.addEventListener("resize", onWindowResize);
      onWindowResize();

      document.addEventListener("keydown", function(event) {
        if (!PointerControls.isLocked) return;
        keyStates[event.code] = true;
        if (!event.repeat && !deathScreen) {
          if (!utils.options.get("Walking") && /KeyW|KeyA|KeyS|KeyD|ArrowUp|ArrowLeft|ArrowDown|ArrowRight/i.test(event.code)) utils.weapons.startWalking();
          if (sandbox.controls.fire.includes(event.code)) utils.weapons.fire();
          if (sandbox.controls.zoom.includes(event.code)) utils.weapons.zoom();
          if (sandbox.controls.reload.includes(event.code)) utils.weapons.reload();
          if (sandbox.controls.switch.includes(event.code)) utils.weapons.switch();
          if (sandbox.controls.grenade.includes(event.code)) utils.grenades.throw();
          if (sandbox.controls.melee.includes(event.code)) utils.weapons.melee();
          if (sandbox.controls.sprint.includes(event.code) && (keyStates["KeyW"] || keyStates["ArrowUp"])) utils.weapons.sprint();
          if (sandbox.controls.crouch.includes(event.code)) utils.weapons.crouch();
          if (sandbox.controls.enterVehicle.includes(event.code)) utils.vehicles.enter();
          if (sandbox.controls.vehicleView.includes(event.code)) utils.vehicles.switchView();
        }
      });
      document.addEventListener("keyup", function(event) {
        keyStates[event.code] = false;
        if (!keyStates["KeyW"] && !keyStates["KeyA"] && !keyStates["KeyS"] && !keyStates["KeyD"] && !keyStates["ArrowUp"] && !keyStates["ArrowLeft"] && !keyStates["ArrowDown"] && !keyStates["ArrowRight"] && /KeyW|KeyA|KeyS|KeyD|ArrowUp|ArrowLeft|ArrowS|ArrowD/i.test(event.code)) utils.weapons.stopWalking();
        if (!keyStates["KeyW"] && !keyStates["KeyS"] && !keyStates["ArrowUp"] && !keyStates["ArrowDown"]) {
          const vehicle = utils.options.get("CurrentVehicle");
          if (vehicle) utils.vehicles.stopThrottle(vehicle);
        }
        if (sandbox.controls.fire.includes(event.code)) utils.weapons.stopFire();
        if (sandbox.controls.sprint.includes(event.code)) utils.weapons.stopSprint();
      });
      document.addEventListener("mousedown", function(event) {
        if (document.pointerLockElement != null) return;
        document.body.requestPointerLock();
        PointerControls.lock();
      });
      document.addEventListener("mouseup", (event) => {
        if (!PointerControls.isLocked) return;
        PointerControls.lock();
      });

      const PointerControls = new PointerLockControls(camera, renderer.domElement);
      PointerControls.maxPolarAngle = Math.PI - 0.15;
      PointerControls.minPolarAngle = 0.15;
      PointerControls.pointerSpeed = 0.6;
      PointerControls.isLocked = true;

      utils.options.set("Walking", false);
      utils.options.set("Firing", false);
      utils.options.set("Zoomed", false);
      utils.options.set("Reloading", false);
      utils.options.set("Switching", false);
      utils.options.set("ThrowingGrenade", false);
      utils.options.set("Sprinting", false);
      utils.options.set("Aiming", false);
      utils.options.set("CurrentVehicle", false);
      utils.options.set("ReloadCallback", {});
      utils.options.set("bulletHoles", {
        0: {
          size: vectors[23],
          material: new THREE.MeshStandardMaterial({ map: new THREE.TextureLoader().load("/images/assets/bullet-holes/0.png"), transparent: true, depthTest: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4, side: THREE.DoubleSide })
        },
        20: {
          size: vectors[23],
          material: new THREE.MeshStandardMaterial({ map: new THREE.TextureLoader().load("/images/assets/bullet-holes/20.png"), transparent: true, depthTest: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4, side: THREE.DoubleSide })
        }
      });
      utils.options.set("materials", {
        windshield: new THREE.MeshBasicMaterial({ color: 0x555555, transparent: true, opacity: 0.1, depthWrite: false }),
        shattered_windshield: new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 1, depthWrite: false, map: new THREE.TextureLoader().load("/images/assets/vehicles/shattered_glass.png") })
      });
      utils.options.set("playerCamera", camera.clone());
      utils.options.set("scopeRenderTarget", new THREE.WebGLRenderTarget(250, 250));
      utils.options.set("scopeCompass", new THREE.Mesh(new THREE.CircleGeometry(0.75, 30), new THREE.MeshBasicMaterial({ map: new THREE.TextureLoader().load("/images/ui/compass.png"), transparent: true, opacity: 0.5, depthTest: false, depthWrite: false, side: THREE.DoubleSide })));
      utils.options.set("effectsRaycaster", new THREE.Raycaster());
      utils.options.set("aimRaycaster", new THREE.Raycaster());
      utils.options.set("globalZoomTween", null);
      utils.options.set("globalMeleeTween", null);
      utils.options.set("globalSprintTween", null);
      utils.options.set("tmpObjects", {});
      utils.options.set("CameraShake", 0);
      utils.options.set("DeathTime", null);
      utils.options.set("Killer", null);

      scene.add(utils.options.get("playerCamera"));

      gametime.onupdate = function(player) {
        if (player.uuid == gametime.player.uuid) return;
        if (typeof utils.players.objects[player.uuid] === "undefined" && (sandbox.presets.options.teamGame ? player.data.team : true)) {
          utils.players.add(player);
        }
      };
      gametime.on("jump", function(player) {
        if (player != gametime.player.uuid) utils.players.animations.start(utils.players.objects[player], utils.players.objects[player].weapon.type + "_jump", { loop: THREE.LoopOnce, reset: true });
      });
      gametime.on("switchWeapon", function(player, weapon) {
        if (player != gametime.player.uuid) utils.players.weapons.set(utils.players.objects[player], weapon);
      });
      gametime.on("startWalking", function(player) {
        if (player != gametime.player.uuid) utils.players.startWalking(utils.players.objects[player]);
      });
      gametime.on("stopWalking", function(player) {
        if (player != gametime.player.uuid) utils.players.stopWalking(utils.players.objects[player]);
      });
      gametime.on("startRunning", function(player) {
        if (player != gametime.player.uuid) utils.players.startRunning(utils.players.objects[player]);
      });
      gametime.on("stopRunning", function(player) {
        if (player != gametime.player.uuid) utils.players.stopRunning(utils.players.objects[player]);
      });
      gametime.on("fireWeapon", function(player, point, spreadX, spreadY, bulletHole) {
        if (player != gametime.player.uuid) utils.players.weapons.fire(utils.players.objects[player], point, spreadX, spreadY, bulletHole);
      });
      gametime.on("reloadWeapon", function(player) {
        if (player != gametime.player.uuid) utils.players.weapons.reload(utils.players.objects[player]);
      });
      gametime.on("throwGrenade", function(player, type, point, grenadeId) {
        if (player != gametime.player.uuid) utils.players.grenades.throw(utils.players.objects[player], type, point, grenadeId);
      });
      gametime.on("explodeGrenade", function(player, grenadeId, grenadePosition) {
        if (player != gametime.player.uuid) utils.players.grenades.explode(grenadeId, grenadePosition);
      });
      gametime.on("startCrouching", function(player) {
        if (player != gametime.player.uuid) utils.players.startCrouching(utils.players.objects[player]);
      });
      gametime.on("stopCrouching", function(player) {
        if (player != gametime.player.uuid) utils.players.stopCrouching(utils.players.objects[player]);
      });
      gametime.on("damage", function(player, damage, killer) {
        if (player == gametime.player.uuid) utils.health.subtract(damage, utils.players.objects[killer]);
      });
      gametime.on("playerDie", function(player, killer) {
        if (player != gametime.player.uuid) utils.players.health.die(utils.players.objects[player], killer);
      });
      gametime.on("playerRespawn", function(player, spawnPoint) {
        if (player != gametime.player.uuid) utils.players.health.respawn(utils.players.objects[player], spawnPoint);
      });
      gametime.on("enterVehicle", function(player, seat, vehicleIndex) {
        if (player != gametime.player.uuid) utils.players.vehicles.enter(utils.players.objects[player], seat, vehicles[vehicleIndex]);
      });
      gametime.on("exitVehicle", function(player, seat, vehicleData) {
        if (player != gametime.player.uuid) utils.players.vehicles.exit(utils.players.objects[player], seat, vehicleData);
      });
      gametime.on("vehicleHit", function(player, vehicleIndex, damage) {
        if (player != gametime.player.uuid) utils.players.vehicles.hit(utils.players.objects[player], vehicles[vehicleIndex], damage);
      });
    </script>
  </body>
</html>
