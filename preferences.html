<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferences | FPS5</title>
    <style>
      @font-face {
        font-family: "Aperture";
        src: url(/fonts/Aperture.ttf);
      }
      html, body {
        margin: 0 !important;
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden !important;
      }
      .wrapper {
        position: absolute;
        width: 100%;
        height: 100%;
        margin: 0;
        background: #cdd3d8;
        border: 20px solid #d9d9d9;
        box-sizing: border-box;
        padding: 20px;
      }
      .item-list {
        position: relative;
        height: 420px;
        overflow-y: scroll;
        display: inline-block;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .item-list::-webkit-scrollbar { 
        display: none;
      }
      .item-card {
        position: relative;
        width: 140px;
        height: 140px;
        background: rgba(255, 255, 255, .5);
        box-sizing: border-box;
        padding: 10px;
        border-bottom: 1px solid #bbb;
        cursor: pointer !important;
      }
      .item-card * {
        pointer-events: none !important;
      }
      .item-card.selected {
        /* box-shadow: 0 -5px 0 #5aace1; */
        background: rgba(255, 255, 255, 0.75);
      }
      .item-card:hover {
        background: rgba(255, 255, 255, 0.85);
      }
      .item-card.selected::after {
        content: "SELECTED";
        position: absolute;
        background: #5aace1;
        left: 0;
        top: 0px;
        text-align: right;
        padding: 4px 8px;
        font-size: 9px;
        font-weight: bold;
        color: #fff;
        border-bottom-right-radius: 10px;
      }
      .item-card-preview {
        position: relative;
        width: 100%;
        height: calc(100% - 20px);
        background-size: 100%;
        background-repeat: no-repeat;
        background-position: center;
      }
      .item-card-preview.small-preview {
        background-size: 60%;
      }
      .item-card-preview.tiny-preview {
        background-size: 35%;
      }
      .item-card-name {
        font-size: 14px;
        text-align: center;
        color: #000;
      }
      .item-list-header {
        font-family: "Aperture";
        font-size: 14px;
        margin-bottom: 20px;
        color: #2b78aa;
      }
      .first-section {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .button-container {
        position: relative;
        width: 120px;
        /* height: 120px; */
        padding-top: 100px;
        background-repeat: no-repeat;
        background-size: 70%;
        background-position: top center;
        margin: 0 20px;
      }
      .button-container-keyboard_settings {
        background-image: url(/images/menu/preference-button-keyboard_settings.png);
      }
      .button-container-gamepad_settings {
        background-image: url(/images/menu/preference-button-gamepad_settings.png);
      }
      .button-container-touchscreen_settings {
        background-image: url(/images/menu/preference-button-touchscreen_settings.png);
      }
      .button-container-performance_settings {
        background-image: url(/images/menu/preference-button-performance_settings.png);
      }
      .button-container .button {
        position: relative;
        width: 100%;
        font-size: 10px;
        padding: 10px 0;
        background: rgba(255, 255, 255, .75);
        border: none;
        border-bottom: 5px solid #5aace1;
        color: #000 !important;
      }
      .button-container .button:hover {
        background: #ddd;
      }
      .button-container .button:active {
        background: rgba(255, 255, 255, .75);
      }
      .second-section {
        position: relative;
        width: 100%;
        margin-top: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .selection-container {
        display: inline-block;
        margin: 0 2px;
      }
      .selection-container.scrollable:after {
        content: "\f107";
        font-family: "FontAwesome";
        position: absolute;
        bottom: 3px;
        margin-left: -140px;
        width: 140px;
        height: 10px;
        line-height: 10px;
        background: #ddd;
        text-align: center;
        color: #888;
        font-size: 16px;
        border-top: 1px solid #bbb;
      }
      @media only screen and (max-width:780px) {
        .second-section {
          transform: scale(.8);
          transform-origin: top center;
        }
      }
      @media only screen and (max-height:690px) {
        .second-section {
          transform: scale(.8);
          transform-origin: top center;
        }
      }
      @media only screen and (max-height:620px) {
        .item-list {
          height: 280px;
        }
      }
      @media only screen and (max-height:500px) {
        .item-list {
          height: 140px;
        }
      }
      .window {
        position: absolute;
        max-width: 600px;
        max-height: 400px;
        width: 100%;
        height: 100%;
        background: #fff;
        border: 8px solid #5aace1;
        border-top: none;
        left: 50%;
        top: 50%;
        margin-left: -300px;
        margin-top: -200px;
        z-index: 9999;
        overflow-y: scroll;
        scrollbar-width: thin !important;
        padding: 20px;
        box-sizing: border-box;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        display: none;
      }
      .window-header {
        font-size: 30px;
        font-family: "Aperture";
      }
      .window-close {
        float: right;
        cursor: pointer !important;
      }
      @media only screen and (max-width:600px) {
        .window {
          left: 0;
          margin-left: 0;
        }
      }
      @media only screen and (max-height:400px) {
        .window {
          top: 0;
          margin-top: 0;
        }
      }
      .notiflix-loading {
        background: rgba(0, 0, 0, .6) !important;
      }
      .notiflix-loading-icon {
        animation: flicker 1s step-end infinite;
      }
      .notiflix-report, notiflix-confirm {
        z-index: 10000 !important;
      }
      .notiflix-report-button, .notiflix-confirm-buttons a {
        color: #fff !important;
      }
      .notiflix-report-icon {
        width: 70px !important;
        height: 70px !important;
      }
      .preview-section {
        position: relative;
        margin: 0;
        box-sizing: border-box;
        width: 50%;
        height: 90%;
      }
      .preview-left-section {
        float: left;
        background: #ccc;
        background-size: 80%;
        background-repeat: no-repeat;
        background-position: center;
      }
      .preview-right-section {
        float: right;
        padding-left: 10px;
        display: flex;
        flex-wrap: wrap;
      }
      .preview-description {
        font-size: 14px;
        color: #999;
        border-left: 3px solid #ddd;
        padding-left: 4px;
      }
      .preview-specs {
        position: relative;
        width: 100%;
        height: 140px;
        background: #333;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .preview-specs-bar {
        position: relative;
        width: 60px;
        margin: 10px;
        margin-top: auto;
        margin-bottom: 0;
        font-size: 12px;
        background: #eee;
        text-align: center;
      }
      .preview-specs-bar::after {
        content: "";
        position: absolute;
        bottom: -20px;
        left: 0;
        width: 45px;
        text-align: center;
        font-size: 10px;
      }
      .preview-specs-bar_damage::after {
        content: "Damage";
      }
      .preview-specs-bar_range::after {
        content: "Range";
      }
      .preview-specs-bar_firerate::after {
        content: "Fire Rate";
      }
      .preview-specs-bar_accuracy::after {
        content: "Accuracy";
      }
      .preview-equip {
        width: 100%;
        padding: 0;
        font-size: 16px;
        background: #5aace1;
        border: none;
        color: #fff;
      }
      .preview-equip:hover {
        background: #4e8cb6;
      }
      .preview-equip:active {
        background: #3d6e8f;
      }
      .settings-section {
        position: relative;
        margin: 0;
        box-sizing: border-box;
        width: 50%;
        height: 100%;
      }
      .settings-left-section {
        float: left;
        padding-right: 10px;
      }
      .settings-right-section {
        float: right;
        padding-left: 10px;
      }
      .settings-binding {
        position: relative;
        width: 100%;
        height: 20px;
        display: block;
        margin: 6px 0;
      }
      .settings-binding-label {
        float: left;
        text-align: left;
        line-height: 19px;
        font-size: 14px;
      }
      .settings-binding-box {
        float: right;
        padding: 1px;
        padding-left: 2px;
        background: #ddd;
        color: #000;
        border: 1px solid #999;
        margin-left: 4px;
        width: 50px;
        height: 17px;
        font-size: 14px;
        overflow: hidden;
        cursor: default;
      }
      .settings-binding-box:hover {
        background: #aaa;
      }
      .settings-header {
        font-size: 20px;
        display: inline-block;
      }
      .settings-description {
        font-size: 12px;
        color: #999;
        border-left: 3px solid #ddd;
        padding-left: 4px;
        margin: 10px 0;
      }
      .button.reset-bindings {
        display: inline-block;
        background: #ddd;
        border: none;
        box-shadow: 1px 1px 0 #333;
        color: #000;
        padding: 3px 10px;
      }
      .button.reset-bindings:hover {
        background: #999;
      }
      .settings-range-value {
        border: 1px solid #999;
        padding: 0 2px;
        border-radius: 4px;
      }
      .binding-banner {
        position: absolute;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, .7);
        backdrop-filter: blur(4px);
        align-items: center;
        justify-content: center;
        text-align: center;
        z-index: 10000;
        color: #fff;
        font-size: 20px;
        display: none;
      }
      .gamepad-button-icon {
        width: 20px;
        filter: brightness(10) invert(1);
        pointer-events: none !important;
      }
      .settings-binding-error {
        border-color: #ce2333;
        color: #ce2333;
        display: none;
      }
      .settings-wrapper {
        text-align: left !important;
      }
      .settings-wrapper label {
        font-size: 13px;
      }
      .settings-option {
        float: right !important;
      }
      .settings-wrapper input[type="checkbox"] {
        width: 20px !important;
        height: 20px !important;
        position: relative !important;
        margin-left: 10px !important;
        vertical-align: middle !important;
      }
      .settings-wrapper input[type="range"] {
        margin-top: -9px !important;
      }
      .settings-option-description {
        font-size: 12px;
        color: #999;
        padding-left: 10px;
        border-left: 1px solid #999;
      }
      input[type="range"] {
        width: 100%;
      }
      select {
        width: 70px;
        background: #ddd;
        border: none;
        padding: 4px 10px;
        color: #000 !important;
        border-radius: 0;
      }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  </head>
  <body>
    <script src="https://parking-master.github.io/Parking-Master-2.0/notiflix/notiflix-3.2.8.min.js"></script>
    <script src="/js/user.js"></script>
    <div class="window" data-gamepad-scrollable></div>
    <div class="binding-banner">Click any key to bind</div>
    <div class="wrapper">
      <div class="first-section">
        <div class="button-container button-container-keyboard_settings">
          <button class="button keyboard-settings-button" data-gamepad-index="0">Keyboard Settings</button>
        </div>
        <div class="button-container button-container-gamepad_settings">
          <button class="button gamepad-settings-button" data-gamepad-index="1">Gamepad Settings</button>
        </div>
        <div class="button-container button-container-touchscreen_settings">
          <button class="button touchscreen-settings-button" data-gamepad-index="2">Touchscreen Settings</button>
        </div>
        <div class="button-container button-container-performance_settings">
          <button class="button performance-settings-button" data-gamepad-index="3">Performance & Graphics</button>
        </div>
      </div>
      <div class="second-section">
        <div class="selection-container">
          <div class="item-list-header">Primary Weapon</div>
          <div class="item-list primary-weapon-list">
            <div class="item-card selected" data-group="primary-weapon" data-item="AK-74">
              <div class="item-card-preview" style="background-image: url(/images/weapon-previews/AK-74.png)"></div>
              <div class="item-card-name">AK-74</div>
            </div>
            <div class="item-card" data-group="primary-weapon" data-item="AR-15">
              <div class="item-card-preview" style="background-image: url(/images/weapon-previews/AR-15.png)"></div>
              <div class="item-card-name">AR-15</div>
            </div>
            <div class="item-card" data-group="primary-weapon" data-item="Ace-35r">
              <div class="item-card-preview" style="background-image: url(/images/weapon-previews/Ace-35r.png)"></div>
              <div class="item-card-name">Ace-35r</div>
            </div>
          </div>
        </div>
        <div class="selection-container">
          <div class="item-list-header">Secondary Weapon</div>
          <div class="item-list secondary-weapon-list">
            <div class="item-card selected" data-group="secondary-weapon" data-item="FN-502">
              <div class="item-card-preview small-preview" style="background-image: url(/images/weapon-previews/FN-502.png)"></div>
              <div class="item-card-name">FN-502</div>
            </div>
            <div class="item-card" data-group="secondary-weapon" data-item="XD-Mod-2">
              <div class="item-card-preview small-preview" style="background-image: url(/images/weapon-previews/XD-Mod-2.png)"></div>
              <div class="item-card-name">XD Mod.2</div>
            </div>
            <div class="item-card" data-group="secondary-weapon" data-item="Desert-Eagle">
              <div class="item-card-preview small-preview" style="background-image: url(/images/weapon-previews/Desert-Eagle.png)"></div>
              <div class="item-card-name">Desert Eagle</div>
            </div>
          </div>
        </div>
        <div class="selection-container">
          <div class="item-list-header">Grenades</div>
          <div class="item-list grenades-list">
            <div class="item-card selected" data-group="grenades" data-item="mk2">
              <div class="item-card-preview small-preview" style="background-image: url(/images/grenade-previews/mk2.png)"></div>
              <div class="item-card-name">Mk2</div>
            </div>
            <div class="item-card" data-group="grenades" data-item="plasma">
              <div class="item-card-preview small-preview" style="background-image: url(/images/grenade-previews/plasma.png)"></div>
              <div class="item-card-name">Plasma</div>
            </div>
            <div class="item-card"></div>
          </div>
        </div>
        <div class="selection-container">
          <div class="item-list-header">Armor</div>
          <div class="item-list character-list">
            <div class="item-card selected" data-group="character" data-item="Raven">
              <div class="item-card-preview tiny-preview" style="background-image: url(/images/character-previews/Raven.gif)"></div>
              <div class="item-card-name">Raven</div>
            </div>
            <div class="item-card" data-group="character" data-item="FOTUS">
              <div class="item-card-preview tiny-preview" style="background-image: url(/images/character-previews/FOTUS.gif)"></div>
              <div class="item-card-name">FOTUS</div>
            </div>
            <div class="item-card"></div>
          </div>
        </div>
        <div class="selection-container">
          <div class="item-list-header">Armor Ability</div>
          <div class="item-list armor-ability-list">
            <div class="item-card selected" data-group="armor-ability" data-item="none">
              <div class="item-card-preview tiny-preview" style="background-image: url(/images/armor-abilities/none.png)"></div>
              <div class="item-card-name">None</div>
            </div>
            <div class="item-card" data-group="armor-ability" data-item="jet-pack">
              <div class="item-card-preview tiny-preview" style="background-image: url(/images/armor-abilities/jet-pack.png)"></div>
              <div class="item-card-name">Jet Pack</div>
            </div>
            <div class="item-card" data-group="armor-ability" data-item="thruster-pack">
              <div class="item-card-preview tiny-preview" style="background-image: url(/images/armor-abilities/thruster-pack.png)"></div>
              <div class="item-card-name">Thruster Pack</div>
            </div>
            <div class="item-card" data-group="armor-ability" data-item="active-camo">
              <div class="item-card-preview tiny-preview" style="background-image: url(/images/armor-abilities/active-camo.png)"></div>
              <div class="item-card-name">Active Camo</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="/js/GamepadMenuControls.js"></script>
    <script>
      gamepadMenuControls = new GamepadMenuControls("preferences");
      Notiflix.Loading.init({ svgColor: "#fff" });
      Notiflix.Notify.init({
        info: { shadow:true,background:"#fff",textColor:"#25750a",notiflixIconColor:"#25750a" }
      });
      let itemData = {
        "AK-74": {
          type: "weapon",
          displayName: "AK-74",
          description: "Basic mid-range automatic rifle with a generous amount of ammo and decent power.",
          damage: 5.4,
          range: 4.3,
          fireRate: 6.4,
          accuracy: 3
        },
        "AR-15": {
          type: "weapon",
          displayName: "AR-15",
          description: "Long-range marksman style rifle with high precision and power thanks to armor piercing rounds.",
          damage: 5.7,
          range: 6.6,
          fireRate: 9.5,
          accuracy: 8.7
        },
        "Ace-35r": {
          type: "weapon",
          displayName: "Ace-35r",
          description: "Burst-fire battle rifle with decent power and lots of ammo, but lower accuracy.",
          damage: 4.9,
          range: 5,
          fireRate: 9.6,
          accuracy: 3.6
        },
        "FN-502": {
          type: "weapon",
          displayName: "FN-502",
          description: "Tactical lightweight pistol with a lot of ammo and good accuracy.",
          damage: 4.4,
          range: 6,
          fireRate: 9.5,
          accuracy: 8
        },
        "XD-Mod-2": {
          type: "weapon",
          displayName: "XD Mod.2",
          description: "Compact, very small pistol with great accuracy and armor piercing rounds.",
          damage: 4.9,
          range: 6.5,
          fireRate: 9.2,
          accuracy: 8.4
        },
        "Desert-Eagle": {
          type: "weapon",
          displayName: "Desert Eagle",
          description: "Heavy high-power pistol. Its ability to shock targets makes up for its low accuracy.",
          damage: 7,
          range: 4.5,
          fireRate: 4.1,
          accuracy: 2.9
        },
        "mk2": {
          type: "grenade",
          displayName: "Mk2 Frag Grenade",
          description: "Basic fragrance grenade with decent damage and a high explosive radius.",
          damage: 8,
          range: 7.5
        },
        "plasma": {
          type: "grenade",
          displayName: "Plasma Grenade",
          description: "Outputs a large field of burning plasma that instantly damages nearby targets. It can also stick to targets if aimed correctly.",
          damage: 9.2,
          range: 4.1
        },
        "Raven": {
          type: "character",
          displayName: "Raven",
          description: "Originally introduced in FPS3 as a Class I armor, The Raven is a newer Class II armor, offering things like advanced vision using tech goggles - along with upgraded armor abilities such as active camo."
        },
        "FOTUS": {
          type: "character",
          displayName: "FOTUS",
          description: 'The FOTUS Armor, which stands for Fist Of The Unicorn Skin, is a metafictional joke character originally from Halo 4 multiplayer. The spike on its helmet is a reference to the "Unicorn" in the name.'
        },
        "none": {
          type: "armor-ability",
          displayName: "None",
          description: "When chosen, no armor ability will be applied. Recommended if you like to make things more difficult than they have to be."
        },
        "jet-pack": {
          type: "armor-ability",
          displayName: "Jet Pack",
          description: "Basic Jet Pack that allows you to reach high surfaces and avoid explosives near the ground."
        },
        "thruster-pack": {
          type: "armor-ability",
          displayName: "Thruster Pack",
          description: "Instantly outputs a burst of gas that allows you to quickly escape from or lunge at enemies."
        },
        "active-camo": {
          type: "armor-ability",
          displayName: "Active Camoflauge",
          description: "Makes you look nearly invisible for a few seconds, using special light redirecting technology. Useful for planning sneak attacks or hiding to recover."
        },
      };
      function openWindow(title, content) {
        document.querySelector(".window").innerHTML = `
        <div class="window-header">${title} <span class="window-close">&times;</span></div>
        ${content}
        `;
        document.querySelector(".window").style.display = "block";
        gamepadMenuControls.enableCursor();
      }
      function closeWindow(removeLoading = true) {
        document.querySelector(".window").style.display = "";
        if (removeLoading) Notiflix.Loading.remove();
        gamepadMenuControls.disableCursor();
      }
      function selectItem(group, item, equip = true) {
        if (equip) {
          Notiflix.Notify.success(`${itemData[item].displayName} has been equipped.`);
          if (group == "primary-weapon") {
            let loadout = user.data.loadout;
            loadout[0] = item;
            user.set("loadout", loadout);
          } else if (group == "secondary-weapon") {
            let loadout = user.data.loadout;
            loadout[1] = item;
            user.set("loadout", loadout);
          } else if (group == "grenades") {
            let grenades = { "mk2": 0, "plasma": 0 };
            grenades[item] = 2;
            user.set("grenades", grenades);
          } else if (group == "character") {
            user.set("character", item);
          } else if (group == "armor-ability") {
            if (item == "none") {
              user.set("armorAbility", null);
            } else {
              user.set("armorAbility", item);
            }
          }
        }
        document.querySelector(`.${group}-list .item-card.selected`).classList.remove("selected");
        document.querySelector(`.${group}-list .item-card[data-item="${item}"]`).classList.add("selected");
        closeWindow();
      }
      function clickItem(card) {
        if (!card.dataset.item) return;
        Notiflix.Loading.circle();
        let item = itemData[card.dataset.item];
        if (item.type == "weapon") {
          openWindow(item.displayName, `
          <div class="preview-section preview-left-section" style="background-image: url(/images/weapon-previews/${card.dataset.item}.png)"></div>
          <div class="preview-section preview-right-section">
            <div class="preview-description">${item.description}</div>
            <div class="preview-specs">
              <div class="preview-specs-bar preview-specs-bar_damage" style="height: ${item.damage * 10}%; background: ${item.damage < 4 ? "#ff0000" : item.damage < 7 ? "#eee" : "#32CD32"}">${item.damage} / 10</div>

      function formatKeyBinding(key) {
        if (!key) return "";
        if (key.startsWith("Key")) key = key.replace("Key", "");
        if (key.startsWith("Digit")) key = key.replace("Digit", "");
        if (key == "BracketRight") key = "]";
        if (key == "BracketLeft") key = "[";
        return key;
      }
      function showBindingError(type, action) {
        document.querySelector(".settings-binding-error").textContent = `The "${action}" action is not bound to any ${type == "keyboard" ? "keys" : "buttons"}.`;
        document.querySelector(".settings-binding-error").style.display = "block";
      }
      function hideBindingError() {
        document.querySelector(".settings-binding-error").style.display = "";
      }
      function updateBindings(type) {
        let actionNotBinded = null;
        if (type == "keyboard") {
          for (action in user.data.settings.bindings.keyboard) {
            let binding = user.data.settings.bindings.keyboard[action];
            if (binding.length == 0) actionNotBinded = action;
            document.querySelector(`.settings-binding[data-action=${action}] .settings-binding-first-key`).textContent = formatKeyBinding(binding[0]);
            let secondBox = document.querySelector(`.settings-binding[data-action=${action}] .settings-binding-second-key`);
            if (typeof binding[1] === "undefined") {
              secondBox.textContent = "";
            } else {
              secondBox.textContent = formatKeyBinding(binding[1]);
            }
          }
        } else if (type == "gamepad") {
          for (action in user.data.settings.bindings.gamepad) {
            let binding = user.data.settings.bindings.gamepad[action];
            if (binding.length == 0) actionNotBinded = action;
            document.querySelector(`.settings-binding[data-action=${action}] .settings-binding-first-button`).innerHTML = `<img src="/images/assets/gamepad-buttons/${binding[0]}.png" alt="${binding[0]}" class="gamepad-button-icon">`;
            let secondBox = document.querySelector(`.settings-binding[data-action=${action}] .settings-binding-second-button`);
            if (typeof binding[1] === "undefined") {
              secondBox.innerHTML = "";
            } else {
              secondBox.innerHTML = `<img src="/images/assets/gamepad-buttons/${binding[1]}.png" alt="${binding[1]}" class="gamepad-button-icon">`;
            }
          }
        }
        if (actionNotBinded) {
          showBindingError(type, actionNotBinded);
        } else {
          hideBindingError();
        }
      }
      function updateLookSpeeds() {
        let mouseLookSpeed = document.querySelector(".settings-option-mouseLookSpeed");
        let gamepadLookSpeed = document.querySelector(".settings-option-gamepadLookSpeed");
        let gamepadLookAcceleration = document.querySelector(".settings-option-gamepadLookAcceleration");
        let touchLookSpeed = document.querySelector(".settings-option-touchLookSpeed");
        if (mouseLookSpeed) {
          mouseLookSpeed.value = user.data.settings.mouseLookSpeed;
          mouseLookSpeed.parentElement.querySelector(".settings-range-value").textContent = user.data.settings.mouseLookSpeed;
        } else if (gamepadLookSpeed) {
          gamepadLookSpeed.value = user.data.settings.gamepadLookSpeed;
          gamepadLookSpeed.parentElement.querySelector(".settings-range-value").textContent = user.data.settings.gamepadLookSpeed;
          gamepadLookAcceleration.value = user.data.settings.gamepadLookAcceleration;
          gamepadLookAcceleration.parentElement.querySelector(".settings-range-value").textContent = user.data.settings.gamepadLookAcceleration;
        } else if (touchLookSpeed) {
          touchLookSpeed.value = user.data.settings.touchLookSpeed;
          touchLookSpeed.parentElement.querySelector(".settings-range-value").textContent = user.data.settings.touchLookSpeed;
        }
      }
      function setLookSpeed(element, updateUser = false) {
        if (updateUser) {
          user.set("settings", user.data.settings);
        } else {
          let value = parseFloat(element.value);
          if (element.name == "mouseLookSpeed") {
            user.data.settings.mouseLookSpeed = value;
          } else if (element.name == "gamepadLookSpeed") {
            user.data.settings.gamepadLookSpeed = value;
          } else if (element.name == "gamepadLookAcceleration") {
            user.data.settings.gamepadLookAcceleration = value;
          } else if (element.name == "touchLookSpeed") {
            user.data.settings.touchLookSpeed = value;
          }
          updateLookSpeeds();
        }
      }
      function listenForBinding(type, element) {
        let banner = document.querySelector(".binding-banner");
        banner.style.display = "flex";
        if (type == "keyboard") {
          banner.textContent = "Click any key to bind (Esc to delete binding)";
          document.onkeydown = function(event) {
            event.preventDefault();
            document.onkeydown = null;
            banner.style.display = "";
            let binding = user.data.settings.bindings.keyboard[element.parentElement.dataset.action];
            let keyName = formatKeyBinding(event.code);
            let index = element.className.includes("second-key") ? 1 : 0;
            let otherIndex = index == 1 ? 0 : 1;
            if (event.code == "Escape") {
              binding.splice(index, 1);
            } else {
              if (binding[otherIndex] == event.code) binding.splice(otherIndex, 1);
              binding[index] = event.code;
            }
            user.set("settings", user.data.settings);
            updateBindings("keyboard");
          };
        } else if (type == "gamepad") {
          banner.textContent = "Click any button to bind (A + B to delete binding)";
          let previousButtonStates = {};
          let buttonMappings = ["a", "b", "x", "y", "lb", "rb", "lt", "rt", "back", "start", "l", "r", "up", "down", "left", "right"];
          function next(button) {
            banner.style.display = "";
            let binding = user.data.settings.bindings.gamepad[element.parentElement.dataset.action];
            let index = element.className.includes("second-button") ? 1 : 0;
            let otherIndex = index == 1 ? 0 : 1;
            if (button == null) {
              binding.splice(index, 1);
            } else {
              if (binding[otherIndex] == button) binding.splice(otherIndex, 1);
              binding[index] = button;
            }
            user.set("settings", user.data.settings);
            updateBindings("gamepad");
          }
          let pollings = 0;
          let ignoredButtons = {};
          function poll() {
            let gamepad = navigator.getGamepads()[0];
            if (gamepad) {
              for (let i = 0; i < gamepad.buttons.length; i++) {
                if (gamepad.buttons[0].pressed && gamepad.buttons[1].pressed) return next(null);
                if (gamepad.buttons[i].pressed) {
                  if (pollings == 0) {
                    ignoredButtons[buttonMappings[i]] = true;
                  } else {
                    if (!ignoredButtons[buttonMappings[i]]) previousButtonStates[buttonMappings[i]] = true;
                  }
                } else {
                  ignoredButtons[buttonMappings[i]] = false;
                  if (previousButtonStates[buttonMappings[i]]) return next(buttonMappings[i]);
                }
              }
            }
            pollings++;
            requestAnimationFrame(poll);
          }
          poll();
        }
      }
      function resetToDefault(type) {
        if (type == "keyboard") {
          user.data.settings.bindings.keyboard = {
            "jump": ["Space"],
            "fire": ["KeyF", "BracketRight"],
            "zoom": ["KeyI"],
            "reload": ["KeyR"],
            "switch": ["KeyY", "Tab"],
            "grenade": ["KeyG"],
            "melee": ["KeyB"],
            "armorAbility": ["KeyM"],
            "sprint": ["ShiftLeft"],
            "crouch": ["KeyC"],
            "enterVehicle": ["KeyE", "KeyT"],
            "vehicleView": ["KeyV"],
            "interact": ["KeyT"],
            "leaderboard": ["KeyL"],
            "pause": ["KeyP"]
          };
          user.set("settings", user.data.settings);
          updateBindings("keyboard");
        } else if (type == "mouse-aiming") {
          user.data.settings.mouseLookSpeed = 5;
          updateLookSpeeds();
          setLookSpeed(null, true);
        } else if (type == "gamepad") {
          user.data.settings.bindings.gamepad = {
            "jump": ["a"],
            "fire": ["rt"],
            "zoom": ["r"],
            "reload": ["rb"],
            "switch": ["y"],
            "grenade": ["lt"],
            "melee": ["b"],
            "armorAbility": ["lb"],
            "sprint": ["x"],
            "crouch": ["l"],
            "enterVehicle": ["rb"],
            "vehicleView": ["x"],
            "interact": ["rb"],
            "leaderboard": ["back"],
            "pause": ["start"]
          };
          user.set("settings", user.data.settings);
          updateBindings("gamepad");
        } else if (type == "gamepad-aiming") {
          user.data.settings.gamepadLookSpeed = 5;
          user.data.settings.gamepadLookAcceleration = 5;
          updateLookSpeeds();
          setLookSpeed(null, true);
        } else if (type == "touchscreen-aiming") {
          user.data.settings.touchLookSpeed = 5;
          updateLookSpeeds();
          setLookSpeed(null, true);
        }
      }
      document.addEventListener("click", function(event) {
        if (event.target.className.includes("item-card")) {
          clickItem(event.target);
        } else if (event.target.className.includes("window-close")) {
          closeWindow();
        } else if (event.target.className.includes("keyboard-settings-button")) {
          openSettings("keyboard");
        } else if (event.target.className.includes("gamepad-settings-button")) {
          openSettings("gamepad");
        } else if (event.target.className.includes("touchscreen-settings-button")) {
          openSettings("touchscreen");
        } else if (event.target.className.includes("performance-settings-button")) {
          openSettings("performance");
        } else if (event.target.className.includes("settings-binding-box")) {
          if (event.target.className.includes("key")) {
            listenForBinding("keyboard", event.target);
          } else {
            listenForBinding("gamepad", event.target);
          }
        } else if (event.target.className.includes("reset-keyboard-bindings")) {
          resetToDefault("keyboard");
        } else if (event.target.className.includes("reset-mouse-bindings")) {
          resetToDefault("mouse-aiming");
        } else if (event.target.className.includes("reset-gamepad-bindings")) {
          resetToDefault("gamepad");
        } else if (event.target.className.includes("reset-gamepad-aiming-bindings")) {
          resetToDefault("gamepad-aiming");
        } else if (event.target.className.includes("reset-touchscreen-aiming-bindings")) {
          resetToDefault("touchscreen-aiming");
        }
      });
      function onWindowResize() {
        document.querySelectorAll(".item-list").forEach(list => {
          if (parseFloat(getComputedStyle(list).height) < list.scrollHeight) {
            list.parentElement.classList.add("scrollable");
          } else {
            list.parentElement.classList.remove("scrollable");
          }
        });
      }
      onWindowResize();
      window.addEventListener("resize", onWindowResize);
      selectItem("primary-weapon", user.data.loadout[0], false);
      selectItem("secondary-weapon", user.data.loadout[1], false);
      selectItem("grenades", user.data.grenades["mk2"] == 2 ? "mk2" : "plasma", false);
      selectItem("character", user.data.character, false);
      selectItem("armor-ability", user.data.armorAbility || "none", false);
    </script>
  </body>
