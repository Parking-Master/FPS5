<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Players | FPS5</title>
    <style>
      @font-face {
        font-family: "Aperture";
        src: url(/fonts/Aperture.ttf);
      }
      html, body {
        margin: 0 !important;
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden !important;
      }
      .wrapper {
        position: absolute;
        width: 100%;
        height: 100%;
        margin: 0;
        background: #cdd3d8;
        border: 20px solid #d9d9d9;
        box-sizing: border-box;
        background-image: url(/images/menu/splatter.png);
        background-repeat: no-repeat;
        background-position: center;
        background-size: 70%;
        overflow: hidden;
      }
      .users-wrapper {
        position: relative;
        max-width: 700px;
        height: 100%;
        padding-top: 40px;
        font-family: "Aperture";
        overflow-y: scroll;
        overflow-x: hidden;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .users-wrapper::-webkit-scrollbar { 
        display: none;
      }
      .user-container {
        position: relative;
        width: 100%;
        max-width: 600px;
        left: 100px;
        display: flex;
        border-left: 1px solid #fff;
        color: #fff;
        margin-bottom: 10px;
        cursor: pointer !important;
        box-shadow: -10px 0 2px rgba(255, 255, 255, .1);
        background: rgba(255, 255, 255, .1);
      }
      .user-container::before {
        content: "";
        position: relative;
        width: 100px;
        height: 1px;
        background: #bbb;
        left: -101px;
        top: 14px;
      }
      .user-container:last-child {
        margin-bottom: 150px;
      }
      .users-wrapper-header .user-profile-picture {
        background: none !important;
      }
      .user-container * {
        flex: 1;
        line-height: 30px;
        font-size: 16px;
        text-align: center;
      }
      .users-wrapper-header * {
        font-size: 10px !important;
      }
      .user-profile-picture {
        position: relative;
        width: 20px;
        height: 20px;
        background-image: url(https://cdn.jsdelivr.net/gh/Parking-Master/Parking-Master@latest/img/profile-picture.png);
        background-size: 100%;
        background-position: center;
        background-repeat: no-repeat;
        background-color: #fff;
        border-radius: 100%;
        flex-grow: 0;
        flex-basis: 20px;
        margin-left: -70px;
        top: 5px;
      }
      .user-username {
        position: relative;
        max-width: 200px;
        text-overflow: ellipsis;
        overflow: hidden;
        flex: 2;
      }
      .user-container:hover {
        background: rgba(255, 255, 255, .2);
      }
      .header {
        color: #2b78aa;
        font-family: "Aperture";
        font-size: 36px;
        margin-left: 100px;
        margin-top: 40px;
      }
      @media only screen and (max-width:760px) {
        .user-container {
          left: 50px;
        }
        .user-container::before {
          width: 50px;
          left: -51px;
        }
        .user-profile-picture {
          margin-left: -20px;
        }
      }
      .loader-banner {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        background: #d9d9d9;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity .3s;
        pointer-events: none !important;
      }
      .loader {
        position: absolute;
        width: 40px;
        height: 60px;
      }
      .loader::before, .loader::after {
        content: "";
        position: absolute;
        inset: 0;
        background: #5aace1;
        clip-path: polygon(0 0,100% 0, 100% 67%,50% 67%,50% 34%,0 34%);
        animation: sp7 2s infinite;
      }
      .loader::after {
        --s: -1, -1;
      }
      @keyframes sp7 {
        0%, 10% { transform: scale(var(--s, 1)) translate(0,0) rotate(0deg) }
        33% { transform:scale(var(--s, 1)) translate(0,-20px) rotate(0deg) }
        66% { transform:scale(var(--s, 1)) translate(10px,-20px) rotate(-90deg) }
        90%, 100% { transform:scale(var(--s, 1)) translate(10px,-10px) rotate(-90deg) }
      }
    </style>
  </head>
  <body>
    <script src="https://parking-master.github.io/Parking-Master-2.0/notiflix/notiflix-3.2.8.min.js"></script>
    <script src="/js/user.js"></script>
    <div class="loader-banner">
      <div class="loader"></div>
    </div>
    <div class="wrapper">
      <div class="header">All Players</div>
      <div class="users-wrapper">
        <div class="user-container users-wrapper-header">
          <div class="user-profile-picture"></div>
          <div class="user-username">Username</div>
          <div class="user-points">Points</div>
          <div class="user-join-date">Joined</div>
          <div class="user-games-played">Games Played</div>
          <div class="user-games-won">Games Won</div>
        </div>
      </div>
    </div>
    <script>
      function formatNumber(number) {
        return number.toString().replace(/\B(?=(\d{3})+(?!\d))/g,",");
      }
      let usersWrapper = document.querySelector(".users-wrapper");
      let startTime = Date.now();
      user.getAllUsers(function(users) {
        for (let i = 0; i < users.length; i++) {
          let user = users[i];
          usersWrapper.innerHTML += `
          <div class="user-container">
            <div class="user-profile-picture" style="background-image: url(${user.profilePicture})"></div>
            <div class="user-username">${user.username}</div>
            <div class="user-points">${formatNumber(user.points)}</div>
            <div class="user-join-date">${new Date(user.createdAt).toLocaleDateString()}</div>
            <div class="user-games-played">${formatNumber(user.gamesPlayed)}</div>
            <div class="user-games-won">${formatNumber(user.gamesWon)}</div>
          </div>
          `;
        }
        function checkTime() {
          if (Date.now() - startTime > 2000) {
            let loader = document.querySelector(".loader-banner");
            loader.style.opacity = "0";
            setTimeout(() => loader.remove(), 500);
          } else {
            requestAnimationFrame(checkTime);
          }
        }
        checkTime();
      });
    </script>
  </body>
</html>
